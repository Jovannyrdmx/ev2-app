<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EV2 — Barra</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a14">
    <link rel="icon" href="images/favicon-32x32.png" type="image/png" sizes="32x32">
    <meta name="ev2:api" content="/api">
    <meta name="ev2:ws" content="">
    <meta name="ev2:club" content="ev2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap');

        :root {
            --ev2-cyan: #00BFFF;
            --ev2-pink: #FF1493;
            --ev2-lime: #00FF00;
            --ev2-gold: #FFD700;
            --ev2-red: #FF4444;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 100%);
        }

        .font-display { font-family: 'Poppins', sans-serif; font-weight: 700; }

        .ev2-gradient {
            background: linear-gradient(135deg, var(--ev2-cyan) 0%, var(--ev2-pink) 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }

        .ev2-button {
            background: linear-gradient(135deg, var(--ev2-cyan), var(--ev2-pink));
            color: #000; font-weight: 700;
            transition: filter .15s ease, transform .1s ease;
        }
        .ev2-button:active { transform: scale(.98); }
        .ev2-button:disabled { filter: grayscale(1) brightness(.55); cursor: not-allowed; }

        /* La barra se opera de pie, con las manos ocupadas y poca luz: nada chico. */
        button, .tap { min-height: 48px; }

        .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); }

        /* El color dice cuánto lleva esperando, sin tener que leer el número. */
        .wait-ok   { border-left: 5px solid var(--ev2-cyan); }
        .wait-warn { border-left: 5px solid var(--ev2-gold); }
        .wait-late { border-left: 5px solid var(--ev2-red); box-shadow: 0 0 16px rgba(255,68,68,.25); }

        .lane-tab { border-bottom: 3px solid transparent; color: rgba(255,255,255,.5); }
        .lane-tab.active { color: var(--ev2-cyan); border-bottom-color: var(--ev2-cyan); }
        .lane-count {
            display: inline-block; min-width: 1.4rem; padding: 0 .35rem; margin-left: .35rem;
            border-radius: 9999px; background: rgba(255,255,255,.12); font-size: .7rem; font-weight: 700;
        }
        .lane-tab.active .lane-count { background: var(--ev2-cyan); color: #000; }

        .stat-card {
            background: rgba(0,191,255,.10); border: 1px solid var(--ev2-pink);
            border-radius: 10px; padding: 8px 6px; text-align: center;
        }
        .stat-number { font-size: 1.4rem; font-weight: 700; color: var(--ev2-lime); line-height: 1.1; }
        .stat-label { font-size: .6rem; color: var(--ev2-cyan); text-transform: uppercase; letter-spacing: .05em; }

        .dot { width: .5rem; height: .5rem; border-radius: 9999px; display: inline-block; }
        .dot-on { background: var(--ev2-lime); }
        .dot-off { background: var(--ev2-red); }
        .dot-wait { background: var(--ev2-gold); }

        @keyframes flash-in { from { background: rgba(0,191,255,.35); } to { background: rgba(255,255,255,.05); } }
        .just-arrived { animation: flash-in 1.4s ease-out; }

        .chip {
            padding: .2rem .55rem; border-radius: 9999px; font-size: .68rem;
            background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
        }
        .chip.on { background: var(--ev2-cyan); color: #000; border-color: var(--ev2-cyan); font-weight: 700; }

        .field { width: 100%; padding: .6rem 1rem; border-radius: .6rem; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); outline: none; }
        .field:focus { border-color: var(--ev2-cyan); }
        [hidden] { display: none !important; }
    </style>
</head>
<body class="text-white">
<div class="max-w-3xl mx-auto min-h-screen flex flex-col">

  <!-- ============================ ENTRAR ============================ -->
  <section id="screen-auth" class="flex-1 flex flex-col justify-center px-6 py-10 max-w-md w-full mx-auto">
    <div class="text-center mb-8">
      <h1 class="font-display text-3xl ev2-gradient mb-1">EV2 · <span data-i18n="bar.title">Barra</span></h1>
      <p class="text-white/50 text-sm" data-i18n="auth.signin">Entrar</p>
    </div>
    <form id="form-login" class="space-y-3">
      <input id="login-email" type="email" autocomplete="email" required placeholder="Correo" data-i18n-placeholder="auth.email"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <input id="login-password" type="password" autocomplete="current-password" required placeholder="Contraseña" data-i18n-placeholder="auth.password"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display" data-i18n="auth.enter">Entrar al club</button>
    </form>
    <p id="auth-error" class="mt-4 text-sm text-red-300 text-center" hidden></p>
  </section>


  <!-- ====== CONTRASEÑA TEMPORAL: el servidor bloquea todo hasta cambiarla ====== -->
  <section id="screen-password" class="flex-1 flex flex-col justify-center px-6 py-10 max-w-md w-full mx-auto" hidden>
    <h2 class="font-display text-2xl ev2-gradient mb-1" data-i18n="gate.title">Cambia tu contraseña</h2>
    <p class="text-sm text-white/60 mb-6" data-i18n="gate.note">Entraste con una contraseña temporal.</p>
    <form id="form-password" class="space-y-3">
      <input id="pw-current" type="password" autocomplete="current-password" required placeholder="Contraseña temporal" data-i18n-placeholder="gate.current" class="field">
      <input id="pw-new" type="password" autocomplete="new-password" required minlength="8" placeholder="Contraseña nueva (mínimo 8)" data-i18n-placeholder="gate.new" class="field">
      <input id="pw-repeat" type="password" autocomplete="new-password" required placeholder="Repite la nueva" data-i18n-placeholder="gate.repeat" class="field">
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display" data-i18n="gate.save">Cambiar y entrar</button>
    </form>
    <p id="pw-error" class="mt-4 text-sm text-red-300 text-center" hidden></p>
    <button id="btn-pw-logout" class="mt-6 text-sm text-white/50 underline" data-i18n="top.signOut">Salir</button>
  </section>

  <!-- ============ ENTRÓ ALGUIEN QUE NO ES DE LA BARRA ============ -->
  <section id="screen-wrong-role" class="flex-1 flex flex-col justify-center px-6 py-10 text-center max-w-md w-full mx-auto" hidden>
    <p class="text-xs uppercase tracking-widest text-white/40" data-i18n="staff.signedInAs">Entraste como</p>
    <h2 id="wrong-role" class="font-display text-2xl ev2-gradient mb-4">—</h2>
    <p id="wrong-role-note" class="text-sm text-white/60"></p>
    <button id="btn-wrong-logout" class="mt-8 text-sm text-white/60 underline" data-i18n="top.signOut">Salir</button>
  </section>

  <!-- ============================ COLA ============================ -->
  <section id="screen-bar" class="flex-1 flex flex-col" hidden>
    <header class="px-4 py-3 flex items-center justify-between border-b border-white/10 sticky top-0 backdrop-blur bg-black/80 z-20">
      <div>
        <p class="font-display text-lg ev2-gradient leading-none">EV2 · <span data-i18n="bar.title">Barra</span></p>
        <p class="text-xs text-white/50"><span id="me-name">—</span></p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-white/50 flex items-center gap-1">
          <span id="rt-dot" class="dot dot-off"></span><span id="rt-text">Conectando…</span>
        </span>
        <button id="btn-alert" class="text-xs text-white/60 px-2" title="Aviso"><i class="fa-solid fa-bell"></i></button>
        <button id="btn-lang" class="text-xs text-white/60 px-2">EN</button>
        <button id="btn-logout" class="text-xs text-white/60 px-2" title="Salir" data-i18n-title="top.signOut"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>

    <div id="banner" class="px-4 py-2 text-sm text-center bg-amber-500/20 text-amber-100" hidden></div>

    <!-- Cual barra. Solo aparece cuando el club tiene mas de una. -->
    <div id="bar-chips" class="px-4 pt-3 flex gap-2 overflow-x-auto" hidden></div>

    <!--
      La venta en la barra: el cliente que llega, pide y paga ahi mismo. Es el boton mas
      grande de la pantalla despues de la cola, porque es lo segundo que mas se toca en
      una noche.
    -->
    <div class="px-4 pt-3">
      <button id="btn-new-sale" class="ev2-button w-full py-3 rounded-xl font-display">
        <i class="fa-solid fa-cash-register mr-2"></i><span data-i18n="sale.new">Venta en la barra</span>
      </button>
    </div>

    <!--
      Pedir al almacén. Quien sabe qué falta es el cantinero mirando su estante a
      las once de la noche, no el almacenista a las seis de la tarde: por eso el
      botón vive aquí y no allá. El número avisa de lo que ya se pidió y todavía no
      llega, para que nadie pida dos veces lo mismo.
    -->
    <div class="px-4 pt-2">
      <button id="btn-restock" class="w-full py-3 rounded-xl card text-sm font-semibold">
        <i class="fa-solid fa-dolly mr-2"></i><span data-i18n="req.ask">Pedir al almacén</span>
        <span id="restock-pending" class="lane-count" hidden>0</span>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2 px-4 pt-3">
      <div class="stat-card">
        <div class="stat-number" id="stat-open">—</div>
        <div class="stat-label" data-i18n="bar.open">Abiertos</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-oldest">—</div>
        <div class="stat-label" data-i18n="bar.oldest">El más viejo</div>
      </div>
    </div>

    <nav class="flex px-2 pt-3 border-b border-white/10 sticky top-[57px] bg-black/80 backdrop-blur z-10">
      <button data-lane="new" class="lane-tab active flex-1 py-3 text-sm font-semibold">
        <span data-i18n="bar.laneNew">Nuevos</span><span class="lane-count" id="count-new">0</span>
      </button>
      <button data-lane="prep" class="lane-tab flex-1 py-3 text-sm font-semibold">
        <span data-i18n="bar.lanePrep">En preparación</span><span class="lane-count" id="count-prep">0</span>
      </button>
      <button data-lane="ready" class="lane-tab flex-1 py-3 text-sm font-semibold">
        <span data-i18n="bar.laneReady">Listos</span><span class="lane-count" id="count-ready">0</span>
      </button>
    </nav>

    <main class="flex-1 overflow-y-auto p-3 space-y-3">
      <p id="lane-empty" class="text-center text-white/40 text-sm py-16"></p>
      <div id="lane-list" class="space-y-3"></div>
    </main>
  </section>

  <!-- ====================== VENTA EN LA BARRA ====================== -->
  <div id="sale-sheet" class="fixed inset-0 z-40 bg-slate-950/95 backdrop-blur flex flex-col" hidden>
    <header class="px-4 py-3 flex items-center justify-between border-b border-white/10">
      <div class="min-w-0">
        <p class="font-display text-lg" data-i18n="sale.title">Venta en la barra</p>
        <p id="sale-bar" class="text-xs text-white/50 truncate">—</p>
      </div>
      <button id="btn-sale-close" class="px-3 py-2 rounded-xl card text-sm" data-i18n="sale.close">Cerrar</button>
    </header>

    <div class="px-4 pt-3">
      <input id="sale-search" type="search" class="field" placeholder="Buscar en la carta"
             data-i18n-placeholder="sale.search">
    </div>

    <div id="sale-menu" class="flex-1 overflow-y-auto px-4 py-3 space-y-2"></div>

    <div class="px-4 py-3 border-t border-white/10 space-y-3 bg-black/40">
      <div id="sale-cart" class="space-y-1 max-h-32 overflow-y-auto"></div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-white/60" data-i18n="sale.total">Total</span>
        <span id="sale-total" class="font-display text-2xl">—</span>
      </div>

      <select id="sale-method" class="field"></select>
      <input id="sale-reference" class="field uppercase" placeholder="Folio del voucher"
             data-i18n-placeholder="sale.reference" maxlength="40" hidden>

      <button id="btn-sale-charge" class="ev2-button w-full py-4 rounded-xl font-display"
              data-i18n="sale.charge" disabled>Cobrar y preparar</button>
      <p id="sale-error" class="text-sm text-red-300" hidden></p>
    </div>
  </div>

  <!-- ====================== PEDIR AL ALMACÉN ======================
       Nace con lo que está bajo mínimo en ESTA barra ya marcado y con la cantidad
       sugerida: a las once de la noche, pedir tiene que ser un toque. Lo que el
       almacén tampoco tiene sale aparte, como lista de compra, porque perseguir
       producto que no existe es lo que hace inservible una lista de surtido. -->
  <div id="req-sheet" class="fixed inset-0 z-40 bg-slate-950/95 backdrop-blur flex flex-col" hidden>
    <header class="px-4 py-3 flex items-center justify-between border-b border-white/10">
      <div class="min-w-0">
        <p class="font-display text-lg" data-i18n="req.title">Pedir al almacén</p>
        <p id="req-bar" class="text-xs text-white/50 truncate">—</p>
      </div>
      <button id="btn-req-close" class="px-3 py-2 rounded-xl card text-sm" data-i18n="sale.close">Cerrar</button>
    </header>

    <nav class="flex px-2 pt-2 border-b border-white/10 text-sm">
      <button data-req-tab="new" class="lane-tab active flex-1 py-3 font-semibold">
        <span data-i18n="req.tabNew">Pedir</span>
      </button>
      <button data-req-tab="mine" class="lane-tab flex-1 py-3 font-semibold">
        <span data-i18n="req.tabMine">Mis pedidos</span><span class="lane-count" id="req-count-mine">0</span>
      </button>
    </nav>

    <div id="req-body" class="flex-1 overflow-y-auto px-4 py-3 space-y-2"></div>

    <div id="req-footer" class="px-4 py-3 border-t border-white/10 space-y-3 bg-black/40">
      <input id="req-note" class="field" maxlength="300" placeholder="Nota para el almacén (opcional)"
             data-i18n-placeholder="req.note">
      <button id="btn-req-send" class="ev2-button w-full py-4 rounded-xl font-display"
              data-i18n="req.send" disabled>Enviar pedido</button>
      <p id="req-error" class="text-sm text-red-300" hidden></p>
    </div>
  </div>

  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm z-50" hidden></div>
</div>

<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/roles.js"></script>
<script src="js/password-gate.js"></script>
<script src="js/client.js"></script>
<script src="js/order-taking.js"></script>
<script src="js/bar-queue.js"></script>
<script src="js/receiving.js"></script>
<script src="js/bartender-screen.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
