<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EV2 — Valet</title>
    <link rel="icon" href="images/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a14">
    <meta name="ev2:api" content="/api">
    <meta name="ev2:ws" content="">
    <meta name="ev2:club" content="ev2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap');

        :root {
            --ev2-cyan: #00BFFF;
            --ev2-pink: #FF1493;
            --ev2-lime: #00FF00;
            --ev2-gold: #FFD700;
            --ev2-red: #FF4444;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 100%); }
        .font-display { font-family: 'Poppins', sans-serif; font-weight: 700; }
        .ev2-gradient {
            background: linear-gradient(135deg, var(--ev2-cyan) 0%, var(--ev2-pink) 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .ev2-button {
            background: linear-gradient(135deg, var(--ev2-cyan), var(--ev2-pink));
            color: #000; font-weight: 700;
            transition: filter .15s ease, transform .1s ease;
        }
        .ev2-button:active { transform: scale(.98); }
        .ev2-button:disabled { filter: grayscale(1) brightness(.55); cursor: not-allowed; }

        button, select, input, textarea, .tap { min-height: 48px; }

        .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); }
        .wait-ok { border-left: 5px solid var(--ev2-cyan); }
        .wait-warn { border-left: 5px solid var(--ev2-gold); }
        .wait-late { border-left: 5px solid var(--ev2-red); box-shadow: 0 0 16px rgba(255,68,68,.25); }

        .tab { border-bottom: 3px solid transparent; color: rgba(255,255,255,.5); font-weight: 600; }
        .tab.active { color: var(--ev2-cyan); border-bottom-color: var(--ev2-cyan); }
        .tab-count {
            display: inline-block; min-width: 1.4rem; padding: 0 .35rem; margin-left: .35rem;
            border-radius: 9999px; background: rgba(255,255,255,.12); font-size: .7rem; font-weight: 700;
        }
        .tab.active .tab-count { background: var(--ev2-cyan); color: #000; }

        .stat-card {
            background: rgba(0,191,255,.10); border: 1px solid var(--ev2-pink);
            border-radius: 10px; padding: 10px 6px; text-align: center;
        }
        .stat-number { font-size: 1.5rem; font-weight: 700; color: var(--ev2-lime); line-height: 1.1; }
        .stat-label { font-size: .6rem; color: var(--ev2-cyan); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

        .pill { font-size: .65rem; padding: .15rem .5rem; border-radius: 9999px; font-weight: 700; white-space: nowrap; }
        .pill-ok { background: rgba(0,255,0,.18); color: var(--ev2-lime); }
        .pill-wait { background: rgba(255,215,0,.18); color: var(--ev2-gold); }
        .pill-off { background: rgba(255,255,255,.12); color: rgba(255,255,255,.6); }
        .pill-bad { background: rgba(255,68,68,.18); color: var(--ev2-red); }

        .field { width: 100%; padding: .6rem 1rem; border-radius: .6rem; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); outline: none; }
        .field:focus { border-color: var(--ev2-cyan); }
        .field.bad { border-color: var(--ev2-red); }
        .field-error { font-size: .7rem; color: var(--ev2-red); margin-top: .15rem; }
        .label { font-size: .68rem; color: rgba(255,255,255,.5); display: block; margin-bottom: .2rem; }

        .dot { width: .5rem; height: .5rem; border-radius: 9999px; display: inline-block; }
        .dot-on { background: var(--ev2-lime); }
        .dot-off { background: var(--ev2-red); }
        .dot-wait { background: var(--ev2-gold); }

        @keyframes flash-in { from { background: rgba(0,255,0,.3); } to { background: rgba(255,255,255,.05); } }
        .just-arrived { animation: flash-in 1.6s ease-out; }

        [hidden] { display: none !important; }
    </style>
</head>
<body class="text-white">
<div class="max-w-2xl mx-auto min-h-screen flex flex-col">

  <!-- ============================ ENTRAR ============================ -->
  <section id="screen-auth" class="flex-1 flex flex-col justify-center px-6 py-10 max-w-md w-full mx-auto">
    <div class="text-center mb-8">
      <h1 class="font-display text-3xl ev2-gradient mb-1">EV2 · <span data-i18n="valet.title">—</span></h1>
      <p class="text-white/50 text-sm" data-i18n="auth.signin">—</p>
    </div>
    <form id="form-login" class="space-y-3">
      <input id="login-email" type="email" autocomplete="email" required placeholder="Correo" data-i18n-placeholder="auth.email" class="field">
      <input id="login-password" type="password" autocomplete="current-password" required placeholder="Contraseña" data-i18n-placeholder="auth.password" class="field">
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display" data-i18n="auth.enter">Entrar al club</button>
    </form>
    <!-- El personal de piso ya no tiene contraseña: entra con su PIN, y el teclado
         está en la pantalla de acceso. Sin este enlace, quien abre esta página
         directamente se queda mirando un formulario que no puede llenar. -->
    <a href="index.html" class="block mt-4 text-center text-sm text-white/50 underline"
       data-i18n="pin.usePin">Entrar con PIN</a>
    <p id="auth-error" class="mt-4 text-sm text-red-300 text-center" hidden></p>
  </section>

  <!-- ====== CONTRASEÑA TEMPORAL: el servidor bloquea todo hasta cambiarla ====== -->
  <section id="screen-password" class="flex-1 flex flex-col justify-center px-6 py-10 max-w-md w-full mx-auto" hidden>
    <h2 class="font-display text-2xl ev2-gradient mb-1" data-i18n="gate.title">Cambia tu contraseña</h2>
    <p class="text-sm text-white/60 mb-6" data-i18n="gate.note">Entraste con una contraseña temporal.</p>
    <form id="form-password" class="space-y-3">
      <input id="pw-current" type="password" autocomplete="current-password" required placeholder="Contraseña temporal" data-i18n-placeholder="gate.current" class="field">
      <input id="pw-new" type="password" autocomplete="new-password" required minlength="8" placeholder="Contraseña nueva (mínimo 8)" data-i18n-placeholder="gate.new" class="field">
      <input id="pw-repeat" type="password" autocomplete="new-password" required placeholder="Repite la nueva" data-i18n-placeholder="gate.repeat" class="field">
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display" data-i18n="gate.save">Cambiar y entrar</button>
    </form>
    <p id="pw-error" class="mt-4 text-sm text-red-300 text-center" hidden></p>
    <button id="btn-pw-logout" class="mt-6 text-sm text-white/50 underline" data-i18n="top.signOut">Salir</button>
  </section>

  <!-- ============ ENTRÓ ALGUIEN QUE NO ES DE ESTE PUESTO ============ -->
  <section id="screen-wrong-role" class="flex-1 flex flex-col justify-center px-6 py-10 text-center max-w-md w-full mx-auto" hidden>
    <p class="text-xs uppercase tracking-widest text-white/40" data-i18n="staff.signedInAs">Entraste como</p>
    <h2 id="wrong-role" class="font-display text-2xl ev2-gradient mb-4">—</h2>
    <p id="wrong-role-note" class="text-sm text-white/60"></p>
    <button id="btn-wrong-logout" class="mt-8 text-sm text-white/60 underline" data-i18n="top.signOut">Salir</button>
  </section>


  <!-- ============================ VALET ============================ -->
  <section id="screen-valet" class="flex-1 flex flex-col" hidden>
    <header class="px-4 py-3 flex items-center justify-between border-b border-white/10 sticky top-0 backdrop-blur bg-black/80 z-20">
      <div>
        <p class="font-display text-lg ev2-gradient leading-none">EV2 · <span data-i18n="valet.title">Valet</span></p>
        <p class="text-xs text-white/50"><span id="me-name">—</span> · <span id="handover"></span></p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-white/50 flex items-center gap-1">
          <span id="rt-dot" class="dot dot-off"></span><span id="rt-text">Conectando…</span>
        </span>
        <button id="btn-lang" class="text-xs text-white/60 px-2">EN</button>
        <button id="btn-logout" class="text-xs text-white/60 px-2" data-i18n-title="top.signOut" title="Salir"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>
    <div id="banner" class="px-4 py-2 text-sm text-center bg-amber-500/20 text-amber-100" hidden></div>

    <!-- El código del cliente se muestra UNA vez al recibir el auto. -->
    <div id="secret-box" class="m-4 rounded-xl p-4" style="background:rgba(0,255,0,.08);border:2px solid var(--ev2-lime)" hidden>
      <p class="text-xs uppercase tracking-wider" style="color:var(--ev2-lime)"><span data-i18n="valet.qrForGuest">Código para el cliente</span> — <span id="secret-plate"></span></p>
      <p id="secret-value" class="font-display text-xl tracking-wider my-2 select-all break-all">—</p>
      <p class="text-[11px] text-white/60" data-i18n="valet.qrForGuestNote">Se muestra una sola vez.</p>
      <button id="btn-secret-ok" class="ev2-button rounded-lg px-4 py-2 mt-3 text-sm" data-i18n="manager.gotIt">Ya lo anoté</button>
    </div>

    <div class="px-4 pt-3 space-y-2">
      <button id="btn-new-ticket" class="ev2-button w-full py-3 rounded-xl font-display" data-i18n="valet.newTicket">Recibir un auto</button>
      <input id="search" class="field" placeholder="Buscar por placa" data-i18n-placeholder="valet.searchPlate">
    </div>

    <form id="ticket-form" class="card rounded-xl p-4 m-4 space-y-3" hidden>
      <div><label class="label" for="t-plate" data-i18n="valet.plate">Placa</label><input id="t-plate" class="field" maxlength="20"><p class="field-error" data-error="plate" hidden></p></div>
      <div><label class="label" for="t-desc" data-i18n="valet.vehicleDesc">Cómo es el coche</label><input id="t-desc" class="field" maxlength="120"></div>
      <div><label class="label" for="t-spot" data-i18n="valet.spot">Cajón</label><select id="t-spot" class="field"></select></div>
      <div><label class="label" for="t-phone" data-i18n="valet.phone">Teléfono del cliente (opcional)</label><input id="t-phone" class="field" maxlength="30"></div>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="btn-ticket-cancel" class="card rounded-lg py-2 text-sm" data-i18n="manager.cancel">Cancelar</button>
        <button type="submit" class="ev2-button rounded-lg py-2" data-i18n="valet.save">Recibir</button>
      </div>
    </form>

    <nav class="flex px-2 border-b border-white/10 sticky top-[57px] bg-black/80 backdrop-blur z-10">
      <button data-lane="requested" class="tab active flex-1 py-3 text-sm"><span data-i18n="valet.laneRequested">Lo pidieron</span><span class="tab-count" id="count-requested">0</span></button>
      <button data-lane="ready" class="tab flex-1 py-3 text-sm"><span data-i18n="valet.laneReady">En la puerta</span><span class="tab-count" id="count-ready">0</span></button>
      <button data-lane="parked" class="tab flex-1 py-3 text-sm"><span data-i18n="valet.laneParked">Guardados</span><span class="tab-count" id="count-parked">0</span></button>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 space-y-3">
      <p id="lane-empty" class="text-center text-white/40 text-sm py-16"></p>
      <div id="lane-list" class="space-y-3"></div>
    </main>

    <!-- Entregar: el QR del cliente es lo único que impide dar el coche a quien no es. -->
    <div id="qr-box" class="fixed inset-0 bg-black/85 flex items-end z-40" hidden>
      <div class="w-full max-w-md mx-auto p-5 space-y-3 rounded-t-2xl" style="background:#12081f;border-top:2px solid var(--ev2-cyan)">
        <p class="font-display text-lg" data-i18n="valet.qrTitle">Pide el QR al cliente</p>
        <p class="text-xs text-white/50" data-i18n="valet.qrNote">Es lo único que impide entregar un coche a quien no es.</p>
        <p id="qr-plate" class="text-sm" style="color:var(--ev2-cyan)"></p>
        <input id="qr-token" class="field" placeholder="Código del cliente" data-i18n-placeholder="valet.qrToken" autocomplete="off">
        <div><label class="label" for="qr-payment" data-i18n="valet.payment">Cómo paga</label>
          <select id="qr-payment" class="field">
            <option value="cash" data-i18n="taxi.payCash">Efectivo</option>
            <option value="courtesy" data-i18n="taxi.payCourtesy">Cortesía</option>
          </select>
        </div>
        <p id="qr-error" class="text-sm text-red-300" hidden></p>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-qr-cancel" class="card rounded-lg py-3" data-i18n="manager.cancel">Cancelar</button>
          <button id="btn-qr-confirm" class="ev2-button rounded-lg py-3" data-i18n="valet.deliver">Entregar</button>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm z-50" hidden></div>
</div>

<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/roles.js"></script>
<script src="js/password-gate.js"></script>
<script src="js/valet-tickets.js"></script>
<script src="js/valet-screen.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
