<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EV2 Clandestinoz</title>
    <link rel="icon" href="images/favicon-32x32.png" type="image/png" sizes="32x32">
    <!-- Configuración: se cambia aquí sin tocar el código. -->
    <meta name="ev2:api" content="/api">
    <meta name="ev2:ws" content="">
    <!-- Debe coincidir con el slug del club en la base (el seed crea "ev2"). -->
    <meta name="ev2:club" content="ev2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap');

        :root {
            --ev2-cyan: #00BFFF;
            --ev2-pink: #FF1493;
            --ev2-purple: #9D00FF;
            --ev2-lime: #00FF00;
            --ev2-gold: #FFD700;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #001a33 100%);
        }

        .font-display { font-family: 'Poppins', sans-serif; font-weight: 700; }

        .ev2-gradient {
            background: linear-gradient(135deg, var(--ev2-cyan) 0%, var(--ev2-pink) 25%, var(--ev2-purple) 50%, var(--ev2-lime) 75%, var(--ev2-gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ev2-button {
            background: linear-gradient(135deg, var(--ev2-cyan), var(--ev2-pink));
            transition: filter .15s ease, transform .1s ease;
        }
        .ev2-button:active { transform: scale(.98); }
        .ev2-button:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }

        .tab-active { color: var(--ev2-cyan); border-bottom: 3px solid var(--ev2-cyan); }

        /* Objetivos táctiles grandes: esto se usa de noche, con poca luz y una mano. */
        button, .tap { min-height: 44px; }

        .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
        .card-free { border-color: rgba(0,191,255,.45); }
        .card-mine { border-color: var(--ev2-lime); box-shadow: 0 0 12px rgba(0,255,0,.25); }
        .card-full { opacity: .45; }

        .dot { width: .5rem; height: .5rem; border-radius: 9999px; display: inline-block; }
        .dot-on { background: var(--ev2-lime); }
        .dot-off { background: #f87171; }
        .dot-wait { background: var(--ev2-gold); }

        @keyframes pulse-soft { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
        .pulsing { animation: pulse-soft 1.6s ease-in-out infinite; }

        [hidden] { display: none !important; }
    </style>
</head>
<body class="text-white">
<div class="max-w-md mx-auto min-h-screen bg-gradient-to-b from-slate-950 via-purple-950 to-slate-950 flex flex-col">

  <!-- ============================ ENTRAR ============================ -->
  <section id="screen-auth" class="flex-1 flex flex-col justify-center px-6 py-10">
    <div class="text-center mb-8">
      <h1 class="font-display text-3xl ev2-gradient mb-1">EV2 Clandestinoz</h1>
      <p id="club-city" class="text-white/50 text-sm">Nogales, Sonora</p>
    </div>

    <div class="flex mb-6 text-sm">
      <button id="tab-login" class="flex-1 py-2 tab-active font-semibold">Entrar</button>
      <button id="tab-register" class="flex-1 py-2 text-white/50">Crear cuenta</button>
    </div>

    <form id="form-login" class="space-y-3">
      <input id="login-email" type="email" autocomplete="email" required placeholder="Correo"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <input id="login-password" type="password" autocomplete="current-password" required placeholder="Contraseña"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display">Entrar al club</button>
    </form>

    <form id="form-register" class="space-y-3" hidden>
      <div class="flex gap-2">
        <input id="reg-first" required placeholder="Nombre" class="w-1/2 px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
        <input id="reg-last" placeholder="Apellido" class="w-1/2 px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      </div>
      <input id="reg-email" type="email" autocomplete="email" required placeholder="Correo"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <input id="reg-password" type="password" autocomplete="new-password" required minlength="8" placeholder="Contraseña (mínimo 8)"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <label class="block text-xs text-white/50 pt-1">Fecha de nacimiento</label>
      <input id="reg-birth" type="date" required
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <label class="flex items-start gap-3 text-sm text-white/70 tap">
        <input id="reg-terms" type="checkbox" required class="mt-1 w-5 h-5 accent-cyan-400">
        <span>Tengo 18 años o más y acepto los términos y el código de conducta.</span>
      </label>
      <label class="flex items-start gap-3 text-sm text-white/70 tap">
        <input id="reg-flirts" type="checkbox" class="mt-1 w-5 h-5 accent-pink-400">
        <span>Quiero recibir invitaciones de otras personas. <span class="text-white/40">Puedes cambiarlo cuando quieras.</span></span>
      </label>
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display">Crear cuenta</button>
    </form>

    <p id="auth-error" class="mt-4 text-sm text-red-300 text-center" hidden></p>
    <p class="mt-8 text-center text-xs text-white/30">Solo +18 · EV2 Clandestinoz</p>
  </section>

  <!-- ============================ APP ============================ -->
  <section id="screen-app" class="flex-1 flex flex-col" hidden>
    <header class="px-4 py-3 flex items-center justify-between border-b border-white/10 sticky top-0 backdrop-blur bg-slate-950/80 z-10">
      <div>
        <p class="font-display text-lg ev2-gradient leading-none">EV2</p>
        <p class="text-xs text-white/50"><span id="me-name">—</span> · <span id="me-table">sin mesa</span></p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-white/50 flex items-center gap-1">
          <span id="rt-dot" class="dot dot-off"></span><span id="rt-text">Conectando…</span>
        </span>
        <button id="btn-lang" class="text-xs text-white/60 px-2">EN</button>
        <button id="btn-logout" class="text-xs text-white/60 px-2" title="Salir"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>

    <div id="banner" class="px-4 py-2 text-sm text-center bg-amber-500/20 text-amber-100" hidden></div>

    <main class="flex-1 overflow-y-auto pb-28">
      <!-- MESA -->
      <div id="view-tables" class="p-4 space-y-4">
        <div id="my-table-box" class="card rounded-xl p-4" hidden>
          <p class="text-xs text-white/50">Tu mesa</p>
          <p id="my-table-name" class="font-display text-xl"></p>
          <button id="btn-leave" class="mt-3 text-sm text-red-300 underline">Dejar la mesa</button>
        </div>
        <p id="tables-hint" class="text-sm text-white/60">Elige dónde te vas a sentar para poder pedir.</p>
        <div id="floor-plan" class="space-y-5"></div>
      </div>

      <!-- MENÚ -->
      <div id="view-menu" class="p-4" hidden>
        <div id="menu-categories" class="flex gap-2 overflow-x-auto pb-3 -mx-1 px-1"></div>
        <div id="menu-list" class="space-y-2"></div>
      </div>

      <!-- PEDIDOS -->
      <div id="view-orders" class="p-4 space-y-3">
        <p id="orders-empty" class="text-sm text-white/50 text-center py-10" hidden>Todavía no has pedido nada.</p>
        <div id="orders-list" class="space-y-3"></div>
      </div>
    </main>

    <!-- CARRITO -->
    <div id="cart-bar" class="fixed bottom-16 left-0 right-0 max-w-md mx-auto px-4" hidden>
      <button id="btn-order" class="ev2-button w-full py-3 rounded-xl font-display flex items-center justify-between px-5">
        <span><span id="cart-count">0</span> · <span id="cart-total">$0.00</span></span>
        <span>Pedir <i class="fa-solid fa-arrow-right ml-1"></i></span>
      </button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto grid grid-cols-3 border-t border-white/10 bg-slate-950/95 backdrop-blur">
      <button data-view="tables" class="nav-tab py-3 text-xs tab-active"><i class="fa-solid fa-chair block text-lg mb-1"></i>Mesa</button>
      <button data-view="menu" class="nav-tab py-3 text-xs text-white/50"><i class="fa-solid fa-martini-glass block text-lg mb-1"></i>Menú</button>
      <button data-view="orders" class="nav-tab py-3 text-xs text-white/50"><i class="fa-solid fa-receipt block text-lg mb-1"></i>Pedidos<span id="orders-badge" class="ml-1 px-1.5 rounded-full bg-pink-500 text-[10px]" hidden></span></button>
    </nav>
  </section>

  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm z-50" hidden></div>
</div>

<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/client.js"></script>
<script src="js/index-screen.js"></script>
</body>
</html>
