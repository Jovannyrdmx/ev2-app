<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EV2 — Conductor</title>
    <link rel="icon" href="images/favicon-32x32.png" type="image/png" sizes="32x32">
    <meta name="ev2:api" content="/api">
    <meta name="ev2:ws" content="">
    <meta name="ev2:club" content="ev2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap');

        :root {
            --ev2-cyan: #00BFFF;
            --ev2-pink: #FF1493;
            --ev2-lime: #00FF00;
            --ev2-gold: #FFD700;
            --ev2-red: #FF4444;
        }

        body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 100%); }
        .font-display { font-family: 'Poppins', sans-serif; font-weight: 700; }

        .ev2-gradient {
            background: linear-gradient(135deg, var(--ev2-cyan) 0%, var(--ev2-pink) 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .ev2-button {
            background: linear-gradient(135deg, var(--ev2-cyan), var(--ev2-pink));
            color: #000; font-weight: 700;
            transition: filter .15s ease, transform .1s ease;
        }
        .ev2-button:active { transform: scale(.98); }
        .ev2-button:disabled { filter: grayscale(1) brightness(.55); cursor: not-allowed; }

        /* Se opera desde el coche, de noche, a veces con el motor andando. */
        button, select, input, .tap { min-height: 52px; font-size: 1rem; }

        .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); }

        .switch {
            border: 2px solid var(--ev2-cyan); color: var(--ev2-cyan);
            background: transparent; border-radius: 10px; font-weight: 700;
        }
        .switch.on {
            background: linear-gradient(135deg, var(--ev2-lime), var(--ev2-cyan));
            color: #000; border-color: var(--ev2-lime);
        }

        .eta-choice {
            border: 2px solid rgba(255,255,255,.2); border-radius: 10px;
            background: transparent; color: #fff; font-weight: 700; padding: 0 .25rem;
        }
        .eta-choice.on { border-color: var(--ev2-lime); background: rgba(0,255,0,.15); color: var(--ev2-lime); }

        .dot { width: .5rem; height: .5rem; border-radius: 9999px; display: inline-block; }
        .dot-on { background: var(--ev2-lime); }
        .dot-off { background: var(--ev2-red); }
        .dot-wait { background: var(--ev2-gold); }

        @keyframes flash-in { from { background: rgba(0,255,0,.3); } to { background: rgba(255,255,255,.05); } }
        .just-arrived { animation: flash-in 1.6s ease-out; }

        .field { width: 100%; padding: .6rem 1rem; border-radius: .6rem; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); outline: none; }
        .field:focus { border-color: var(--ev2-cyan); }
        [hidden] { display: none !important; }
    </style>
</head>
<body class="text-white">
<div class="max-w-md mx-auto min-h-screen flex flex-col">

  <!-- ============================ ENTRAR ============================ -->
  <section id="screen-auth" class="flex-1 flex flex-col justify-center px-6 py-10">
    <div class="text-center mb-8">
      <h1 class="font-display text-3xl ev2-gradient mb-1">EV2 · <span data-i18n="taxi.driverTitle">Conductor</span></h1>
      <p class="text-white/50 text-sm" data-i18n="taxi.title">Salida segura</p>
    </div>
    <form id="form-login" class="space-y-3">
      <input id="login-email" type="email" autocomplete="email" required placeholder="Correo" data-i18n-placeholder="auth.email"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <input id="login-password" type="password" autocomplete="current-password" required placeholder="Contraseña" data-i18n-placeholder="auth.password"
             class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display" data-i18n="auth.enter">Entrar al club</button>
    </form>
    <p id="auth-error" class="mt-4 text-sm text-red-300 text-center" hidden></p>
  </section>


  <!-- ====== CONTRASEÑA TEMPORAL: el servidor bloquea todo hasta cambiarla ====== -->
  <section id="screen-password" class="flex-1 flex flex-col justify-center px-6 py-10 max-w-md w-full mx-auto" hidden>
    <h2 class="font-display text-2xl ev2-gradient mb-1" data-i18n="gate.title">Cambia tu contraseña</h2>
    <p class="text-sm text-white/60 mb-6" data-i18n="gate.note">Entraste con una contraseña temporal.</p>
    <form id="form-password" class="space-y-3">
      <input id="pw-current" type="password" autocomplete="current-password" required placeholder="Contraseña temporal" data-i18n-placeholder="gate.current" class="field">
      <input id="pw-new" type="password" autocomplete="new-password" required minlength="8" placeholder="Contraseña nueva (mínimo 8)" data-i18n-placeholder="gate.new" class="field">
      <input id="pw-repeat" type="password" autocomplete="new-password" required placeholder="Repite la nueva" data-i18n-placeholder="gate.repeat" class="field">
      <button type="submit" class="ev2-button w-full py-3 rounded-xl font-display" data-i18n="gate.save">Cambiar y entrar</button>
    </form>
    <p id="pw-error" class="mt-4 text-sm text-red-300 text-center" hidden></p>
    <button id="btn-pw-logout" class="mt-6 text-sm text-white/50 underline" data-i18n="top.signOut">Salir</button>
  </section>

  <!-- ============ ENTRÓ ALGUIEN QUE NO ES CONDUCTOR ============ -->
  <section id="screen-wrong-role" class="flex-1 flex flex-col justify-center px-6 py-10 text-center" hidden>
    <p class="text-xs uppercase tracking-widest text-white/40" data-i18n="staff.signedInAs">Entraste como</p>
    <h2 id="wrong-role" class="font-display text-2xl ev2-gradient mb-4">—</h2>
    <p id="wrong-role-note" class="text-sm text-white/60"></p>
    <button id="btn-wrong-logout" class="mt-8 text-sm text-white/60 underline" data-i18n="top.signOut">Salir</button>
  </section>

  <!-- ============================ CONDUCTOR ============================ -->
  <section id="screen-driver" class="flex-1 flex flex-col" hidden>
    <header class="px-4 py-3 flex items-center justify-between border-b border-white/10 sticky top-0 backdrop-blur bg-black/80 z-20">
      <div>
        <p class="font-display text-lg ev2-gradient leading-none">EV2 · <span data-i18n="taxi.driverTitle">Conductor</span></p>
        <p class="text-xs text-white/50"><span id="me-name">—</span> · <span id="me-plate"></span></p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-white/50 flex items-center gap-1">
          <span id="rt-dot" class="dot dot-off"></span><span id="rt-text">Conectando…</span>
        </span>
        <button id="btn-lang" class="text-xs text-white/60 px-2">EN</button>
        <button id="btn-logout" class="text-xs text-white/60 px-2" title="Salir" data-i18n-title="top.signOut"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>

    <div id="banner" class="px-4 py-2 text-sm text-center bg-amber-500/20 text-amber-100" hidden></div>

    <!-- Disponibilidad: lo primero, porque es lo que decide si le llegan solicitudes. -->
    <div class="p-4 space-y-3 border-b border-white/10">
      <div class="grid grid-cols-2 gap-2">
        <button id="btn-off" class="switch py-3" data-i18n="taxi.driverOff">No disponible</button>
        <button id="btn-available" class="switch py-3" data-i18n="taxi.driverAvailable">Disponible</button>
      </div>
      <label class="flex items-center gap-3 text-sm tap">
        <input id="chk-at-venue" type="checkbox" class="w-6 h-6 accent-emerald-400">
        <span data-i18n="taxi.driverAtVenue">Estoy en la salida del club</span>
      </label>
      <div class="flex justify-between text-sm">
        <span class="text-white/50" data-i18n="taxi.driverTonight">Esta noche</span>
        <span><span id="tonight-rides">0</span> <span data-i18n="taxi.driverRides">viajes</span> · <span id="tonight-amount">—</span></span>
      </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 space-y-3">
      <!-- El viaje en curso ocupa toda la pantalla: no hay nada más que hacer. -->
      <div id="ride-card" class="card rounded-xl p-4 space-y-3" hidden>
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-xs uppercase tracking-wider text-white/40" data-i18n="taxi.driverGuest">Pasajero</p>
            <p id="ride-guest" class="font-display text-lg">—</p>
            <p id="ride-destination" class="text-sm text-white/70"></p>
            <p id="ride-notes" class="text-xs text-amber-200/80 mt-1" hidden></p>
          </div>
          <div class="text-right flex-none">
            <p id="ride-passengers" class="text-sm"></p>
            <p id="ride-fare" class="text-sm text-white/60"></p>
          </div>
        </div>
        <p id="ride-status" class="text-sm" style="color:var(--ev2-cyan)"></p>
        <button id="btn-ride-action" class="ev2-button w-full py-4 rounded-xl font-display text-lg">—</button>
        <button id="btn-ride-cancel" class="w-full py-2 text-sm text-red-300 underline" data-i18n="taxi.cancel">Cancelar</button>
      </div>

      <!-- Terminar el viaje: cuánto se cobró y cómo pagó. -->
      <div id="finish-box" class="card rounded-xl p-4 space-y-3" hidden>
        <label class="block text-xs text-white/50" for="finish-amount" data-i18n="taxi.driverAmount">Cuánto se cobró</label>
        <input id="finish-amount" type="number" inputmode="decimal" min="0" step="1"
               class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
        <label class="block text-xs text-white/50" for="finish-payment" data-i18n="taxi.driverPayment">Cómo pagó</label>
        <select id="finish-payment" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 outline-none">
          <option value="cash" data-i18n="taxi.payCash">Efectivo</option>
          <option value="card" data-i18n="taxi.payCard">Tarjeta</option>
          <option value="courtesy" data-i18n="taxi.payCourtesy">Cortesía</option>
        </select>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-finish-cancel" class="card rounded-lg py-3" data-i18n="bar.cancel">Cancelar</button>
          <button id="btn-finish-confirm" class="ev2-button rounded-lg py-3" data-i18n="taxi.driverFinish">Terminar viaje</button>
        </div>
      </div>

      <!-- Las solicitudes abiertas, solo cuando no lleva a nadie. -->
      <div id="offers-box">
        <p class="text-xs uppercase tracking-wider text-white/40 mb-2" data-i18n="taxi.driverOffers">Solicitudes</p>
        <p id="offers-empty" class="text-sm text-white/40 py-8 text-center" data-i18n="taxi.driverNoOffers">No hay solicitudes ahora.</p>
        <div id="offers-list" class="space-y-3"></div>
      </div>
    </main>

    <!-- Aceptar: los minutos que tarda en llegar, de un toque. -->
    <div id="eta-box" class="fixed inset-0 bg-black/85 flex items-end z-40" hidden>
      <div class="w-full max-w-md mx-auto p-5 space-y-4 rounded-t-2xl" style="background:#12081f;border-top:2px solid var(--ev2-cyan)">
        <p class="font-display text-lg" data-i18n="taxi.driverEta">¿En cuántos minutos llegas?</p>
        <div id="eta-choices" class="grid grid-cols-4 gap-2"></div>
        <button id="btn-eta-cancel" class="w-full py-2 text-sm text-white/60 underline" data-i18n="bar.cancel">Cancelar</button>
      </div>
    </div>
  </section>

  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm z-50" hidden></div>
</div>

<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/roles.js"></script>
<script src="js/password-gate.js"></script>
<script src="js/taxi-ride.js"></script>
<script src="js/driver-screen.js"></script>
</body>
</html>
