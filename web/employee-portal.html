<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV2 - Employee Portal (Mexico/USA)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 100%);
            color: #fff;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #00BFFF 0%, #FF1493 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #FF1493;
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        
        .currency-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .currency-selector label {
            color: #00BFFF;
            font-weight: bold;
            margin-right: 15px;
        }
        
        .currency-selector select {
            padding: 8px 15px;
            background: rgba(0, 191, 255, 0.1);
            border: 2px solid #00BFFF;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .tabs {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 25px;
            border: 2px solid #00BFFF;
            background: transparent;
            color: #00BFFF;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #00BFFF 0%, #FF1493 100%);
            color: #000;
            border-color: #FF1493;
        }
        
        .tab-btn:hover {
            transform: translateY(-2px);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #00BFFF;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00BFFF;
            color: #fff;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #888;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #FF1493;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
        }
        
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00BFFF 0%, #FF1493 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 191, 255, 0.3);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
        }
        
        .btn-secondary:hover {
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }
        
        .card {
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.1) 0%, rgba(255, 20, 147, 0.1) 100%);
            border: 2px solid #00BFFF;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card h3 {
            color: #00BFFF;
            margin-bottom: 15px;
        }
        
        .card p {
            color: #ccc;
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.1) 0%, rgba(0, 191, 255, 0.1) 100%);
            border: 2px solid #00FF00;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-label {
            color: #ccc;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #FFD700;
        }
        
        .stat-subtitle {
            font-size: 0.8em;
            color: #00FF00;
            margin-top: 5px;
        }
        
        .transaction-list {
            margin-top: 20px;
        }
        
        .transaction-item {
            background: rgba(0, 191, 255, 0.05);
            border: 1px solid #00BFFF;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .transaction-info {
            flex: 1;
            min-width: 200px;
        }
        
        .transaction-type {
            color: #FFD700;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .transaction-amounts {
            font-size: 0.85em;
            color: #ccc;
            margin-top: 5px;
        }
        
        .transaction-amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #00FF00;
            text-align: right;
        }
        
        .bank-type-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .bank-type-btn {
            padding: 12px;
            border: 2px solid #00BFFF;
            background: rgba(0, 191, 255, 0.1);
            color: #00BFFF;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .bank-type-btn.active {
            background: linear-gradient(135deg, #00BFFF 0%, #FF1493 100%);
            color: #000;
        }
        
        .bank-type-btn:hover {
            transform: scale(1.05);
        }
        
        .mexico-icon {
            display: inline-block;
            margin-right: 5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.1) 0%, rgba(255, 20, 147, 0.1) 100%);
            border: 2px solid #00BFFF;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-close {
            float: right;
            cursor: pointer;
            font-size: 2em;
            color: #FF1493;
        }
        
        .success-message {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00FF00;
            color: #00FF00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #FF0000;
            color: #FF0000;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00BFFF 0%, #FF1493 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            margin: 0 auto 20px;
        }
        
        .profile-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #00BFFF;
            margin-bottom: 5px;
        }
        
        .profile-location {
            color: #FF1493;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .profile-role {
            color: #FFD700;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .location-badge {
            display: inline-block;
            padding: 5px 15px;
            background: linear-gradient(135deg, #00FF00 0%, #00BFFF 100%);
            color: #000;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .bank-type-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 Employee Portal</h1>
            <p class="subtitle">EV2 Clandestinoz Staff Dashboard</p>
        </header>

        <div class="currency-selector">
            <label>Display Currency:</label>
            <select id="currencySelector" onchange="changeCurrency()">
                <option value="MXN">🇲🇽 MXN (Mexican Pesos)</option>
                <option value="USD">🇺🇸 USD (US Dollars)</option>
            </select>
            <span id="exchangeRateDisplay" style="margin-left: 20px; color: #FFD700;">Exchange Rate: 1 USD = 17.50 MXN</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('register')">📝 Register</button>
            <button class="tab-btn" onclick="switchTab('login')">🔐 Login</button>
            <button class="tab-btn" onclick="switchTab('dashboard')">📊 Dashboard</button>
            <button class="tab-btn" onclick="switchTab('settings')">⚙️ Settings</button>
            <button class="tab-btn" onclick="switchTab('earnings')">💰 Earnings</button>
        </div>

        <!-- Register Tab -->
        <div id="register" class="tab-content active">
            <h2 style="color: #00BFFF; margin-bottom: 20px; text-align: center;">📝 Employee Registration</h2>
            
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" id="regFirstName" placeholder="Enter your first name">
                </div>

                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" id="regLastName" placeholder="Enter your last name">
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label>Phone:</label>
                    <input type="tel" id="regPhone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label>Location:</label>
                    <select id="regLocation">
                        <option value="">Select your location</option>
                        <option value="Mexico">🇲🇽 Mexico (Nogales, Sonora)</option>
                        <option value="USA">🇺🇸 USA (Arizona)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Role:</label>
                    <select id="regRole">
                        <option value="">Select your role</option>
                        <option value="hostess">👩‍💼 Hostess / Anfitriona</option>
                        <option value="dj">🎧 DJ</option>
                        <option value="lighttech">💡 Light Technician / Técnico de Luces</option>
                        <option value="bartender">🍹 Bartender / Cantinero</option>
                        <option value="waiter">👨‍💼 Waiter / Mesero</option>
                        <option value="dancer">💃 Dancer / Ambientadora</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Preferred Currency:</label>
                    <select id="regCurrency">
                        <option value="MXN">🇲🇽 MXN (Mexican Pesos)</option>
                        <option value="USD">🇺🇸 USD (US Dollars)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Create Password:</label>
                    <input type="password" id="regPassword" placeholder="Create a secure password">
                </div>

                <div class="form-group">
                    <label>Confirm Password:</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password">
                </div>

                <button class="btn" style="width: 100%;" onclick="registerEmployee()">📝 Create Account</button>
                
                <div id="registerMessage"></div>
            </div>
        </div>

        <!-- Login Tab -->
        <div id="login" class="tab-content">
            <h2 style="color: #00BFFF; margin-bottom: 20px; text-align: center;">🔐 Employee Login</h2>
            
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>

                <button class="btn" style="width: 100%;" onclick="loginEmployee()">🔐 Login</button>
                
                <div id="loginMessage"></div>
            </div>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content">
            <h2 style="color: #00BFFF; margin-bottom: 20px; text-align: center;">📊 Your Dashboard</h2>
            
            <div id="dashboardContent"></div>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="tab-content">
            <h2 style="color: #00BFFF; margin-bottom: 20px; text-align: center;">⚙️ Account Settings</h2>
            
            <div style="max-width: 800px; margin: 0 auto;">
                <h3 style="color: #FF1493; margin: 20px 0 15px 0;">💳 Bank Account Information</h3>
                
                <div class="form-group">
                    <label>Select Bank Account Type:</label>
                    <div class="bank-type-selector">
                        <button class="bank-type-btn active" onclick="selectBankType('mexico')">🇲🇽 Mexico</button>
                        <button class="bank-type-btn" onclick="selectBankType('usa')">🇺🇸 USA</button>
                    </div>
                </div>

                <!-- Mexico Bank Form -->
                <div id="mexicoBankForm">
                    <div class="form-group">
                        <label>Bank Name (Mexican Bank):</label>
                        <select id="mexicoBankName">
                            <option value="">Select bank</option>
                            <option value="Banamex">Banamex</option>
                            <option value="Bancomer">Bancomer</option>
                            <option value="HSBC">HSBC</option>
                            <option value="Santander">Santander</option>
                            <option value="Scotiabank">Scotiabank</option>
                            <option value="Inbursa">Inbursa</option>
                            <option value="Azteca">Azteca</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>CLABE (18-digit account number):</label>
                        <input type="text" id="mexicoCLABE" placeholder="Enter CLABE number" maxlength="18">
                    </div>

                    <div class="form-group">
                        <label>Account Holder Name:</label>
                        <input type="text" id="mexicoAccountHolder" placeholder="Name on account">
                    </div>

                    <div class="form-group">
                        <label>CURP (Mexican ID):</label>
                        <input type="text" id="mexicoCURP" placeholder="Enter CURP" maxlength="18">
                    </div>

                    <div class="form-group">
                        <label>RFC (Federal Taxpayer Registry):</label>
                        <input type="text" id="mexicoRFC" placeholder="Enter RFC" maxlength="13">
                    </div>

                    <button class="btn btn-secondary" onclick="saveMexicanBankAccount()">💾 Save Mexican Bank Account</button>
                </div>

                <!-- USA Bank Form (Hidden by default) -->
                <div id="usaBankForm" style="display: none;">
                    <div class="form-group">
                        <label>Bank Name (US Bank):</label>
                        <input type="text" id="usaBankName" placeholder="Bank name">
                    </div>

                    <div class="form-group">
                        <label>Account Number:</label>
                        <input type="password" id="usaAccountNumber" placeholder="Account number">
                    </div>

                    <div class="form-group">
                        <label>Routing Number:</label>
                        <input type="text" id="usaRoutingNumber" placeholder="Routing number">
                    </div>

                    <div class="form-group">
                        <label>Account Holder Name:</label>
                        <input type="text" id="usaAccountHolder" placeholder="Name on account">
                    </div>

                    <div class="form-group">
                        <label>Last 4 of SSN:</label>
                        <input type="password" id="usaSSN" placeholder="Last 4 digits" maxlength="4">
                    </div>

                    <button class="btn btn-secondary" onclick="saveUSABankAccount()">💾 Save USA Bank Account</button>
                </div>

                <h3 style="color: #FF1493; margin: 30px 0 15px 0;">📱 Payment Methods</h3>
                
                <div class="form-group">
                    <label>Payment Method:</label>
                    <select id="paymentMethod">
                        <option value="">Select payment method</option>
                        <option value="stripe">Stripe</option>
                        <option value="paypal">PayPal</option>
                        <option value="bank_transfer">Bank Transfer</option>
                        <option value="mercado_pago">Mercado Pago (Mexico)</option>
                        <option value="oxxo">OXXO Payouts (Mexico)</option>
                        <option value="cash">Cash</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Payment Identifier:</label>
                    <input type="text" id="paymentIdentifier" placeholder="Email, ID, or username">
                </div>

                <button class="btn btn-secondary" onclick="savePaymentMethod()">💾 Save Payment Method</button>

                <div id="settingsMessage"></div>
            </div>
        </div>

        <!-- Earnings Tab -->
        <div id="earnings" class="tab-content">
            <h2 style="color: #FFD700; margin-bottom: 20px; text-align: center;">💰 Your Earnings</h2>
            
            <div id="earningsContent"></div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #00FF00; text-align: center; margin-bottom: 20px;">✅ Success!</h2>
            <div id="successMessage" style="text-align: center; margin-bottom: 20px; font-size: 1.1em;"></div>
            <button class="btn" style="width: 100%;" onclick="closeSuccessModal()">Done</button>
        </div>
    </div>

    <script>
        let currentEmployee = null;
        const employees = [];
        let currentCurrency = 'MXN';
        const exchangeRate = 17.50;

        function changeCurrency() {
            currentCurrency = document.getElementById('currencySelector').value;
            document.getElementById('exchangeRateDisplay').textContent = `Exchange Rate: 1 USD = ${exchangeRate} MXN`;
            
            if (currentEmployee) {
                if (document.getElementById('dashboard').classList.contains('active')) {
                    loadDashboard();
                } else if (document.getElementById('earnings').classList.contains('active')) {
                    loadEarnings();
                }
            }
        }

        function formatCurrency(amount, currency) {
            if (currency === 'MXN') {
                return `$${amount.toLocaleString('es-MX', { minimumFractionDigits: 2 })} MXN`;
            } else {
                const usdAmount = amount / exchangeRate;
                return `$${usdAmount.toLocaleString('en-US', { minimumFractionDigits: 2 })} USD`;
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'dashboard' && currentEmployee) {
                loadDashboard();
            } else if (tabName === 'earnings' && currentEmployee) {
                loadEarnings();
            }
        }

        function selectBankType(type) {
            document.querySelectorAll('.bank-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (type === 'mexico') {
                document.getElementById('mexicoBankForm').style.display = 'block';
                document.getElementById('usaBankForm').style.display = 'none';
            } else {
                document.getElementById('mexicoBankForm').style.display = 'none';
                document.getElementById('usaBankForm').style.display = 'block';
            }
        }

        function registerEmployee() {
            const firstName = document.getElementById('regFirstName').value;
            const lastName = document.getElementById('regLastName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const location = document.getElementById('regLocation').value;
            const role = document.getElementById('regRole').value;
            const preferredCurrency = document.getElementById('regCurrency').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!firstName || !lastName || !email || !phone || !location || !role || !password) {
                document.getElementById('registerMessage').innerHTML = '<div class="error-message">All fields are required!</div>';
                return;
            }

            if (password !== confirmPassword) {
                document.getElementById('registerMessage').innerHTML = '<div class="error-message">Passwords do not match!</div>';
                return;
            }

            const employee = {
                id: `emp_${Date.now()}`,
                firstName: firstName,
                lastName: lastName,
                email: email,
                phone: phone,
                location: location,
                role: role,
                preferredCurrency: preferredCurrency,
                password: password,
                totalEarnings: 0,
                registeredAt: new Date()
            };

            employees.push(employee);
            currentEmployee = employee;

            document.getElementById('registerMessage').innerHTML = '<div class="success-message">✅ Account created successfully! You can now login.</div>';

            setTimeout(() => {
                document.getElementById('regFirstName').value = '';
                document.getElementById('regLastName').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regPhone').value = '';
                document.getElementById('regLocation').value = '';
                document.getElementById('regRole').value = '';
                document.getElementById('regCurrency').value = 'MXN';
                document.getElementById('regPassword').value = '';
                document.getElementById('regConfirmPassword').value = '';
            }, 500);
        }

        function loginEmployee() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const employee = employees.find(e => e.email === email && e.password === password);

            if (!employee) {
                document.getElementById('loginMessage').innerHTML = '<div class="error-message">Invalid email or password!</div>';
                return;
            }

            currentEmployee = employee;
            currentCurrency = employee.preferredCurrency;
            document.getElementById('currencySelector').value = currentCurrency;
            document.getElementById('loginMessage').innerHTML = '<div class="success-message">✅ Logged in successfully!</div>';

            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';

            setTimeout(() => {
                switchTab('dashboard');
            }, 1000);
        }

        function loadDashboard() {
            if (!currentEmployee) return;

            const roleIcons = {
                hostess: '👩‍💼',
                dj: '🎧',
                lighttech: '💡',
                bartender: '🍹',
                waiter: '👨‍💼',
                dancer: '💃'
            };

            const roleNames = {
                hostess: 'Hostess / Anfitriona',
                dj: 'DJ',
                lighttech: 'Light Technician / Técnico de Luces',
                bartender: 'Bartender / Cantinero',
                waiter: 'Waiter / Mesero',
                dancer: 'Dancer / Ambientadora'
            };

            const locationFlag = currentEmployee.location === 'Mexico' ? '🇲🇽' : '🇺🇸';

            let html = `
                <div class="profile-section">
                    <div class="profile-avatar">${roleIcons[currentEmployee.role]}</div>
                    <div class="profile-name">${currentEmployee.firstName} ${currentEmployee.lastName}</div>
                    <div class="profile-role">${roleNames[currentEmployee.role]}</div>
                    <div class="location-badge">${locationFlag} ${currentEmployee.location}</div>
                    <div style="color: #ccc; margin-top: 10px;">${currentEmployee.email}</div>
                    <div style="color: #ccc;">${currentEmployee.phone}</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Earnings</div>
                        <div class="stat-value">${formatCurrency(currentEmployee.totalEarnings, currentCurrency)}</div>
                        <div class="stat-subtitle">
                            $${(currentEmployee.totalEarnings).toLocaleString()} MXN / 
                            $${(currentEmployee.totalEarnings / exchangeRate).toLocaleString(undefined, {maximumFractionDigits: 2})} USD
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Tips Received</div>
                        <div class="stat-value">12</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Member Since</div>
                        <div class="stat-value">${new Date(currentEmployee.registeredAt).toLocaleDateString()}</div>
                    </div>
                </div>

                <div class="card">
                    <h3>Account Status</h3>
                    <p>✅ Account Active</p>
                    <p>Email: ${currentEmployee.email}</p>
                    <p>Phone: ${currentEmployee.phone}</p>
                    <p>Location: ${locationFlag} ${currentEmployee.location}</p>
                    <p>Preferred Currency: ${currentEmployee.preferredCurrency}</p>
                </div>
            `;

            document.getElementById('dashboardContent').innerHTML = html;
        }

        function loadEarnings() {
            if (!currentEmployee) return;

            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Earnings</div>
                        <div class="stat-value">${formatCurrency(currentEmployee.totalEarnings, currentCurrency)}</div>
                        <div class="stat-subtitle">
                            $${(currentEmployee.totalEarnings).toLocaleString()} MXN / 
                            $${(currentEmployee.totalEarnings / exchangeRate).toLocaleString(undefined, {maximumFractionDigits: 2})} USD
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Pending Withdrawal</div>
                        <div class="stat-value">$0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Withdrawn</div>
                        <div class="stat-value">$0</div>
                    </div>
                </div>

                <div class="card">
                    <h3>Withdraw Earnings</h3>
                    <div style="margin: 20px 0;">
                        <label style="display: block; color: #00BFFF; font-weight: bold; margin-bottom: 10px;">Amount to Withdraw:</label>
                        <input type="number" id="withdrawAmount" placeholder="Enter amount in ${currentCurrency}" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 2px solid #00BFFF; color: #fff; border-radius: 8px;">
                    </div>
                    <button class="btn" onclick="withdrawEarnings()">💰 Request Withdrawal</button>
                </div>

                <div class="card">
                    <h3>Recent Transactions</h3>
                    <div class="transaction-list">
                        <div class="transaction-item">
                            <div class="transaction-info">
                                <div class="transaction-type">💵 Tip from Guest</div>
                                <div class="transaction-amounts">Today at 10:45 PM</div>
                            </div>
                            <div class="transaction-amount">
                                <div>$500 MXN</div>
                                <div style="font-size: 0.8em; color: #ccc;">($28.57 USD)</div>
                            </div>
                        </div>
                        <div class="transaction-item">
                            <div class="transaction-info">
                                <div class="transaction-type">🎵 Song Request</div>
                                <div class="transaction-amounts">Today at 10:30 PM</div>
                            </div>
                            <div class="transaction-amount">
                                <div>$1,750 MXN</div>
                                <div style="font-size: 0.8em; color: #ccc;">($100 USD)</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('earningsContent').innerHTML = html;
        }

        function saveMexicanBankAccount() {
            const bankName = document.getElementById('mexicoBankName').value;
            const clabe = document.getElementById('mexicoCLABE').value;
            const accountHolder = document.getElementById('mexicoAccountHolder').value;
            const curp = document.getElementById('mexicoCURP').value;
            const rfc = document.getElementById('mexicoRFC').value;

            if (!bankName || !clabe || !accountHolder || !curp || !rfc) {
                document.getElementById('settingsMessage').innerHTML = '<div class="error-message">All fields are required!</div>';
                return;
            }

            if (clabe.length !== 18) {
                document.getElementById('settingsMessage').innerHTML = '<div class="error-message">CLABE must be 18 digits!</div>';
                return;
            }

            document.getElementById('settingsMessage').innerHTML = '<div class="success-message">✅ Mexican bank account saved successfully!</div>';
            
            document.getElementById('mexicoBankName').value = '';
            document.getElementById('mexicoCLABE').value = '';
            document.getElementById('mexicoAccountHolder').value = '';
            document.getElementById('mexicoCURP').value = '';
            document.getElementById('mexicoRFC').value = '';
        }

        function saveUSABankAccount() {
            const bankName = document.getElementById('usaBankName').value;
            const accountNumber = document.getElementById('usaAccountNumber').value;
            const routingNumber = document.getElementById('usaRoutingNumber').value;
            const accountHolder = document.getElementById('usaAccountHolder').value;
            const ssn = document.getElementById('usaSSN').value;

            if (!bankName || !accountNumber || !routingNumber || !accountHolder || !ssn) {
                document.getElementById('settingsMessage').innerHTML = '<div class="error-message">All fields are required!</div>';
                return;
            }

            document.getElementById('settingsMessage').innerHTML = '<div class="success-message">✅ USA bank account saved successfully!</div>';
            
            document.getElementById('usaBankName').value = '';
            document.getElementById('usaAccountNumber').value = '';
            document.getElementById('usaRoutingNumber').value = '';
            document.getElementById('usaAccountHolder').value = '';
            document.getElementById('usaSSN').value = '';
        }

        function savePaymentMethod() {
            const paymentMethod = document.getElementById('paymentMethod').value;
            const paymentIdentifier = document.getElementById('paymentIdentifier').value;

            if (!paymentMethod || !paymentIdentifier) {
                document.getElementById('settingsMessage').innerHTML = '<div class="error-message">All fields are required!</div>';
                return;
            }

            document.getElementById('settingsMessage').innerHTML = '<div class="success-message">✅ Payment method saved successfully!</div>';
            
            document.getElementById('paymentMethod').value = '';
            document.getElementById('paymentIdentifier').value = '';
        }

        function withdrawEarnings() {
            const amount = document.getElementById('withdrawAmount').value;

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            const amountUSD = amount / exchangeRate;
            document.getElementById('successMessage').textContent = `Withdrawal request of ${formatCurrency(amount, currentCurrency)} ($${amountUSD.toLocaleString(undefined, {maximumFractionDigits: 2})} USD equivalent) submitted! You will receive the funds within 2-3 business days.`;
            document.getElementById('successModal').classList.add('show');

            document.getElementById('withdrawAmount').value = '';
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.remove('show');
        }

        window.onclick = function(event) {
            if (event.target.id === 'successModal') {
                event.target.classList.remove('show');
            }
        }
    </script>
</body>
</html>
