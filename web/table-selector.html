<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV2 Clandestinoz - Table Selection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 100%);
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #00BFFF 0%, #FF1493 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .floor-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .floor-btn {
            padding: 12px 25px;
            border: 2px solid #00BFFF;
            background: transparent;
            color: #00BFFF;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        .floor-btn:hover,
        .floor-btn.active {
            background: linear-gradient(135deg, #00BFFF 0%, #FF1493 100%);
            color: #000;
            border-color: #FF1493;
        }
        
        .canvas-wrapper {
            background: #000;
            border: 2px solid #00BFFF;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.3);
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: crosshair;
            border-radius: 8px;
        }
        
        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid #00BFFF;
            border-radius: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #fff;
        }
        
        .legend-text {
            font-size: 0.9em;
        }
        
        .info-panel {
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.1) 0%, rgba(255, 20, 147, 0.1) 100%);
            border: 2px solid #00BFFF;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            min-height: 150px;
        }
        
        .info-panel h3 {
            color: #FF1493;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: rgba(0, 191, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid #00BFFF;
        }
        
        .info-label {
            font-size: 0.8em;
            color: #999;
            text-transform: uppercase;
        }
        
        .info-value {
            font-size: 1.2em;
            color: #00FF00;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .btn-reserve {
            background: linear-gradient(135deg, #00BFFF 0%, #9D00FF 100%);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            margin-top: 15px;
            width: 100%;
        }
        
        .btn-reserve:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 191, 255, 0.4);
        }
        
        .btn-reserve:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: rgba(0, 191, 255, 0.1);
            border: 1px solid #FF1493;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            color: #00FF00;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.85em;
            color: #00BFFF;
            margin-top: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎫 SELECT YOUR TABLE</h1>
            <p style="color: #FF1493; letter-spacing: 1px;">EV2 Clandestinoz - Interactive Floor Plan</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTables">53</div>
                <div class="stat-label">Total Tables</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="availableTables">53</div>
                <div class="stat-label">Available Now</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="vipTables">7</div>
                <div class="stat-label">VIP Tables</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="occupiedTables">0</div>
                <div class="stat-label">Occupied</div>
            </div>
        </div>

        <div class="floor-selector">
            <button class="floor-btn active" onclick="switchFloor('planta_baja')">🎉 PLANTA BAJA</button>
            <button class="floor-btn" onclick="switchFloor('planta_alta')">🎊 PLANTA ALTA</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #FF1493;"></div>
                <span class="legend-text">ZONA ROJA / VIP</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #00BFFF;"></div>
                <span class="legend-text">ZONA AZUL / CELESTE</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9D00FF;"></div>
                <span class="legend-text">ZONA DIAMANTE</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFD700;"></div>
                <span class="legend-text">ZONA BAJA</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #00FF00;"></div>
                <span class="legend-text">Available</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FF4444;"></div>
                <span class="legend-text">Occupied</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="floorCanvas" width="800" height="600"></canvas>
        </div>

        <div class="info-panel">
            <h3>📍 Selected Table</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Table #</div>
                    <div class="info-value" id="selectedTableNum">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Section</div>
                    <div class="info-value" id="selectedTableSection">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Capacity</div>
                    <div class="info-value" id="selectedTableCapacity">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Type</div>
                    <div class="info-value" id="selectedTableType">-</div>
                </div>
            </div>
            <button class="btn-reserve" id="reserveBtn" disabled>RESERVE TABLE</button>
        </div>
    </div>

    <script>
        // Table data from nightclub-tables.js
        const TABLES = {
            planta_baja: {
                zona_roja: [
                    { id: "t39", number: 39, section: "ZONA ROJA", floor: "PLANTA BAJA", capacity: 6, type: "booth", x: 390, y: 150, color: "#FF1493" },
                    { id: "t40", number: 40, section: "ZONA ROJA", floor: "PLANTA BAJA", capacity: 8, type: "booth", x: 430, y: 150, color: "#FF1493" },
                    { id: "t41", number: 41, section: "ZONA ROJA", floor: "PLANTA BAJA", capacity: 6, type: "booth", x: 470, y: 150, color: "#FF1493" }
                ],
                zona_azul_left: [
                    { id: "t1", number: 1, section: "ZONA AZUL", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 80, y: 280, color: "#00BFFF" },
                    { id: "t2", number: 2, section: "ZONA AZUL", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 80, y: 320, color: "#00BFFF" },
                    { id: "t3", number: 3, section: "ZONA AZUL", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 120, y: 280, color: "#00BFFF" },
                    { id: "t4", number: 4, section: "ZONA AZUL", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 120, y: 320, color: "#00BFFF" },
                    { id: "t14", number: 14, section: "ZONA AZUL", floor: "PLANTA BAJA", capacity: 6, type: "booth", x: 160, y: 300, color: "#00BFFF" }
                ],
                zona_diamante: [
                    { id: "t5", number: 5, section: "ZONA DIAMANTE", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 60, y: 450, color: "#9D00FF" },
                    { id: "t6", number: 6, section: "ZONA DIAMANTE", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 100, y: 450, color: "#9D00FF" },
                    { id: "t7", number: 7, section: "ZONA DIAMANTE", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 140, y: 450, color: "#9D00FF" },
                    { id: "t8", number: 8, section: "ZONA DIAMANTE", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 180, y: 450, color: "#9D00FF" }
                ],
                vip_elevado: [
                    { id: "t16", number: 16, section: "VIP ELEVADO", floor: "PLANTA BAJA", capacity: 10, type: "vip_booth", x: 280, y: 500, color: "#FF1493" },
                    { id: "t17", number: 17, section: "VIP ELEVADO", floor: "PLANTA BAJA", capacity: 10, type: "vip_booth", x: 340, y: 500, color: "#FF1493" },
                    { id: "t18", number: 18, section: "VIP ELEVADO", floor: "PLANTA BAJA", capacity: 10, type: "vip_booth", x: 400, y: 500, color: "#FF1493" }
                ],
                zona_azul_right: [
                    { id: "t32", number: 32, section: "ZONA AZUL", floor: "PLANTA BAJA", capacity: 6, type: "booth", x: 420, y: 300, color: "#00BFFF" },
                    { id: "t33", number: 33, section: "ZONA AZUL", floor: "PLANTA BAJA", capacity: 6, type: "booth", x: 420, y: 420, color: "#00BFFF" }
                ],
                more_tables_lower: [
                    { id: "t9", number: 9, section: "ZONA BAJA", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 60, y: 520, color: "#FFD700" },
                    { id: "t10", number: 10, section: "ZONA BAJA", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 100, y: 520, color: "#FFD700" },
                    { id: "t11", number: 11, section: "ZONA BAJA", floor: "PLANTA BAJA", capacity: 4, type: "standard", x: 140, y: 520, color: "#FFD700" }
                ]
            },
            planta_alta: {
                zona_rosa: [
                    { id: "t42", number: 42, section: "ZONA ROSA", floor: "PLANTA ALTA", capacity: 8, type: "vip_booth", x: 120, y: 180, color: "#FF1493" },
                    { id: "t43", number: 43, section: "ZONA ROSA", floor: "PLANTA ALTA", capacity: 8, type: "vip_booth", x: 120, y: 280, color: "#FF1493" },
                    { id: "t44", number: 44, section: "ZONA ROSA", floor: "PLANTA ALTA", capacity: 8, type: "vip_booth", x: 120, y: 380, color: "#FF1493" },
                    { id: "t45", number: 45, section: "ZONA ROSA", floor: "PLANTA ALTA", capacity: 8, type: "vip_booth", x: 120, y: 480, color: "#FF1493" }
                ],
                zona_celeste: [
                    { id: "t46", number: 46, section: "ZONA CELESTE", floor: "PLANTA ALTA", capacity: 6, type: "booth", x: 460, y: 180, color: "#00BFFF" },
                    { id: "t47", number: 47, section: "ZONA CELESTE", floor: "PLANTA ALTA", capacity: 6, type: "booth", x: 460, y: 250, color: "#00BFFF" },
                    { id: "t48", number: 48, section: "ZONA CELESTE", floor: "PLANTA ALTA", capacity: 6, type: "booth", x: 460, y: 320, color: "#00BFFF" }
                ]
            }
        };

        let currentFloor = 'planta_baja';
        let selectedTable = null;
        const canvas = document.getElementById('floorCanvas');
        const ctx = canvas.getContext('2d');

        function getAllTables(floor) {
            const tables = [];
            Object.values(TABLES[floor]).forEach(section => {
                if (Array.isArray(section)) {
                    tables.push(...section);
                }
            });
            return tables;
        }

        function drawFloor() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const tables = getAllTables(currentFloor);

            // Draw title
            ctx.fillStyle = '#00BFFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(currentFloor === 'planta_baja' ? '🎉 PLANTA BAJA' : '🎊 PLANTA ALTA', canvas.width / 2, 30);

            // Draw dance floor
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 2;
            ctx.strokeRect(300, 200, 200, 150);
            ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
            ctx.fillRect(300, 200, 200, 150);
            ctx.fillStyle = '#00FF00';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('DANCE', 400, 270);
            ctx.fillText('FLOOR', 400, 290);

            // Draw tables
            tables.forEach(table => {
                const isSelected = selectedTable && selectedTable.id === table.id;
                const size = 30;

                // Draw table background
                ctx.fillStyle = isSelected ? '#FFFF00' : table.color;
                ctx.globalAlpha = isSelected ? 1 : 0.7;
                ctx.fillRect(table.x - size / 2, table.y - size / 2, size, size);

                // Draw table border
                ctx.strokeStyle = isSelected ? '#00FF00' : '#fff';
                ctx.lineWidth = isSelected ? 3 : 1;
                ctx.strokeRect(table.x - size / 2, table.y - size / 2, size, size);

                // Draw table number
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(table.number.toString(), table.x, table.y);
            });

            ctx.globalAlpha = 1;
        }

        function switchFloor(floor) {
            currentFloor = floor;
            selectedTable = null;
            updateUI();
            document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function selectTable(tableId) {
            const tables = getAllTables(currentFloor);
            selectedTable = tables.find(t => t.id === tableId);
            updateUI();
        }

        function updateUI() {
            drawFloor();

            if (selectedTable) {
                document.getElementById('selectedTableNum').textContent = selectedTable.number;
                document.getElementById('selectedTableSection').textContent = selectedTable.section;
                document.getElementById('selectedTableCapacity').textContent = selectedTable.capacity + ' Guests';
                document.getElementById('selectedTableType').textContent = selectedTable.type.toUpperCase();
                document.getElementById('reserveBtn').disabled = false;
            } else {
                document.getElementById('selectedTableNum').textContent = '-';
                document.getElementById('selectedTableSection').textContent = '-';
                document.getElementById('selectedTableCapacity').textContent = '-';
                document.getElementById('selectedTableType').textContent = '-';
                document.getElementById('reserveBtn').disabled = true;
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            const tables = getAllTables(currentFloor);
            for (let table of tables) {
                const distance = Math.sqrt(Math.pow(x - table.x, 2) + Math.pow(y - table.y, 2));
                if (distance < 20) {
                    selectTable(table.id);
                    return;
                }
            }
            selectedTable = null;
            updateUI();
        });

        document.getElementById('reserveBtn').addEventListener('click', () => {
            if (selectedTable) {
                alert(`🎉 Reserving Table ${selectedTable.number}\n\nSection: ${selectedTable.section}\nCapacity: ${selectedTable.capacity} guests\n\nProceeding to payment...`);
            }
        });

        updateUI();
    </script>
</body>
</html>
