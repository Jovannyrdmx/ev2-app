        - name: event_id
          in: query
          required: true
          description: La noche que se quiere reservar.
          schema: { type: string, format: uuid }
        - name: guests
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 2 }
        - name: section
          in: query
          schema: { type: string }
        - name: floor
          in: query
          schema: { type: string, enum: [baja, alta, ambas] }
      responses:
