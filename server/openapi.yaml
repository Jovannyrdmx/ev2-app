        phone: { type: string }
        vehicle: { $ref: '#/components/schemas/RideVehicle' }

    TaxiRide:
      type: object
      description: |
        Una misma fila con tres lecturas. `driver` (con teléfono y auto) lo reciben el
        cliente y el gerente, y solo desde que hay conductor asignado. El conductor recibe
        `guest` con el nombre del pasajero, nunca su teléfono; el gerente sí lo recibe,
        porque tiene que poder localizarlo.
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [requested, assigned, driver_arrived, in_progress, completed, cancelled, no_driver]
        passengers: { type: integer, minimum: 1, maximum: 8 }
        pickup_location: { type: [string, 'null'] }
        destination: { type: [string, 'null'] }
        destination_zone: { type: [string, 'null'] }
        quoted_amount:
          type: [string, 'null']
          description: Decimal. null cuando el destino no está en la lista de tarifas.
        final_amount: { type: [string, 'null'], description: Decimal cobrado realmente. }
        currency: { type: string, enum: [MXN, USD] }
        payment_method: { type: [string, 'null'], enum: [cash, card, courtesy, null] }
        eta_minutes: { type: [integer, 'null'] }
        expected_arrival_at: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        rating_comment: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        arrived_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'] }
        certificate_folio: { type: [string, 'null'] }
        certificate_expires_at: { type: [string, 'null'], format: date-time }
        conduct_accepted_at:
          type: [string, 'null']
          format: date-time
          description: Cuándo aceptó el cliente el código de conducta. `null` = el club no tenía texto publicado.
        transaction_id: { type: [string, 'null'], format: uuid }
        driver:
          oneOf:
            - { $ref: '#/components/schemas/RideDriver' }
            - { type: 'null' }
        guest:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }

    TaxiRideCreate:
      type: object
      properties:
        client_request_id:
          type: string
          format: uuid
          description: Clave de idempotencia; reenviarla devuelve el mismo viaje.
        fare_id:
          type: string
          format: uuid
          description: Zona de la lista de tarifas. Sin ella el viaje va a convenir.
        destination: { type: string, maxLength: 300 }
        passengers: { type: integer, minimum: 1, maximum: 8, default: 1 }
        notes: { type: string, maxLength: 280 }
        conduct_accepted:
          type: boolean
          description: |
            Aceptación explícita del código de conducta del club. **Obligatoria** (y solo
            vale `true`) cuando el club publicó un texto en `taxi_settings.conduct_terms`;
            sin ella la solicitud responde 422. Se guarda con su hora en el viaje.

    DepartureCertificate:
      type: object
      description: |
        Acredita únicamente que la persona salió del establecimiento a la hora indicada en
        un viaje coordinado por el club. No sustituye ninguna identificación oficial ni
        otorga permiso, autorización o efecto legal alguno.
      properties:
        folio: { type: string, examples: ['EV2-K7M2-P4XQ'] }
        nightclub: { type: [string, 'null'] }
        issued_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        valid: { type: boolean, description: Vigente en este momento. }
        guest: { type: string, description: 'Nombre e inicial del apellido, por ejemplo Ana P.' }
        driver: { type: [string, 'null'] }
        vehicle:
          oneOf:
            - { $ref: '#/components/schemas/RideVehicle' }
            - { type: 'null' }
        disclaimer: { type: string }

    TaxiStats:
      type: object
      properties:
        totals:
          type: object
          properties:
            rides: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
            without_driver: { type: integer }
            paid_cash: { type: integer }
            courtesy: { type: integer }
            charged: { type: string, description: Decimal con dos cifras. }
            avg_pickup_minutes: { type: [integer, 'null'] }
        drivers:
          type: array
          items:
            type: object
            properties:
              driver_id: { type: string, format: uuid }
              display_name: { type: [string, 'null'] }
              vehicle_plate: { type: string }
              trusted: { type: boolean }
              active: { type: boolean }
              rides: { type: integer }
              cancelled: { type: integer }
              charged: { type: string }
              rating_avg: { type: [string, 'null'] }
              avg_pickup_minutes: { type: [integer, 'null'] }

    ValetSettings:
      type: object
      properties:
        nightclub_id: { type: string, format: uuid }
        enabled: { type: boolean }
        handover_point: { type: string, description: Dónde se entrega el auto al cliente. }
        fee_amount:
          type: string
          description: |
            Decimal. **0 por decisión del club**: el estacionamiento es gratis y lo que gana
            el valet es la propina, que va por el módulo de propinas. Si algún día se pone
            un valor mayor, la entrega pasa a exigir método de pago.
        currency: { type: string, enum: [MXN, USD] }
        terms: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }

    ValetSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        enabled: { type: boolean }
        handover_point: { type: string, minLength: 1, maxLength: 120 }
        fee_amount: { type: number, minimum: 0, maximum: 100000 }
        currency: { type: string, enum: [MXN, USD] }
        terms: { type: [string, 'null'], maxLength: 4000 }

    ParkingSpot:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        zone: { type: [string, 'null'] }
        active: { type: boolean }
        occupied_by:
          oneOf:
            - type: object
              properties:
                ticket_id: { type: string, format: uuid }
                code: { type: string }
                plate: { type: string }
            - { type: 'null' }

    ParkingOccupancy:
      type: object
      properties:
        total: { type: integer }
        occupied: { type: integer }
        free: { type: integer }

    ValetTicket:
      type: object
      description: |
        Tres lecturas de la misma fila. El cliente ve su auto y su estado; el personal ve
        además el teléfono, las notas y quién lo recibió; el gerente ve también el rastro de
        una entrega sin QR. **El token del QR no aparece en ninguna de las tres.**
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['V-7K2M'], description: Corto y público. }
        status: { type: string, enum: [parked, requested, ready, delivered, cancelled] }
        plate: { type: string }
        vehicle_desc: { type: [string, 'null'] }
        fee: { type: string, description: Tarifa congelada al recibir el auto. }
        currency: { type: string, enum: [MXN, USD] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        claimed: { type: boolean, description: El cliente ya asoció el ticket a su cuenta. }
        spot:
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                zone: { type: [string, 'null'] }
            - { type: 'null' }
        checked_in_at: { type: string, format: date-time }
        requested_at: { type: [string, 'null'], format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'] }
        phone: { type: [string, 'null'], description: Solo para el personal. }
        notes: { type: [string, 'null'], description: Solo para el personal. }
        received_by: { type: [string, 'null'], description: Solo para el personal. }
        delivered_by: { type: [string, 'null'], description: Solo para el personal. }
        rating_comment: { type: [string, 'null'], description: Solo para el personal. }
        owner:
          description: Solo para el personal.
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, 'null'] }
                phone: { type: [string, 'null'] }
            - { type: 'null' }
        transaction_id: { type: [string, 'null'], format: uuid }
        override:
          description: Entrega sin QR. Solo para el gerente.
          oneOf:
            - type: object
              properties:
                by: { type: [string, 'null'] }
                at: { type: string, format: date-time }
                reason: { type: string }
                id_type: { type: string, enum: [INE, pasaporte, licencia, otro] }
                id_name: { type: string }
            - { type: 'null' }

    ValetTicketCreate:
      type: object
      required: [plate]
      properties:
        plate: { type: string, minLength: 3, maxLength: 20 }
        vehicle_desc: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 30 }
        spot_id: { type: string, format: uuid }
        notes: { type: string, maxLength: 280 }
        client_request_id: { type: string, format: uuid }

    ValetStats:
      type: object
      properties:
        totals:
          type: object
          properties:
            tickets: { type: integer }
            open: { type: integer }
            delivered: { type: integer }
            cancelled: { type: integer }
            handed_over_without_qr:
              type: integer
              description: Entregas autorizadas por el gerente sin escanear el QR.
            avg_retrieval_minutes: { type: [integer, 'null'] }
            rating_avg: { type: [string, 'null'] }
        valets:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              display_name: { type: [string, 'null'] }
              received: { type: integer }
              delivered: { type: integer }
              rating_avg: { type: [string, 'null'] }
              avg_retrieval_minutes: { type: [integer, 'null'] }

    PosIntegration:
      type: object
      description: |
        El hash de la llave del agente nunca sale de la base de datos, y `credentials_encrypted`
        no se usa: no hay credenciales de SQL Server que guardar mientras el mecanismo sea
        el agente local (D16).
      properties:
        id: { type: string, format: uuid }
        nightclub_id: { type: string, format: uuid }
        provider: { type: string, enum: [softrestaurant11, mock] }
        mode: { type: string, enum: [agent, api, mock] }
        enabled: { type: boolean, description: La intención del club. }
        status: { type: string, enum: [inactive, active, error] }
        enrolled: { type: boolean, description: Ya existe una llave de agente. }
        config: { $ref: '#/components/schemas/PosAgentConfig' }
        agent_version: { type: [string, 'null'] }
        agent_hostname: { type: [string, 'null'] }
        heartbeat_interval_seconds: { type: integer, minimum: 15, maximum: 3600 }
        stale_after_seconds: { type: integer, minimum: 60, maximum: 86400 }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        key_rotated_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        health: { $ref: '#/components/schemas/PosIntegrationHealth' }

    PosIntegrationHealth:
      type: object
      description: |
        Lo que de verdad está pasando, frente a `enabled`, que es solo la intención.
      properties:
        state:
          type: string
          enum: [not_enrolled, never_seen, ok, stale, error]
        seconds_since_last_seen: { type: integer }
        message: { type: [string, 'null'] }

    PosAgentConfig:
      type: object
      additionalProperties: false
      description: |
        Solo nombres, nunca secretos: qué servidor, qué instancia, qué base. Ninguno de
        estos valores da acceso por sí mismo.
      properties:
        sql_server_host: { type: string, maxLength: 120, examples: ['192.168.2.108'] }
        sql_instance: { type: string, maxLength: 60 }
        sql_database: { type: string, maxLength: 60 }
        sync_menu: { type: boolean }
        sync_inventory: { type: boolean }
        sync_tables: { type: boolean }
        sync_orders: { type: boolean }
        notes: { type: string, maxLength: 500 }

    PosIntegrationCreate:
      type: object
      properties:
        provider: { type: string, enum: [softrestaurant11, mock], default: softrestaurant11 }
        mode: { type: string, enum: [agent, api, mock], default: agent }
        config: { $ref: '#/components/schemas/PosAgentConfig' }
        heartbeat_interval_seconds: { type: integer, minimum: 15, maximum: 3600 }
        stale_after_seconds: { type: integer, minimum: 60, maximum: 86400 }

    PosIntegrationUpdate:
      type: object
      minProperties: 1
      properties:
        mode: { type: string, enum: [agent, api, mock] }
        config: { $ref: '#/components/schemas/PosAgentConfig' }
        enabled: { type: boolean }
        heartbeat_interval_seconds: { type: integer, minimum: 15, maximum: 3600 }
        stale_after_seconds: { type: integer, minimum: 60, maximum: 86400 }

    PosAgentInstructions:
      type: object
      properties:
        integration_id: { type: string, format: uuid }
        nightclub_id: { type: string, format: uuid }
        enabled: { type: boolean }
        mode: { type: string, enum: [agent, api, mock] }
        config: { $ref: '#/components/schemas/PosAgentConfig' }
        heartbeat_interval_seconds: { type: integer }
        capabilities:
          type: object
          description: |
            `push_orders` es siempre false hasta la fase 4: escribir comandas en el POS
            requiere el mecanismo oficial de National Soft (docs/POS_REAL.md).
          properties:
            read_catalog: { type: boolean }
            read_inventory: { type: boolean }
            push_orders: { type: boolean }
        server_time: { type: string, format: date-time }

    PosSyncReport:
      type: object
      required: [kind, ok]
      properties:
        kind: { type: string, enum: [menu, inventory, orders, status, tables] }
        ok: { type: boolean }
        items_synced: { type: integer, minimum: 0, default: 0 }
        started_at: { type: string, format: date-time }
        error: { type: string, maxLength: 2000 }
        details: { type: object, additionalProperties: true }
        client_request_id: { type: string, format: uuid }

    PosSyncRun:
      type: object
      properties:
        id: { type: string, description: Entero de 64 bits como cadena. }
        integration_id: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [menu, inventory, orders, status, tables] }
        source: { type: string, enum: [agent, manual, scheduled] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        ok: { type: [boolean, 'null'] }
        items_synced: { type: integer }
        error: { type: [string, 'null'] }
        details: { type: object, additionalProperties: true }

    ManualPaymentMethod:
      type: string
      enum: [cash, card_terminal, zelle, cash_app, bank_transfer, spei]

    ManualPaymentOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/ManualPaymentMethod' }
        label: { type: string }
        destination:
          type: [string, 'null']
          description: Cuenta receptora del club. Se muestra al cliente a propósito.
        instructions: { type: [string, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
        requires_reference:
          type: boolean
          description: |
            El efectivo se entrega en mano y no lleva folio; una transferencia sí, y sin él
            el gerente no puede cuadrarla contra el estado de cuenta.
        active: { type: boolean }
        sort_order: { type: integer }

    ManualPaymentOptionCreate:
      type: object
      required: [method, label]
      properties:
        method: { $ref: '#/components/schemas/ManualPaymentMethod' }
        label: { type: string, minLength: 1, maxLength: 80 }
        destination: { type: [string, 'null'], maxLength: 120 }
        instructions: { type: [string, 'null'], maxLength: 2000 }
        currency: { $ref: '#/components/schemas/Currency' }
        requires_reference: { type: boolean }
        sort_order: { type: integer }

    ManualPaymentOptionUpdate:
      type: object
      minProperties: 1
      properties:
        method: { $ref: '#/components/schemas/ManualPaymentMethod' }
        label: { type: string, minLength: 1, maxLength: 80 }
        destination: { type: [string, 'null'], maxLength: 120 }
        instructions: { type: [string, 'null'], maxLength: 2000 }
        currency: { $ref: '#/components/schemas/Currency' }
        requires_reference: { type: boolean }
        active: { type: boolean }
        sort_order: { type: integer }

    ManualPaymentDeclare:
      type: object
      required: [transaction_id, method, amount, currency]
      properties:
        transaction_id:
          type: string
          format: uuid
          description: El asiento del libro que se está pagando.
        option_id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/ManualPaymentMethod' }
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        currency: { $ref: '#/components/schemas/Currency' }
        reference:
          type: string
          minLength: 3
          maxLength: 60
          description: |
            Folio de la transferencia. Obligatorio salvo en efectivo. No puede repetirse:
            una misma transferencia no paga dos cosas.
        note: { type: string, maxLength: 280 }
        on_behalf_of:
          type: string
          format: uuid
          description: Solo el personal. Quién entregó el dinero.
        client_request_id: { type: string, format: uuid }

    ManualPayment:
      type: object
      description: |
        Dos lecturas. El cliente ve su declaración y en qué va; el gerente ve además quién
        la hizo, quién la revisó y el asiento contra el que se aplica.
      properties:
        id: { type: string, format: uuid }
        transaction_id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/ManualPaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        reference: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [declared, confirmed, rejected, cancelled] }
        rejection_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        pays_for:
          type: object
          properties:
            type: { type: string, examples: ['reservation_deposit'] }
            reference_type: { type: [string, 'null'] }
        declared_by:
          description: Solo para el gerente.
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, 'null'] }
            - { type: 'null' }
        on_behalf_of:
          description: Solo para el gerente.
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, 'null'] }
            - { type: 'null' }
        reviewed_by:
          description: Solo para el gerente.
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, 'null'] }
            - { type: 'null' }
        transaction:
          description: Solo para el gerente.
          type: object
          properties:
            id: { type: string, format: uuid }
            type: { type: string }
            amount: { $ref: '#/components/schemas/Money' }
            status: { type: string }
            reference_type: { type: [string, 'null'] }
            reference_id: { type: [string, 'null'], format: uuid }

    PaymentProviderStatus:
      type: object
      properties:
        provider: { type: string, enum: [stripe, mercadopago] }
        configured: { type: boolean }
        mode:
          type: [string, 'null']
          enum: [test, live, unknown, null]
          description: |
            Deducido del prefijo de la llave. La API se niega a arrancar en modo `live` si
            `NODE_ENV` no es `production`.
        missing:
          type: array
          description: Variables de entorno que faltan. Solo para el gerente.
          items: { type: string }
        publishable_key: { type: [string, 'null'] }
        public_key: { type: [string, 'null'] }
        currencies:
          type: array
          items: { $ref: '#/components/schemas/Currency' }
        methods:
          type: array
          items: { type: string }
    SupplyLocation:
      type: object
      description: Un lugar donde vive la existencia (el almacén o una barra).
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: barra-baja }
        name: { type: string, example: Barra planta baja }
        kind: { type: string, enum: [warehouse, bar] }
        floor: { type: [string, 'null'], example: baja }
        sort_order: { type: integer }
        active: { type: boolean }
        sections:
          type: array
          description: Las zonas del plano que atiende esta barra.
          items: { type: string }

    SupplyLocationCreate:
      type: object
      required: [code, name, kind]
      properties:
        code: { type: string, maxLength: 30, pattern: '^[a-z0-9-]+$' }
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [warehouse, bar] }
        floor: { type: string, maxLength: 10 }
        sort_order: { type: integer, default: 0 }

    Supply:
      type: object
      description: |
        Lo que el club compra y cuenta. `unit` es la unidad base en la que hablan la
        existencia, la receta y el costo; `package_size` es cuánto de esa unidad trae una
        presentación, para poder decir "quedan 3.5 botellas" en vez de "quedan 2,630 ml".
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: [string, 'null'] }
        unit: { type: string, enum: [ml, g, pza] }
        package_size: { type: number, example: 750 }
        package_label: { type: [string, 'null'], example: botella 750 ml }
        size_confirmed:
          type: boolean
          description: false = nadie ha confirmado el tamaño; se cargó con un valor por omisión.
        avg_cost: { type: number, description: 'Costo promedio ponderado por unidad base.' }
        pos_id: { type: [string, 'null'] }
        active: { type: boolean }
        stock: { type: number, description: 'Total del club, en unidad base.' }
        packages: { type: number, description: 'El total, en presentaciones.' }
        stock_value: { type: number, description: 'Al costo, nunca al precio de venta.' }
        low: { type: boolean, description: 'Bajo mínimo en algún lugar.' }
        locations:
          type: array
          items:
            type: object
            properties:
              location_id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              kind: { type: string, enum: [warehouse, bar] }
              stock: { type: number }
              packages: { type: number }
              min_stock: { type: number }
              low: { type: boolean }

    SupplyCreate:
      type: object
      required: [name, unit, package_size]
      properties:
        name: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 40 }
        unit: { type: string, enum: [ml, g, pza] }
        package_size: { type: number, exclusiveMinimum: 0 }
        package_label: { type: string, maxLength: 60 }
        size_confirmed: { type: boolean }
        pos_id: { type: string, maxLength: 60 }

    SupplyReceipt:
      type: object
      required: [location_id]
      description: Captura en presentaciones o en la unidad base, nunca en las dos.
      properties:
        location_id: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        packages: { type: number, exclusiveMinimum: 0 }
        package_cost: { type: number, minimum: 0, description: 'Lo que dice la factura por la presentación completa.' }
        reference_type: { type: string, maxLength: 30 }
        reason: { type: string, maxLength: 200 }

    SupplyTransfer:
      type: object
      required: [from_location_id, to_location_id]
      properties:
        from_location_id: { type: string, format: uuid }
        to_location_id: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        packages: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, maxLength: 200 }

    SupplyAdjustment:
      type: object
      required: [location_id, kind, reason]
      properties:
        location_id: { type: string, format: uuid }
        kind: { type: string, enum: [adjustment, waste, courtesy, issue] }
        quantity: { type: number }
        packages: { type: number }
        reason: { type: string, minLength: 3, maxLength: 200 }

    SupplyMovement:
      type: object
      description: |
        Un renglón del kardex. Solo inserciones: corregir un saldo es escribir otro
        renglón, nunca editar este.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [receipt, issue, transfer_in, transfer_out, consumption, return, waste, courtesy, count, adjustment]
        quantity: { type: number, description: 'Con signo, en unidad base. Positivo entra.' }
        balance_after: { type: number, description: 'El saldo de ese insumo EN ESE LUGAR.' }
        unit_cost: { type: [number, 'null'] }
        reference_type: { type: [string, 'null'] }
        reference_id: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
        transfer_group: { type: [string, 'null'], format: uuid }
        supply_id: { type: string, format: uuid }
        supply_name: { type: string }
        unit: { type: string }
        package_size: { type: number }
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        counterpart_location_id: { type: [string, 'null'], format: uuid }
        counterpart_code: { type: [string, 'null'] }
        counterpart_name: { type: [string, 'null'] }
        created_by: { type: [string, 'null'], format: uuid }
        created_by_name: { type: [string, 'null'] }
        authorized_by: { type: [string, 'null'], format: uuid }
        authorized_by_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Recipe:
      type: object
      properties:
        drink_id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        price: { type: string, description: 'Cadena decimal de dos posiciones.' }
        cost: { type: number, description: 'Lo que cuesta servirlo hoy, al costo promedio.' }
        items:
          type: array
          items:
            type: object
            properties:
              supply_id: { type: string, format: uuid }
              name: { type: string }
              unit: { type: string }
              quantity: { type: number }
              package_size: { type: number }

    DeliveryPoint:
      type: object
      description: A dónde se lleva un pedido. El token del QR no se publica aquí.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [table, floor, terrace, bar] }
        section: { type: [string, 'null'] }
        floor: { type: [string, 'null'] }
        table_id: { type: [string, 'null'], format: uuid }
        table_code: { type: [string, 'null'] }
        client_selectable: { type: boolean }
        active: { type: boolean }

    # ---------------------------------------------------------------- pases individuales
    GuestPass:
      type: object
      description: |
        Un pase de una persona. `code` va siempre —el titular lo tiene que poder
        dictar— pero el `payload` firmado solo en las respuestas donde alguien va a
        dibujar el QR.
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: Lo que va dentro del QR y lo que la puerta teclea. Sin dato personal.
        kind:
          type: string
          enum: [holder, guest, extra, contingency]
          description: |
            `holder` es el que reservó y su código es el mismo de la reservación, para
            que los QRs repartidos antes de la migración 019 sigan abriendo.
        status: { type: string, enum: [active, used, revoked] }
        label:
          type: [string, 'null']
          description: Cómo reconocer al invitado en la puerta. Un nombre de pila, nada más.
        expires_at: { type: [string, 'null'], format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        used_by_name: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoke_reason: { type: [string, 'null'] }
        replaces_id:
          type: [string, 'null']
          format: uuid
          description: El pase al que sustituyó, cuando este nació de una reasignación.
        share_count: { type: integer }
        last_shared_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        reservation_id: { type: [string, 'null'], format: uuid }
        table_code: { type: [string, 'null'] }
        section: { type: [string, 'null'] }
        starts_at: { type: [string, 'null'], format: date-time }

    GuestPassWithQr:
      allOf:
        - $ref: '#/components/schemas/GuestPass'
        - type: object
          properties:
            payload:
              type: string
              description: '`EV2P.<código>.<firma>`. Es la credencial: no se registra ni se cachea.'
            qr_svg: { type: string, description: 'El QR ya dibujado, en SVG.' }

    GuestPassIssued:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        kind: { type: string }
        status: { type: string }
        label: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        payload: { type: string }

    GuestPassPublic:
      type: object
      description: |
        Lo que ve quien recibe el pase por WhatsApp. Enseña lo mínimo para poder
        entrar y NADA de la persona: ni el nombre del titular, ni un teléfono, ni
        quién más está invitado, ni el id de la reservación.
      properties:
        code: { type: string }
        qr_svg: { type: string }
        kind: { type: string }
        status: { type: string }
        label: { type: [string, 'null'] }
        club_name: { type: string }
        table_code: { type: [string, 'null'] }
        section: { type: [string, 'null'] }
        starts_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        usable:
          type: boolean
          description: Si abre la puerta ahora mismo. Lo decide el servidor, no la página.
        result: { type: string }

    GuestPassScan:
      type: object
      description: Lo que la puerta ve al escanear.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        kind: { type: string }
        status: { type: string }
        label: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        reservation_id: { type: [string, 'null'], format: uuid }
        holder_name: { type: [string, 'null'] }
        guest_count: { type: [integer, 'null'] }
        already_inside:
          type: integer
          description: Cuántos de esa mesa ya entraron. Es el «van 6 de 8» de la puerta.
        table:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            section: { type: string }
            floor: { type: [string, 'null'] }
            capacity: { type: integer }
        starts_at: { type: [string, 'null'], format: date-time }
        result: { type: string }
        ok: { type: boolean }
        reason: { type: [string, 'null'] }

    GuestPassShare:
      type: object
      properties:
        text:
          type: string
          description: El mensaje, con el enlace y el código escrito abajo.
        link: { type: string }
        whatsapp_url:
          type: string
          description: '`wa.me`, que abre la app en teléfono y WhatsApp Web en computadora.'

    GuestPassEvent:
      type: object
      description: Un renglón de la auditoría. La tabla es insert-only.
      properties:
        kind:
          type: string
          enum: [issued, shared, viewed, scanned, admitted, denied, revoked, reassigned]
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        actor_name:
          type: [string, 'null']
          description: Nulo cuando fue el invitado con el enlace, que no tiene cuenta.
        document: { type: [string, 'null'] }
        adult: { type: [boolean, 'null'] }

    DoorIdCheck:
      type: object
      description: |
        La revisión de identificación. NO guarda el número del documento, la fecha de
        nacimiento ni una foto.
      properties:
        id: { type: string, format: uuid }
        document: { type: string, enum: [ine, passport, license, other, none] }
        adult: { type: boolean }
        decision: { type: string, enum: [accepted, rejected] }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        valid_minutes: { type: integer }

    DoorLookupRow:
      type: object
      description: |
        Una reservación encontrada por folio, nombre o teléfono. El teléfono NO se
        devuelve: solo sus últimos cuatro dígitos, para preguntar y comparar.
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        starts_at: { type: string, format: date-time }
        guest_count: { type: integer }
        pass_code: { type: [string, 'null'] }
        holder_name: { type: string }
        phone_last4: { type: [string, 'null'] }
        table_code: { type: [string, 'null'] }
        section: { type: [string, 'null'] }
        floor: { type: [string, 'null'] }
        passes_total: { type: integer }
        passes_used: { type: integer }
        passes_active: { type: integer }
