  /api/nightclubs/{nightclubId}/song-requests:
    post:
      operationId: postNightclubsByNightclubIdSongRequests
      tags: [Propinas y canciones]
      summary: Pedir una canción al DJ en turno
      description: |
        Si la misma canción (título y artista, sin importar mayúsculas ni acentos) ya está
        pedida esta noche, **se suma un voto** a esa solicitud en lugar de crear otra
        (`merged: true`, 200). La propina (`tip_amount`) es aparte y va al DJ con su mínimo.
        Idempotente por `client_request_id`. Sin DJ en turno: 422.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, song_title]
              properties:
                client_request_id: { type: string, format: uuid }
                dj_user_id: { type: string, format: uuid, description: Por omisión el DJ en turno. }
                song_title: { type: string, maxLength: 200 }
                artist: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 280 }
                tip_amount: { type: number, minimum: 0, default: 0 }
                currency: { $ref: '#/components/schemas/Currency' }
                anonymous_tip: { type: boolean, default: false }
      responses:
        '201':
          description: Solicitud nueva
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_request: { $ref: '#/components/schemas/SongRequest' }
                  merged: { type: boolean, example: false }
        '200':
          description: Sumada a una solicitud existente, o reenvío idempotente
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_request: { $ref: '#/components/schemas/SongRequest' }
                  merged: { type: [boolean, 'null'] }
        '409':
          description: Ya pediste esa canción esta noche
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: getNightclubsByNightclubIdSongRequests
      tags: [Propinas y canciones]
      summary: Cola de canciones de la noche
      description: Más votadas primero. Un cliente no ve montos de propina ni ids de otras personas.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [requested, played], default: requested }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_requests:
                    type: array
                    items: { $ref: '#/components/schemas/SongRequest' }

  /api/nightclubs/{nightclubId}/song-requests/mine:
    get:
      operationId: getNightclubsByNightclubIdSongRequestsMine
      tags: [Propinas y canciones]
      summary: Canciones que pedí o voté
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_requests:
                    type: array
                    items: { $ref: '#/components/schemas/SongRequest' }

  /api/nightclubs/{nightclubId}/dj/song-requests:
    get:
      operationId: getNightclubsByNightclubIdDjSongRequests
      tags: [Propinas y canciones]
      summary: Cola del DJ
      description: Rol `dj` (solo la suya) o `manager` (todas). Por votos y propina.
