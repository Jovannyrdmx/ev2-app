      properties:
        reservation_id: { type: string, format: uuid }
        status: { type: string }
        pass_code: { type: string, examples: ['EV2-4K7M-2P4X'] }
        guest:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        table:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            section: { type: string }
            floor: { type: string }
            capacity: { type: integer }
        guest_count: { type: integer }
        extras_bought: { type: integer, description: Accesos extra comprados en la puerta. }
        starts_at: { type: string, format: date-time }
        checked_in_at: { type: [string, 'null'], format: date-time }
        special_requests: { type: [string, 'null'] }
        result:
          type: string
          enum: [ok, not_found, already_in, not_tonight, cancelled, unpaid]
        ok: { type: boolean }

    DoorAdmissionCreate:
      type: object
      required: [kind, unit_price]
      properties:
        kind:
          type: string
          enum: [general, vip_extra]
