openapi: 3.1.0
info:
  title: EV2 Clandestinoz API
  version: 0.1.0
  description: |
    API del sistema de gestión de nightclub EV2 Clandestinoz.

    **Este archivo es el contrato entre backend, web y apps móviles.** Cualquier cambio
    de ruta o de forma de respuesta se refleja aquí en el mismo commit que lo introduce.

    ## Autenticación
    Salvo las rutas marcadas como públicas, toda petición requiere
    `Authorization: Bearer <access_token>`. El token de acceso dura 15 minutos; se renueva
    con `POST /api/auth/refresh` usando el refresh token, que es de **un solo uso**
    (al canjearlo se revoca y se emite uno nuevo).

    ## Errores
    Todos los errores tienen la misma forma (`ErrorResponse`). Los códigos usados son
    400 validación, 401 sin autenticar, 403 sin permiso, 404 no existe, 409 conflicto de
    estado, 422 regla de negocio, 429 límite de peticiones, 500 interno, 501 no implementado.

    ## Dinero
    Los importes son cadenas decimales con dos decimales (`"1500.00"`) para no perder
    precisión, y siempre van acompañados de `currency` (`MXN` o `USD`). Los precios se
    calculan **siempre en el servidor**.

    ## Precios de reservación
    Una mesa se reserva por **toda la noche**, que corresponde a un evento del calendario.
    El precio es `base de la zona + (personas extra x precio del boleto de esa noche) +
    extras`. Cada zona incluye un número de boletos y admite un tope de extras (por
    ejemplo, Zona Roja incluye 8 personas y no admite extras). El gerente puede cambiar la
    lista estándar o ajustar una zona solo para un evento; las reservaciones ya hechas
    conservan congelado el precio con el que se pactaron.

    Quien no llega antes del plazo de llegada del evento (3 horas por omisión desde la
    apertura de puertas) pierde la mesa y el depósito.

    ## Flirt
    Nadie recibe un flirt sin activar `accept_flirts`, ni aparece en la lista sin activar
    `discoverable` (ambos nacen apagados). Emisor y receptor deben estar sentados en el
    club; un flirt caduca a las 12 horas. Límites: 20 por hora, 3 sin respuesta a la misma
    persona por noche, y «no me interesa» silencia a ese emisor el resto de la noche. Un
    bloqueo o una persona con reportes abiertos responde con un **404 neutro**. Un trago o
    botella enviado por flirt es un pedido real, **cobrado al emisor al pedirlo**; si el
    receptor lo rechaza, el pedido vuelve a la mesa del emisor y **nunca se reembolsa**.

    ## Empleados y dinero
    El club no retiene nada de las propinas y no hay monto mínimo de retiro. El saldo de un
    empleado nunca se guarda: se **calcula** desde el libro contable (lo cobrado como
    beneficiario menos lo retirado), por moneda. Las cuentas bancarias se validan (CLABE con
    dígito verificador, routing ABA con checksum), se cifran en la base y solo se muestran
    como `****1234`, también al gerente, quien debe **verificarlas** antes del primer retiro.
    Un retiro nace `pending`; el gerente lo aprueba (fijando el tipo de cambio de ese
    momento si hay conversión), lo rechaza, o lo marca `paid` cuando hizo la transferencia,
    y en ese momento se asienta la salida en el libro.

    ## Propinas y canciones
    Una propina escribe su fila en `tips` y su asiento en `transactions` en una sola
    transacción SQL, idempotente por `client_request_id`. Nace `pending` y solo entra al
    saldo del empleado cuando está `paid` (cobro con tarjeta en la fase 3; mientras, el
    gerente confirma las de efectivo). Los mínimos y sugeridos por rol son los que el club
    ya usaba y el gerente los edita; el club no retiene nada. Un trago al personal solo va a
    roles autorizados (ambientadoras) en turno, es un pedido real cobrado al enviarlo y, si
    lo rechazan, vuelve a la mesa del cliente sin reembolso. La propina al DJ es aparte de
    la solicitud de canción; el DJ no rechaza solicitudes, y la misma canción pedida por
    varias personas se junta en una sola con votos.

    ## Idempotencia
    Crear un pedido o una reservación exige un `client_request_id` (UUID generado por el
    cliente). Reenviar la misma petición devuelve el recurso original con la cabecera
    `Idempotent-Replay: true` en lugar de duplicarlo.
  contact:
    name: EV2 Clandestinoz
  license:
    name: Propietario — EV2 Clandestinoz
    url: https://github.com/Jovannyrdmx/ev2-app
servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://staging-api.CAMBIAR-DOMINIO.mx
    description: Staging (fase 7)
  - url: https://api.CAMBIAR-DOMINIO.mx
    description: Producción (fase 7)

tags:
  - name: Sistema
    description: Salud del servicio y webhooks.
  - name: Autenticación
    description: Registro, inicio de sesión, renovación y cierre de sesión.
  - name: Club
    description: Perfil del club, personal, contactos de emergencia, eventos y tablero.
  - name: Bebidas
    description: Catálogo y existencias.
  - name: Pedidos
    description: Pedidos de bebidas y flujo de la barra.
  - name: Mesas
    description: Plano del local, ocupación y edición del layout.
  - name: Eventos y precios
    description: |
      Calendario de noches, precio del boleto, lista de precios por zona y ajustes de
      precio para un evento concreto. Todo lo edita el gerente desde la aplicación.
  - name: Reservaciones
    description: Reglas, disponibilidad, cotización, reserva, llegada tardía y cancelación.
  - name: Flirt
    description: |
      Conexión entre clientes dentro del club: opt-in, solo sentados y solo esa noche.
      Bloqueos y reportes; trago o botella como pedido real. El gerente ve conteos y
      reportes, nunca mensajes.
  - name: Empleados
    description: |
      Alta por el gerente con contraseña temporal, perfil, cuentas bancarias cifradas y
      verificadas por el gerente, saldo calculado desde el libro contable, retiros con
      aprobación y tipo de cambio con historial.
  - name: Propinas y canciones
    description: |
      Turnos del personal, propinas (mínimos y sugeridos por rol, editables), tragos al
      personal autorizado, solicitudes de canción al DJ con votos y tablero de
      reconocimiento.
  - name: Taxi y salida segura
    description: |
      Conductores de confianza dados de alta por el gerente, disponibilidad declarada por
      el conductor, tarifas por zona, ciclo del viaje confirmado por el conductor, cobro en
      efectivo asentado en el libro y constancia de salida con folio verificable.
  - name: Valet
    description: |
      Recepcion de autos con comprobante QR, tablero del estacionamiento, entrega
      verificada con el token del QR y entrega sin QR autorizada por el gerente con
      constancia. El estacionamiento es gratis: lo que gana el valet es la propina.
  - name: Pagos
    description: Métodos de pago guardados por el usuario.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Sistema]
      summary: Estado del servicio
      description: Público. Usado por los healthchecks de Docker y por el monitoreo.
      security: []
      responses:
        '200':
          description: Servicio arriba
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: ev2-api }
                  timestamp: { type: string, format: date-time }

  /api/auth/register:
    post:
      operationId: postAuthRegister
      tags: [Autenticación]
      summary: Registrar un cliente
      description: |
        Público. Crea una cuenta con rol `guest`. Rechaza con 403 a menores de 18 años y
        exige aceptación de términos. El consentimiento para recibir flirts es opt-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Menor de edad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El correo ya está registrado en ese club
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/login:
    post:
      operationId: postAuthLogin
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Público. Limitado a 10 intentos fallidos por minuto y por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nightclub_slug, email, password]
              properties:
                nightclub_slug: { type: string, example: ev2 }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Cuenta bloqueada o eliminada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [Autenticación]
      summary: Renovar el token de acceso
      description: |
        Público (el refresh token es la credencial). El token entregado se **revoca** y se
        emite uno nuevo; reutilizar el anterior devuelve 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Refresh token inválido, expirado o ya usado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Autenticación]
      summary: Cerrar sesión en todos los dispositivos
      description: Revoca todos los refresh tokens del usuario.
      responses:
        '204': { description: Sesiones cerradas }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      operationId: getAuthMe
      tags: [Autenticación]
      summary: Usuario autenticado y sus preferencias
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  preferences:
                    type: [object, 'null']
                    properties:
                      accept_flirts: { type: boolean }
                      show_on_map: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/by-slug/{slug}:
    get:
      operationId: getNightclubsBySlugBySlug
      tags: [Club]
      summary: Resolver un club por su identificador corto
      description: Público. La app web lo usa antes de que nadie inicie sesión.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: ev2 }
      responses:
        '200':
          description: Club encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  nightclub: { $ref: '#/components/schemas/NightclubPublic' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}:
    get:
      operationId: getNightclubsByNightclubId
      tags: [Club]
      summary: Perfil del club
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  nightclub: { $ref: '#/components/schemas/Nightclub' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/staff:
    get:
      operationId: getNightclubsByNightclubIdStaff
      tags: [Club]
      summary: Directorio de personal
      description: Usado por propinas, solicitudes de canción y asignación de mesas.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: role
          in: query
          schema:
            type: string
            enum: [waiter, bartender, dancer, dj, light_tech, valet, hostess, manager]
        - name: on_shift
          in: query
          description: Solo quienes tienen turno abierto
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Personal
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items: { $ref: '#/components/schemas/StaffMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/emergency-contacts:
    get:
      operationId: getNightclubsByNightclubIdEmergencyContacts
      tags: [Club]
      summary: Contactos de emergencia del club
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Contactos
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        phone: { type: string }
                        type:
                          type: string
                          enum: [police, ambulance, fire, taxi, club_security, other]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/sync/events:
    get:
      operationId: getNightclubsByNightclubIdSyncEvents
      tags: [Club]
      summary: Recuperar eventos de dominio perdidos tras una reconexión
      description: |
        Devuelve solo los eventos dirigidos a este usuario (por rol o por id), de las
        últimas 24 horas. El cliente guarda `last_id` y lo envía como `since_id` al
        reconectar. El envío en vivo por WebSocket llega en la fase 3.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: since_id
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/SyncEvent' }
                  last_id:
                    type: string
                    description: |
                      Identificador del último evento entregado. Es una cadena porque en la
                      base de datos es un entero de 64 bits y JavaScript pierde precisión
                      por encima de 2^53. Guárdalo tal cual y devuélvelo en `since_id`.
                    example: '42'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/dashboard:
    get:
      operationId: getNightclubsByNightclubIdDashboard
      tags: [Club]
      summary: Tablero del gerente
      description: Requiere rol `manager` o `admin`. La jornada se corta a las 06:00.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Métricas de la jornada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/drinks:
    get:
      operationId: getNightclubsByNightclubIdDrinks
      tags: [Bebidas]
      summary: Menú del club
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: category
          in: query
          schema: { type: string, example: cocktail }
        - name: available_only
          in: query
          description: Solo lo que está disponible y con existencias
          schema: { type: boolean, default: false }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Bebidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  drinks:
                    type: array
                    items: { $ref: '#/components/schemas/Drink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postNightclubsByNightclubIdDrinks
      tags: [Bebidas]
      summary: Alta de bebida
      description: Requiere rol `manager`. En operación normal el catálogo llega del POS (fase 4).
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrinkCreate' }
      responses:
        '201':
          description: Bebida creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  drink: { $ref: '#/components/schemas/Drink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/drinks/categories:
    get:
      operationId: getNightclubsByNightclubIdDrinksCategories
      tags: [Bebidas]
      summary: Categorías con su conteo
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/drinks/{drinkId}:
    patch:
      operationId: patchNightclubsByNightclubIdDrinksByDrinkId
      tags: [Bebidas]
      summary: Editar una bebida
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/DrinkId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/DrinkCreate' }]
              description: Todos los campos son opcionales salvo que se indique lo contrario.
      responses:
        '200':
          description: Bebida actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  drink: { $ref: '#/components/schemas/Drink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/inventory:
    get:
      operationId: getNightclubsByNightclubIdInventory
      tags: [Bebidas]
      summary: Existencias
      description: Requiere rol `bartender` o `manager`. Ordena primero lo que está bajo mínimo.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Inventario
          content:
            application/json:
              schema:
                type: object
                properties:
                  inventory:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/inventory/{drinkId}:
    put:
      operationId: putNightclubsByNightclubIdInventoryByDrinkId
      tags: [Bebidas]
      summary: Ajuste manual de existencias
      description: |
        Requiere rol `manager`. En operación normal el inventario se sincroniza desde el
        POS (fase 4); este ajuste es para correcciones puntuales.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/DrinkId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number, minimum: 0 }
                low_stock_threshold: { type: number, minimum: 0 }
      responses:
        '200':
          description: Existencias actualizadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  inventory: { $ref: '#/components/schemas/InventoryItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/tables:
    get:
      operationId: getNightclubsByNightclubIdTables
      tags: [Mesas]
      summary: Mapa de mesas con sus ocupantes
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: section
          in: query
          schema: { type: string, example: ZONA DIAMANTE }
        - name: floor
          in: query
          description: EV2 Clandestinoz tiene dos plantas.
          schema: { type: string, enum: [baja, alta, ambas] }
        - name: status
          in: query
          schema:
            type: string
            enum: [available, occupied, reserved, blocked, cleaning]
      responses:
        '200':
          description: Mesas
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/floor-plan:
    get:
      operationId: getNightclubsByNightclubIdFloorPlan
      tags: [Mesas]
      summary: Plano completo del local
      description: |
        Todo lo necesario para dibujar el mapa: mesas con sus coordenadas y ocupación
        actual, las áreas que no son mesas (barra, pista, cabina del DJ, entrada, baños)
        y el tamaño del lienzo. EV2 Clandestinoz tiene dos plantas: sin filtro se
        devuelven ambas.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: floor
          in: query
          schema: { type: string, enum: [baja, alta, ambas] }
      responses:
        '200':
          description: Plano
          content:
            application/json:
              schema:
                type: object
                properties:
                  canvas:
                    type: [object, 'null']
                    properties:
                      width: { type: integer }
                      height: { type: integer }
                  floors: { type: array, items: { type: string } }
                  tables:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Table' }
                        - type: object
                          properties:
                            seated: { type: integer, description: Personas sentadas ahora mismo. }
                  landmarks:
                    type: array
                    items: { $ref: '#/components/schemas/Landmark' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/tables/stats:
    get:
      operationId: getNightclubsByNightclubIdTablesStats
      tags: [Mesas]
      summary: Ocupación del local
      description: |
        Requiere personal de piso (`waiter`, `hostess`, `bartender`, `manager`).
        Devuelve el total del club y el desglose por piso y por zona, con el porcentaje
        de mesas ocupadas y el de lugares usados sobre el aforo.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Ocupación
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { $ref: '#/components/schemas/OccupancyBucket' }
                  floors:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            floor: { type: string }
                        - { $ref: '#/components/schemas/OccupancyBucket' }
                        - type: object
                          properties:
                            sections:
                              type: array
                              items:
                                allOf:
                                  - type: object
                                    properties:
                                      section: { type: string }
                                  - { $ref: '#/components/schemas/OccupancyBucket' }
                  generated_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/tables/layout:
    put:
      operationId: putNightclubsByNightclubIdTablesLayout
      tags: [Mesas]
      summary: Guardar el plano de mesas
      description: |
        Requiere rol `manager`. Actualiza en bloque coordenadas, radio, sección,
        capacidad y estado. Se usa desde el editor visual del portal de gerencia.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tables]
              properties:
                tables:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, format: uuid }
                      x: { type: number }
                      y: { type: number }
                      radius: { type: number, exclusiveMinimum: 0 }
                      section: { type: string }
                      capacity: { type: integer, minimum: 1 }
                      status:
                        type: string
                        enum: [available, occupied, reserved, blocked, cleaning]
                      bottle_service: { type: boolean }
      responses:
        '200':
          description: Mesas actualizadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/tables/{tableId}/seat:
    post:
      operationId: postNightclubsByNightclubIdTablesByTableIdSeat
      tags: [Mesas]
      summary: Sentarse en una mesa
      description: |
        El usuario deja automáticamente cualquier otra mesa. Rechaza con 409 si la mesa
        está llena, bloqueada o en limpieza.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/TableId' }
      responses:
        '201':
          description: Sentado
          content:
            application/json:
              schema:
                type: object
                properties:
                  seated: { type: boolean }
                  table_id: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/tables/{tableId}/release:
    post:
      operationId: postNightclubsByNightclubIdTablesByTableIdRelease
      tags: [Mesas]
      summary: Levantarse de una mesa
      description: |
        Sin cuerpo, libera al propio usuario. Con `user_id`, libera a otra persona: eso
        requiere rol `waiter`, `hostess` o `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/TableId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Liberado
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: boolean }
                  table_id: { type: string, format: uuid }
                  remaining: { type: integer, description: Personas que siguen en la mesa }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/orders:
    post:
      operationId: postNightclubsByNightclubIdOrders
      tags: [Pedidos]
      summary: Crear un pedido de bebidas
      description: |
        Idempotente por `client_request_id`. Verifica existencias con bloqueo de fila
        (dos pedidos simultáneos no pueden agotar el mismo producto), congela el precio
        de cada artículo y descuenta el inventario en la misma transacción.

        Si `recipient_id` está presente, el pedido es una invitación a otra persona; se
        rechaza si esa persona bloqueó al remitente.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '200':
          description: |
            Reenvío de una petición ya procesada. Devuelve el pedido original con la
            cabecera `Idempotent-Replay: true`.
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Producto no disponible o sin existencias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: conflict
                  message: Some drinks are not available
                  details:
                    - drink_id: 0a1b2c3d-0000-4000-8000-000000000001
                      name: Cerveza nacional
                      reason: out_of_stock
                      stock: 0
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: getNightclubsByNightclubIdOrders
      tags: [Pedidos]
      summary: Cola de pedidos
      description: Requiere rol `bartender`, `waiter` o `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, preparing, ready, delivered, cancelled, pos_error]
        - name: active
          in: query
          description: Solo pedidos sin terminar
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Pedidos, del más antiguo al más reciente
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/orders/mine:
    get:
      operationId: getNightclubsByNightclubIdOrdersMine
      tags: [Pedidos]
      summary: Mis pedidos (enviados y recibidos)
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/orders/{orderId}:
    get:
      operationId: getNightclubsByNightclubIdOrdersByOrderId
      tags: [Pedidos]
      summary: Detalle de un pedido
      description: Accesible para quien lo envió, quien lo recibe y el personal.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/orders/{orderId}/status:
    post:
      operationId: postNightclubsByNightclubIdOrdersByOrderIdStatus
      tags: [Pedidos]
      summary: Cambiar el estado de un pedido
      description: |
        Transiciones permitidas:

        | Desde | Hacia |
        |---|---|
        | `pending` | `confirmed`, `cancelled` |
        | `confirmed` | `preparing`, `cancelled` |
        | `preparing` | `ready`, `cancelled` |
        | `ready` | `delivered` |
        | `pos_error` | `confirmed`, `cancelled` |

        El personal (`bartender`, `waiter`, `manager`) puede hacer cualquiera de ellas.
        Un cliente solo puede **cancelar su propio pedido mientras siga en `pending`**.
        Cancelar devuelve las existencias al inventario.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, preparing, ready, delivered, cancelled]
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/events:
    get:
      operationId: getNightclubsByNightclubIdEvents
      tags: [Eventos y precios]
      summary: Calendario de noches
      description: Un cliente solo ve los eventos `published`; el personal los ve todos.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, cancelled, finished] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: upcoming
          in: query
          description: Solo de hoy en adelante.
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: postNightclubsByNightclubIdEvents
      tags: [Eventos y precios]
      summary: Crear una noche
      description: Requiere rol `manager`. Una fecha no puede tener dos eventos.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
      responses:
        '201':
          description: Evento creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe un evento en esa fecha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/events/{eventId}:
    get:
      operationId: getNightclubsByNightclubIdEventsByEventId
      tags: [Eventos y precios]
      summary: Una noche
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/EventId' }
      responses:
        '200':
          description: Evento
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchNightclubsByNightclubIdEventsByEventId
      tags: [Eventos y precios]
      summary: Editar la noche (precio de boleto, horario, estado)
      description: |
        Requiere rol `manager`. Si se cambia el precio del boleto y ya hay reservaciones,
        la respuesta trae la cabecera `X-Warning`: las reservaciones existentes conservan
        el precio con el que se hicieron.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/EventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdate' }
      responses:
        '200':
          description: Evento actualizado
          headers:
            X-Warning:
              description: Aviso cuando el cambio afecta a reservaciones ya hechas.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteNightclubsByNightclubIdEventsByEventId
      tags: [Eventos y precios]
      summary: Borrar una noche sin reservaciones
      description: |
        Requiere rol `manager`. Un evento con reservaciones vivas no se borra: se cancela,
        para que las reservaciones y el dinero sigan siendo rastreables.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/EventId' }
      responses:
        '204': { description: Borrado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tiene reservaciones activas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/events/{eventId}/zones:
    get:
      operationId: getNightclubsByNightclubIdEventsByEventIdZones
      tags: [Eventos y precios]
      summary: Precios de zona vigentes para esa noche
      description: |
        La lista estandar con los ajustes del evento ya aplicados encima. `overridden`
        indica que zonas estan ajustadas para esta noche en particular.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/EventId' }
      responses:
        '200':
          description: Precios efectivos
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/EventSummary' }
                  zones:
                    type: array
                    items: { $ref: '#/components/schemas/EffectiveZone' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/events/{eventId}/zones/{section}:
    put:
      operationId: putNightclubsByNightclubIdEventsByEventIdZonesBySection
      tags: [Eventos y precios]
      summary: Ajustar una zona solo para esa noche
      description: |
        Requiere rol `manager`. Cada campo es opcional: lo que se deje en `null` vuelve a
        tomar el valor de la lista estandar. No toca las reservaciones ya hechas.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/EventId' }
        - { $ref: '#/components/parameters/ZoneSection' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneOverride' }
      responses:
        '200':
          description: Ajuste guardado
          headers:
            X-Warning:
              description: Aviso cuando ya hay reservaciones en esa zona para esa noche.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone: { $ref: '#/components/schemas/EffectiveZone' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteNightclubsByNightclubIdEventsByEventIdZonesBySection
      tags: [Eventos y precios]
      summary: Quitar el ajuste y volver al precio estandar
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/EventId' }
        - { $ref: '#/components/parameters/ZoneSection' }
      responses:
        '204': { description: Ajuste eliminado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/zone-pricing:
    get:
      operationId: getNightclubsByNightclubIdZonePricing
      tags: [Eventos y precios]
      summary: Lista de precios estandar por zona
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Zonas
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    items: { $ref: '#/components/schemas/ZonePricing' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/zone-pricing/{section}:
    put:
      operationId: putNightclubsByNightclubIdZonePricingBySection
      tags: [Eventos y precios]
      summary: Crear o editar una zona de la lista estandar
      description: Requiere rol `manager`. Rige de aqui en adelante; no altera reservaciones ya hechas.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/ZoneSection' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonePricingUpdate' }
      responses:
        '200':
          description: Zona guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone: { $ref: '#/components/schemas/ZonePricing' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reservation-products:
    get:
      operationId: getNightclubsByNightclubIdReservationProducts
      tags: [Eventos y precios]
      summary: Catalogo de botellas y extras
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: kind
          in: query
          schema: { type: string, enum: [bottle, addon] }
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/ReservationProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/reservation-products/{code}:
    put:
      operationId: putNightclubsByNightclubIdReservationProductsByCode
      tags: [Eventos y precios]
      summary: Crear o editar una botella o extra
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: code
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationProductUpdate' }
      responses:
        '200':
          description: Producto guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/ReservationProduct' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reservations/release-no-shows:
    post:
      operationId: postNightclubsByNightclubIdReservationsReleaseNoShows
      tags: [Reservaciones]
      summary: Liberar las mesas de quienes no llegaron
      description: |
        Requiere rol `hostess` o `manager`. Marca como `no_show` toda reservacion cuyo
        plazo de llegada ya vencio, libera la mesa y **no** devuelve el deposito (D17).
        Es idempotente: llamarla de nuevo no hace nada.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Reservaciones liberadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: integer }
                  reservations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        table_code: { type: string }
                        arrival_deadline: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reservations/rules:
    get:
      operationId: getNightclubsByNightclubIdReservationsRules
      tags: [Reservaciones]
      summary: Reglas de reservación del club
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Reglas
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: { $ref: '#/components/schemas/ReservationRules' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putNightclubsByNightclubIdReservationsRules
      tags: [Reservaciones]
      summary: Editar las reglas
      description: Requiere rol `manager`.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRulesUpdate' }
      responses:
        '200':
          description: Reglas actualizadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: { $ref: '#/components/schemas/ReservationRules' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/reservations/availability:
    get:
      operationId: getNightclubsByNightclubIdReservationsAvailability
      tags: [Reservaciones]
      summary: Mesas disponibles con su precio
      description: |
        Mesas libres para una noche (un evento), con el precio y el depósito ya calculados
        para ese número de personas. Solo aparecen las zonas reservables cuya regla admite
        al grupo (`boletos incluidos + extras >= guests`).
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: event_id
          in: query
          required: true
          description: La noche que se quiere reservar.
          schema: { type: string, format: uuid }
        - name: guests
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 2 }
        - name: section
          in: query
          schema: { type: string }
        - name: floor
          in: query
          schema: { type: string, enum: [baja, alta, ambas] }
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Fuera de las reglas del club (anticipación mínima)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/reservations/quote:
    post:
      operationId: postNightclubsByNightclubIdReservationsQuote
      tags: [Reservaciones]
      summary: Cotizar una reservación
      description: |
        Devuelve el desglose completo de la noche: base de la zona, boletos incluidos,
        personas extra al precio del boleto del evento, extras, descuento, total y
        depósito. El cliente **muestra** este resultado; no puede proponer un precio propio.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, table_id, guest_count]
              properties:
                event_id: { type: string, format: uuid }
                table_id: { type: string, format: uuid }
                guest_count: { type: integer, minimum: 1, maximum: 50 }
                addons:
                  type: array
                  maxItems: 20
                  items: { $ref: '#/components/schemas/AddonInput' }
                discount_code: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/reservations:
    post:
      operationId: postNightclubsByNightclubIdReservations
      tags: [Reservaciones]
      summary: Reservar una mesa
      description: |
        Se reserva la mesa para **toda la noche** de un evento, no para un horario.
        Idempotente por `client_request_id`. El total y el depósito los calcula el
        servidor y quedan congelados (`zone_base_at_booking`, `ticket_at_booking`), de
        modo que un cambio de precio posterior nunca altera lo ya pactado.

        La reservación nace en `pending_payment` y genera una transacción de depósito en
        estado `pending`; el cobro real se conecta en la fase 3. Una misma mesa no puede
        tener dos reservaciones vivas en el mismo evento: lo impide un índice único en la
        base de datos, incluso ante peticiones simultáneas.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
      responses:
        '201':
          description: Reservación creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
                  payment:
                    type: object
                    properties:
                      status: { type: string, example: pending }
                      deposit: { type: number }
                      currency: { type: string }
                      note: { type: string }
        '200':
          description: Reenvío idempotente
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
        '409':
          description: La mesa ya está reservada para ese evento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: getNightclubsByNightclubIdReservations
      tags: [Reservaciones]
      summary: Agenda del club
      description: Requiere rol `hostess`, `waiter` o `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: date
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, confirmed, seated, completed, cancelled, no_show]
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Reservaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items: { $ref: '#/components/schemas/Reservation' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reservations/mine:
    get:
      operationId: getNightclubsByNightclubIdReservationsMine
      tags: [Reservaciones]
      summary: Mis reservaciones
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Reservaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}:
    get:
      operationId: getNightclubsByNightclubIdReservationsByReservationId
      tags: [Reservaciones]
      summary: Detalle de una reservación
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/ReservationId' }
      responses:
        '200':
          description: Reservación
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/cancel:
    post:
      operationId: postNightclubsByNightclubIdReservationsByReservationIdCancel
      tags: [Reservaciones]
      summary: Cancelar una reservación
      description: |
        La puede cancelar su titular o el personal (`hostess`, `manager`). El porcentaje
        de reembolso sale de las ventanas configuradas en las reglas del club, y solo se
        reembolsa lo que efectivamente se haya cobrado.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/ReservationId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                  refund_pct: { type: number, example: 100 }
                  refund_amount: { type: number, example: 891 }
                  paid_amount: { type: number }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La reservación ya no se puede cancelar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/status:
    post:
      operationId: postNightclubsByNightclubIdReservationsByReservationIdStatus
      tags: [Reservaciones]
      summary: Avanzar el estado de una reservación
      description: |
        Requiere rol `hostess` o `manager`. Transiciones:
        `pending_payment` → `confirmed`; `confirmed` → `seated` | `no_show`;
        `seated` → `completed`. Cambiar el estado también ocupa o libera la mesa.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/ReservationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, seated, completed, no_show]
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/me/preferences:
    get:
      operationId: getMePreferences
      tags: [Flirt]
      summary: Mis preferencias
      responses:
        '200':
          description: Preferencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putMePreferences
      tags: [Flirt]
      summary: Activar o apagar recibir flirts y aparecer en la lista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                accept_flirts: { type: boolean }
                discoverable: { type: boolean }
                show_on_map: { type: boolean }
                notifications:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        '200':
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/me/blocks:
    get:
      operationId: getMeBlocks
      tags: [Flirt]
      summary: Personas que bloqueé
      responses:
        '200':
          description: Bloqueos
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        display_name: { type: string }
                        created_at: { type: string, format: date-time }

  /api/me/blocks/{userId}:
    post:
      operationId: postMeBlocksByUserId
      tags: [Flirt]
      summary: Bloquear a una persona
      description: |
        Ambos desaparecen de la lista del otro y cualquier envío falla con un 404 neutro.
        Los flirts pendientes de esa persona se cierran; un trago ya pedido sigue su curso.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '201':
          description: Bloqueado
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked: { type: boolean }
                  user_id: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteMeBlocksByUserId
      tags: [Flirt]
      summary: Quitar un bloqueo
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: Desbloqueado }

  /api/nightclubs/{nightclubId}/flirts/catalogue:
    get:
      operationId: getNightclubsByNightclubIdFlirtsCatalogue
      tags: [Flirt]
      summary: Emojis permitidos, reacciones y límites
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  emojis:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [wave, wink, kiss, fire, heart, dance, star] }
                        icon: { type: string }
                        label_es: { type: string }
                  reactions:
                    type: array
                    items: { $ref: '#/components/schemas/FlirtReaction' }
                  limits:
                    type: object
                    properties:
                      per_hour: { type: integer, example: 20 }
                      unanswered_per_night: { type: integer, example: 3 }
                      message_max: { type: integer, example: 140 }

  /api/nightclubs/{nightclubId}/flirts/people:
    get:
      operationId: getNightclubsByNightclubIdFlirtsPeople
      tags: [Flirt]
      summary: Personas disponibles esta noche
      description: |
        Clientes sentados ahora mismo que eligieron aparecer, sin bloqueos en ningún
        sentido y sin reportes abiertos. Solo sale nombre visible, mesa y zona. Hay que
        estar sentado para consultarla.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: section
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Personas
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '422':
          description: Quien consulta no está sentado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/flirts:
    post:
      operationId: postNightclubsByNightclubIdFlirts
      tags: [Flirt]
      summary: Enviar un flirt
      description: |
        Idempotente por `client_request_id`. Solo clientes. `emoji` exige una clave del
        catálogo; `meet` invita a la mesa del emisor; `drink` y `bottle` exigen `drink_id`
        y crean un **pedido real** para la mesa del receptor, cobrado al emisor.

        Errores: 403 sin opt-in o silenciado; 404 neutro si hay bloqueo o reportes; 422 si
        alguno no está sentado; 429 por límite de hora o de flirts sin respuesta; 409 si
        no hay existencias del trago.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlirtCreate' }
      responses:
        '201':
          description: Flirt enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '200':
          description: Reenvío idempotente
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/nightclubs/{nightclubId}/flirts/received:
    get:
      operationId: getNightclubsByNightclubIdFlirtsReceived
      tags: [Flirt]
      summary: Flirts recibidos esta noche
      description: Vacío si la persona apagó `accept_flirts`. Los caducados no aparecen.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Bandeja
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirts:
                    type: array
                    items: { $ref: '#/components/schemas/Flirt' }
                  accept_flirts: { type: boolean }

  /api/nightclubs/{nightclubId}/flirts/sent:
    get:
      operationId: getNightclubsByNightclubIdFlirtsSent
      tags: [Flirt]
      summary: Flirts que envié esta noche
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirts:
                    type: array
                    items: { $ref: '#/components/schemas/Flirt' }

  /api/nightclubs/{nightclubId}/flirts/stats:
    get:
      operationId: getNightclubsByNightclubIdFlirtsStats
      tags: [Flirt]
      summary: Conteos de la noche para el gerente
      description: Requiere rol `manager`. Solo números; nunca nombres ni mensajes.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlirtStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/flirts/{flirtId}/view:
    post:
      operationId: postNightclubsByNightclubIdFlirtsByFlirtIdView
      tags: [Flirt]
      summary: Marcar un flirt como visto
      description: Solo el receptor. Un tercero recibe 404.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/FlirtId' }
      responses:
        '200':
          description: Flirt
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El flirt ya caducó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/flirts/{flirtId}/react:
    post:
      operationId: postNightclubsByNightclubIdFlirtsByFlirtIdReact
      tags: [Flirt]
      summary: Responder a un flirt
      description: |
        Solo el receptor. `not_interested` rechaza el flirt, silencia a ese emisor por el
        resto de la noche y, si era un trago o botella, **devuelve el pedido a la mesa del
        emisor** (sin cancelar ni reembolsar). Cualquier otra reacción lo acepta.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/FlirtId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction: { $ref: '#/components/schemas/FlirtReaction' }
      responses:
        '200':
          description: Flirt con la reacción
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/users/{userId}/report:
    post:
      operationId: postNightclubsByNightclubIdUsersByUserIdReport
      tags: [Flirt]
      summary: Reportar a una persona
      description: |
        Un reporte abierto por persona reportada. Con dos reportes abiertos la persona
        deja de aparecer en la lista y de recibir flirts hasta que el gerente revise.
        `flirt_id` solo puede ser un flirt que el reportante recibió de esa persona.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/ReportReason' }
                details: { type: string, maxLength: 500 }
                flirt_id: { type: string, format: uuid }
      responses:
        '201':
          description: Reporte creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      reason: { $ref: '#/components/schemas/ReportReason' }
                      status: { type: string, example: open }
                      created_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya hay un reporte abierto sobre esa persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/reports:
    get:
      operationId: getNightclubsByNightclubIdReports
      tags: [Flirt]
      summary: Reportes para revisar
      description: Requiere rol `manager`. Trae quién, a quién, motivo y detalle; nunca el mensaje del flirt.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [open, reviewed, actioned, dismissed] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Reportes, los abiertos primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reports/{reportId}:
    patch:
      operationId: patchNightclubsByNightclubIdReportsByReportId
      tags: [Flirt]
      summary: Resolver un reporte
      description: |
        Requiere rol `manager`. `actioned` **bloquea la cuenta** de la persona reportada,
        cierra sus sesiones y la saca de su mesa. `dismissed` la vuelve a mostrar.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [reviewed, actioned, dismissed] }
                resolution_note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Reporte actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/password:
    post:
      operationId: postAuthPassword
      tags: [Autenticación]
      summary: Cambiar contraseña
      description: |
        Exige la contraseña actual y una nueva distinta; cierra las demás sesiones y
        devuelve tokens nuevos. Obligatorio tras recibir una contraseña temporal del
        gerente: mientras `must_change_password` esté activo, cualquier otra ruta responde
        403 con código `password_change_required`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: string }
                  refresh_token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/employees/me:
    get:
      operationId: getEmployeesMe
      tags: [Empleados]
      summary: Mi perfil de empleado
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putEmployeesMe
      tags: [Empleados]
      summary: Editar mi perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                stage_name: { type: [string, 'null'], maxLength: 80 }
                avatar_url: { type: [string, 'null'], format: uri }
                phone: { type: [string, 'null'], maxLength: 30 }
                preferred_currency: { $ref: '#/components/schemas/Currency' }
                preferred_payout_currency: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/employees/me/bank-accounts:
    get:
      operationId: getEmployeesMeBankAccounts
      tags: [Empleados]
      summary: Mis cuentas bancarias (enmascaradas)
      responses:
        '200':
          description: Cuentas
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_accounts:
                    type: array
                    items: { $ref: '#/components/schemas/BankAccount' }
    post:
      operationId: postEmployeesMeBankAccounts
      tags: [Empleados]
      summary: Registrar una cuenta bancaria
      description: |
        `clabe` exige 18 dígitos con dígito verificador válido; `us_checking` y
        `us_savings` exigen `routing_number` (9 dígitos, checksum ABA) y cuenta de 4 a 17
        dígitos. El número se cifra y **nunca vuelve a salir del servidor**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountCreate' }
      responses:
        '201':
          description: Cuenta guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account: { $ref: '#/components/schemas/BankAccount' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/employees/me/bank-accounts/{accountId}:
    delete:
      operationId: deleteEmployeesMeBankAccountsByAccountId
      tags: [Empleados]
      summary: Quitar una cuenta
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '204': { description: Cuenta retirada (se conserva para retiros ya pagados) }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/employees/me/earnings:
    get:
      operationId: getEmployeesMeEarnings
      tags: [Empleados]
      summary: Mi saldo y mis ganancias
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
      responses:
        '200':
          description: Saldo por moneda (no depende del filtro) y desglose del periodo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Earnings' }

  /api/employees/me/dashboard:
    get:
      operationId: getEmployeesMeDashboard
      tags: [Empleados]
      summary: Mi tablero
      responses:
        '200':
          description: Saldo, últimos movimientos, retiro en proceso y tipo de cambio
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
                  balances:
                    type: array
                    items: { $ref: '#/components/schemas/Balance' }
                  recent_movements:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string }
                        amount: { $ref: '#/components/schemas/Money' }
                        currency: { $ref: '#/components/schemas/Currency' }
                        created_at: { type: string, format: date-time }
                        metadata: { type: object, additionalProperties: true }
                  open_withdrawal:
                    oneOf:
                      - { $ref: '#/components/schemas/Withdrawal' }
                      - { type: 'null' }
                  exchange_rate:
                    oneOf:
                      - { $ref: '#/components/schemas/ExchangeRate' }
                      - { type: 'null' }
                  generated_at: { type: string, format: date-time }

  /api/employees/me/withdrawals:
    get:
      operationId: getEmployeesMeWithdrawals
      tags: [Empleados]
      summary: Mis retiros
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Retiros
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawals:
                    type: array
                    items: { $ref: '#/components/schemas/Withdrawal' }
    post:
      operationId: postEmployeesMeWithdrawals
      tags: [Empleados]
      summary: Solicitar un retiro
      description: |
        Sin monto mínimo. Exige una cuenta verificada por el gerente, saldo suficiente en
        `currency` y ningún otro retiro en proceso (409). Si `payout_currency` difiere,
        se estima con el tipo de cambio vigente; el definitivo se fija al aprobar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { $ref: '#/components/schemas/Currency' }
                payout_currency: { $ref: '#/components/schemas/Currency' }
                bank_account_id: { type: string, format: uuid, description: Por omisión la predeterminada. }
                note: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Retiro solicitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Sin cuenta verificada, saldo insuficiente o sin tipo de cambio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/employees:
    get:
      operationId: getNightclubsByNightclubIdEmployees
      tags: [Empleados]
      summary: Plantilla del club
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/EmployeeRole' }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Empleados
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postNightclubsByNightclubIdEmployees
      tags: [Empleados]
      summary: Dar de alta a un empleado
      description: |
        Requiere rol `manager`. Devuelve una **contraseña temporal una sola vez**; el
        empleado debe cambiarla al entrar. Nunca se guarda en claro.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
                  temporary_password: { type: string, description: Se muestra solo aquí. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/employees/{userId}:
    get:
      operationId: getNightclubsByNightclubIdEmployeesByUserId
      tags: [Empleados]
      summary: Un empleado
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Empleado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchNightclubsByNightclubIdEmployeesByUserId
      tags: [Empleados]
      summary: Editar, dar de baja o reiniciar contraseña
      description: |
        Requiere rol `manager`. `active: false` bloquea el acceso y cierra sesiones pero
        conserva historial y saldo. `reset_password: true` devuelve una nueva contraseña
        temporal.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/EmployeeRole' }
                stage_name: { type: [string, 'null'], maxLength: 80 }
                employee_code: { type: [string, 'null'], maxLength: 30 }
                hire_date: { type: [string, 'null'], format: date }
                phone: { type: [string, 'null'], maxLength: 30 }
                active: { type: boolean }
                reset_password: { type: boolean }
      responses:
        '200':
          description: Empleado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
                  temporary_password: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/employees/{userId}/bank-accounts:
    get:
      operationId: getNightclubsByNightclubIdEmployeesByUserIdBankAccounts
      tags: [Empleados]
      summary: Cuentas de un empleado (enmascaradas) para verificarlas
      description: Requiere rol `manager`. El gerente tampoco ve el número completo.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Cuentas
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_accounts:
                    type: array
                    items: { $ref: '#/components/schemas/BankAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/employees/{userId}/bank-accounts/{accountId}/verify:
    post:
      operationId: postNightclubsByNightclubIdEmployeesByUserIdBankAccountsByAccountIdVerify
      tags: [Empleados]
      summary: Verificar (o desverificar) una cuenta
      description: Requiere rol `manager`. Sin cuenta verificada no hay retiro.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/AccountId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verified: { type: boolean, default: true }
      responses:
        '200':
          description: Cuenta
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account: { $ref: '#/components/schemas/BankAccount' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/employees/{userId}/earnings:
    get:
      operationId: getNightclubsByNightclubIdEmployeesByUserIdEarnings
      tags: [Empleados]
      summary: Saldo y ganancias de un empleado
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
      responses:
        '200':
          description: Ganancias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Earnings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/payroll:
    get:
      operationId: getNightclubsByNightclubIdPayroll
      tags: [Empleados]
      summary: "Nómina: saldo de cada empleado por moneda"
      description: Requiere rol `manager`. Solo empleados con algún movimiento.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Nómina
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Balance' }
                        - type: object
                          properties:
                            user_id: { type: string, format: uuid }
                            display_name: { type: string }
                            role: { $ref: '#/components/schemas/EmployeeRole' }
                            active: { type: boolean }
                  pending_withdrawals: { type: integer }
                  exchange_rate:
                    oneOf:
                      - { $ref: '#/components/schemas/ExchangeRate' }
                      - { type: 'null' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/withdrawals:
    get:
      operationId: getNightclubsByNightclubIdWithdrawals
      tags: [Empleados]
      summary: Retiros por revisar
      description: Requiere rol `manager`. Pendientes primero.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, paid, rejected] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Retiros
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawals:
                    type: array
                    items: { $ref: '#/components/schemas/Withdrawal' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/withdrawals/{withdrawalId}/approve:
    post:
      operationId: postNightclubsByNightclubIdWithdrawalsByWithdrawalIdApprove
      tags: [Empleados]
      summary: Aprobar un retiro
      description: Requiere rol `manager`. Fija el tipo de cambio de ese momento si hay conversión.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/WithdrawalId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Retiro aprobado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/withdrawals/{withdrawalId}/reject:
    post:
      operationId: postNightclubsByNightclubIdWithdrawalsByWithdrawalIdReject
      tags: [Empleados]
      summary: Rechazar un retiro
      description: Requiere rol `manager`. El saldo vuelve a estar disponible (nunca se descontó).
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/WithdrawalId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Retiro rechazado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/withdrawals/{withdrawalId}/paid:
    post:
      operationId: postNightclubsByNightclubIdWithdrawalsByWithdrawalIdPaid
      tags: [Empleados]
      summary: Marcar pagado
      description: |
        Requiere rol `manager` y un retiro `approved`. Se llama cuando la transferencia ya
        se hizo por fuera; asienta la salida en el libro contable y descuenta el saldo.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/WithdrawalId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { type: string, maxLength: 120, description: Folio de la transferencia. }
      responses:
        '200':
          description: Retiro pagado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/exchange-rate:
    get:
      operationId: getNightclubsByNightclubIdExchangeRate
      tags: [Empleados]
      summary: Tipo de cambio vigente (USD a MXN)
      description: El historial solo se devuelve al gerente.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Tipo de cambio
          content:
            application/json:
              schema:
                type: object
                properties:
                  base: { type: string, example: USD }
                  quote: { type: string, example: MXN }
                  current:
                    oneOf:
                      - { $ref: '#/components/schemas/ExchangeRate' }
                      - { type: 'null' }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/ExchangeRate' }
    put:
      operationId: putNightclubsByNightclubIdExchangeRate
      tags: [Empleados]
      summary: Fijar el tipo de cambio
      description: Requiere rol `manager`. Cada valor queda en el historial con fecha y autor; nunca se sobreescribe.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate]
              properties:
                rate: { type: number, exclusiveMinimum: 0, maximum: 1000, description: Pesos por dólar. }
                effective_from: { type: string, format: date-time }
                source: { type: string, maxLength: 40, default: manual }
      responses:
        '201':
          description: Registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate: { $ref: '#/components/schemas/ExchangeRate' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/tip-presets:
    get:
      operationId: getNightclubsByNightclubIdTipPresets
      tags: [Propinas y canciones]
      summary: Mínimos y montos sugeridos por rol
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Presets
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/TipPreset' }

  /api/nightclubs/{nightclubId}/tip-presets/{role}:
    put:
      operationId: putNightclubsByNightclubIdTipPresetsByRole
      tags: [Propinas y canciones]
      summary: Editar los montos o el permiso de tragos de un rol
      description: Requiere rol `manager`. Los sugeridos no pueden ser menores que el mínimo.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: role
          in: path
          required: true
          schema: { $ref: '#/components/schemas/EmployeeRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                display_name: { type: string, maxLength: 40 }
                icon: { type: string, maxLength: 16 }
                color: { type: string, maxLength: 9 }
                currency: { $ref: '#/components/schemas/Currency' }
                min_tip: { type: number, minimum: 0 }
                suggested:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: number, exclusiveMinimum: 0 }
                accepts_drinks: { type: boolean }
                sort_order: { type: integer }
      responses:
        '200':
          description: Preset actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset: { $ref: '#/components/schemas/TipPreset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/staff/shifts/start:
    post:
      operationId: postNightclubsByNightclubIdStaffShiftsStart
      tags: [Propinas y canciones]
      summary: Abrir mi turno
      description: Solo personal. Si ya hay uno abierto, lo devuelve con `already_open`.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                section: { type: string, maxLength: 40 }
      responses:
        '201':
          description: Turno abierto
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
        '200':
          description: Ya había un turno abierto
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
                  already_open: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/staff/shifts/end:
    post:
      operationId: postNightclubsByNightclubIdStaffShiftsEnd
      tags: [Propinas y canciones]
      summary: Cerrar mi turno
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Turno cerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/staff/{userId}/shifts/end:
    post:
      operationId: postNightclubsByNightclubIdStaffByUserIdShiftsEnd
      tags: [Propinas y canciones]
      summary: Cerrar el turno olvidado de alguien
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Turno cerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/staff/shifts:
    get:
      operationId: getNightclubsByNightclubIdStaffShifts
      tags: [Propinas y canciones]
      summary: Turnos abiertos (o todos)
      description: Requiere rol `manager` o `hostess`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: open
          in: query
          schema: { type: boolean, default: true }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Turnos
          content:
            application/json:
              schema:
                type: object
                properties:
                  shifts:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Shift' }
                        - type: object
                          properties:
                            user_id: { type: string, format: uuid }
                            display_name: { type: string }
                            role: { $ref: '#/components/schemas/EmployeeRole' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/staff/on-shift:
    get:
      operationId: getNightclubsByNightclubIdStaffOnShift
      tags: [Propinas y canciones]
      summary: Personal en turno, con montos sugeridos
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/EmployeeRole' }
      responses:
        '200':
          description: Personal
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items: { $ref: '#/components/schemas/StaffOnShift' }

  /api/nightclubs/{nightclubId}/tips:
    post:
      operationId: postNightclubsByNightclubIdTips
      tags: [Propinas y canciones]
      summary: Dar una propina
      description: |
        Idempotente por `client_request_id`. Fila en `tips` y asiento en `transactions` en
        la misma transacción. Respeta el mínimo del rol. Nace `pending`.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, to_user_id, amount]
              properties:
                client_request_id: { type: string, format: uuid }
                to_user_id: { type: string, format: uuid }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { $ref: '#/components/schemas/Currency' }
                message: { type: string, maxLength: 280 }
                anonymous: { type: boolean, default: false, description: El empleado no ve quién fue; el gerente sí. }
      responses:
        '201':
          description: Propina registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  tip: { $ref: '#/components/schemas/Tip' }
                  payment:
                    type: object
                    properties:
                      status: { type: string, example: pending }
                      note: { type: string }
        '200':
          description: Reenvío idempotente
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  tip: { $ref: '#/components/schemas/Tip' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: getNightclubsByNightclubIdTips
      tags: [Propinas y canciones]
      summary: Todas las propinas del club
      description: Requiere rol `manager`. Ve quién dio cada una aunque sea anónima.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, cancelled] }
        - name: to_user_id
          in: query
