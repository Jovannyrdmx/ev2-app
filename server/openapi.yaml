  /api/nightclubs/{nightclubId}/drinks:
    get:
      operationId: getNightclubsByNightclubIdDrinks
      tags: [Bebidas]
      summary: Menú del club
      description: |
        `stock` no es un contador del producto: es cuántas unidades ALCANZAN con lo que
        hay en una barra, el mínimo entre los ingredientes de su receta. `null` significa
        que ese producto no lleva control de existencia (no tiene receta capturada), que
        es distinto de 0.

        Los números son SIEMPRE de una barra, y `bar_location_id` dice de cuál: la de la
        mesa donde está sentado quien pregunta, la que pida `bar_id`, o la primera del
        club. Sin eso, "quedan 3" no dice tres dónde, y el mesero promete un trago que
        la otra barra no tiene.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: category
          in: query
          schema: { type: string, example: cocktail }
        - name: available_only
          in: query
          description: Solo lo que está disponible y con existencias
          schema: { type: boolean, default: false }
        - name: search
          in: query
          schema: { type: string }
        - name: bar_id
          in: query
          description: La barra contra la que se calculan las existencias.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bebidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  drinks:
                    type: array
                    items: { $ref: '#/components/schemas/Drink' }
                  bar_location_id:
                    type: [string, 'null']
                    format: uuid
                    description: La barra a la que se refieren las existencias.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postNightclubsByNightclubIdDrinks
      tags: [Bebidas]
      summary: Alta de bebida
      description: Requiere rol `manager`. En operación normal el catálogo llega del POS (fase 4).
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrinkCreate' }
      responses:
        '201':
          description: Bebida creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  drink: { $ref: '#/components/schemas/Drink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/drinks/categories:
    get:
      operationId: getNightclubsByNightclubIdDrinksCategories
      tags: [Bebidas]
      summary: Categorías con su conteo
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
