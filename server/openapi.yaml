  /api/nightclubs/{nightclubId}/reservations:
    post:
      operationId: postNightclubsByNightclubIdReservations
      tags: [Reservaciones]
      summary: Reservar una mesa
      description: |
        Se reserva la mesa para **toda la noche** de un evento, no para un horario.
        Idempotente por `client_request_id`. El total y el depósito los calcula el
        servidor y quedan congelados (`zone_base_at_booking`, `ticket_at_booking`), de
        modo que un cambio de precio posterior nunca altera lo ya pactado.

        La reservación nace en `pending_payment` y genera una transacción de depósito en
        estado `pending`; el cobro real se conecta en la fase 3. Una misma mesa no puede
        tener dos reservaciones vivas en el mismo evento: lo impide un índice único en la
        base de datos, incluso ante peticiones simultáneas.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
      responses:
        '201':
          description: Reservación creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
                  payment:
                    type: object
                    properties:
                      status: { type: string, example: pending }
                      deposit: { type: number }
                      currency: { type: string }
                      note: { type: string }
        '200':
          description: Reenvío idempotente
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
        '409':
          description: La mesa ya está reservada para ese evento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: getNightclubsByNightclubIdReservations
      tags: [Reservaciones]
      summary: Agenda del club
      description: Requiere rol `hostess`, `waiter` o `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: date
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, confirmed, seated, completed, cancelled, no_show]
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Reservaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items: { $ref: '#/components/schemas/Reservation' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reservations/mine:
