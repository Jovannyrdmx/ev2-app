    post:
      operationId: postMePaymentMethods
      tags: [Pagos]
      summary: Guardar un método de pago
      description: |
        Solo se almacena el **token** que devuelve el proveedor (Stripe o Mercado Pago),
        más los últimos cuatro dígitos y la marca para poder mostrarlo. El número de
        tarjeta nunca pasa por esta API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodCreate' }
      responses:
        '201':
          description: Método guardado
          content:
            application/json:
              schema:
                type: object
