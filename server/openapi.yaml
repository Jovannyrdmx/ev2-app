  /api/nightclubs/{nightclubId}/staff/{userId}/drinks:
    post:
      operationId: postNightclubsByNightclubIdStaffByUserIdDrinks
      tags: [Propinas y canciones]
      summary: Invitar un trago a alguien del personal
      description: |
        Solo a roles con `accepts_drinks` y en turno; quien invita debe estar sentado. Es un
        **pedido real cobrado al enviarlo**; el personal lo acepta o lo rechaza, y si lo
        rechaza vuelve a la mesa del cliente sin reembolso. Idempotente.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, drink_id]
              properties:
                client_request_id: { type: string, format: uuid }
                drink_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 5, default: 1 }
                message: { type: string, maxLength: 140 }
      responses:
        '201':
          description: Trago enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff_drink: { $ref: '#/components/schemas/StaffDrink' }
        '200':
          description: Reenvío idempotente
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff_drink: { $ref: '#/components/schemas/StaffDrink' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/staff/me/drinks:
