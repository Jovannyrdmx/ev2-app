        notes: { type: string, maxLength: 200 }
        event_id: { type: string, format: uuid }
        labels:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 60 }
          description: |
            Los nombres de los invitados extra, en el orden en que se emiten sus
            pases. Opcional: en la puerta a veces no hay tiempo de teclear nada.

