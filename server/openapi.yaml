        cancel_reason: { type: [string, 'null'] }
        table_id: { type: string, format: uuid }
        table_code: { type: string }
        section: { type: string }
        table_type: { type: string }
        user_id: { type: string, format: uuid }
        user_name: { type: string }
        addons:
