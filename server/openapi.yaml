          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Table' }
              - type: object
                properties:
                  zone: { $ref: '#/components/schemas/ZoneQuote' }
                  price: { type: number, description: Total de la noche para ese grupo. }
                  extra_guests: { type: integer }
                  extras_total: { type: number, description: Personas extra x boleto del evento. }
                  deposit: { type: number }
                  currency: { $ref: '#/components/schemas/Currency' }

    Quote:
      type: object
      properties:
        table:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            table_number: { type: [integer, 'null'] }
            section: { type: string }
            floor: { type: string }
            capacity: { type: integer }
        zone: { $ref: '#/components/schemas/ZoneQuote' }
        event: { $ref: '#/components/schemas/EventSummary' }
        guests: { type: integer }
        extra_guests: { type: integer }
        ticket_price: { type: number }
        extras_total: { type: number }
        addons:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              name: { type: string }
              price: { type: number }
              quantity: { type: integer }
        addons_total: { type: number }
        subtotal:
          type: number
          description: Base de zona + extras + productos, antes del descuento.
        discount:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            type: { type: string, enum: [percentage, fixed_amount] }
            value: { type: number }
            amount: { type: number }
        total: { type: number }
        deposit: { type: number }
        deposit_pct: { type: number }
        arrival_deadline:
          type: string
          format: date-time
          description: Hora límite para llegar; pasada esa hora la mesa se libera sin reembolso.
        currency: { $ref: '#/components/schemas/Currency' }

    ReservationCreate:
      type: object
      required: [client_request_id, event_id, table_id, guest_count]
      properties:
        client_request_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid, description: La noche que se reserva. }
        table_id: { type: string, format: uuid }
        guest_count: { type: integer, minimum: 1, maximum: 50 }
