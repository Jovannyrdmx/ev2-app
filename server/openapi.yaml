      responses:
        '200':
          description: Tarifa retirada
          content:
            application/json:
              schema:
                type: object
                properties:
                  fare: { $ref: '#/components/schemas/TaxiFare' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/drivers:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listDrivers
      tags: [Taxi y salida segura]
      summary: Conductores registrados (gerente)
      parameters:
        - name: availability
          in: query
          schema: { type: string, enum: [off, available, on_trip] }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Conductores
          content:
            application/json:
              schema:
                type: object
                properties:
                  drivers:
                    type: array
                    items: { $ref: '#/components/schemas/Driver' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createDriver
      tags: [Taxi y salida segura]
      summary: Registrar un conductor de confianza (gerente)
      description: |
        Crea una cuenta real con rol `driver`. La contraseña temporal viaja **una sola vez**
        en esta respuesta y nunca se guarda en claro; hasta cambiarla, la cuenta solo puede
        usar `POST /api/auth/password`. `trusted` es el aval del gerente tras ver licencia y
        papeles: un conductor sin aval puede entrar pero nunca se despacha.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverCreate' }
      responses:
        '201':
          description: Conductor registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/Driver' }
                  temporary_password: { type: string, minLength: 12, maxLength: 12 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/drivers/{driverId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/DriverId'
    get:
      operationId: getDriver
      tags: [Taxi y salida segura]
      summary: Ficha de un conductor (gerente)
      responses:
        '200':
          description: Conductor
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/Driver' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateDriver
      tags: [Taxi y salida segura]
      summary: Editar, verificar o dar de baja a un conductor (gerente)
      description: |
        `active: false` bloquea la cuenta y cierra sus sesiones. Quitar `trusted` o dar de
        baja también apaga su disponibilidad. Si tiene un viaje vivo responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverUpdate' }
      responses:
        '200':
          description: Conductor actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/Driver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

