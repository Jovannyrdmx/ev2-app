  /api/nightclubs/{nightclubId}/sync/events:
    get:
      operationId: getNightclubsByNightclubIdSyncEvents
      tags: [Club]
      summary: Recuperar eventos de dominio perdidos tras una reconexión
      description: |
        Devuelve solo los eventos dirigidos a este usuario (por rol o por id), de las
        últimas 24 horas. El cliente guarda `last_id` y lo envía como `since_id` al
        reconectar. El envío en vivo por WebSocket llega en la fase 3.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: since_id
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/SyncEvent' }
                  last_id:
                    type: string
                    description: |
                      Identificador del último evento entregado. Es una cadena porque en la
                      base de datos es un entero de 64 bits y JavaScript pierde precisión
                      por encima de 2^53. Guárdalo tal cual y devuélvelo en `since_id`.
                    example: '42'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nightclubs/{nightclubId}/dashboard:
    get:
      operationId: getNightclubsByNightclubIdDashboard
      tags: [Club]
      summary: Tablero del gerente
      description: Requiere rol `manager` o `admin`. La jornada se corta a las 06:00.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
