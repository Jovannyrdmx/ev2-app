  /api/nightclubs/{nightclubId}/reservations/{reservationId}/cancel:
    post:
      operationId: postNightclubsByNightclubIdReservationsByReservationIdCancel
      tags: [Reservaciones]
      summary: Cancelar una reservación
      description: |
        La puede cancelar su titular o el personal (`hostess`, `manager`). El porcentaje
        de reembolso sale de las ventanas configuradas en las reglas del club, y solo se
        reembolsa lo que efectivamente se haya cobrado.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/ReservationId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                  refund_pct: { type: number, example: 100 }
                  refund_amount: { type: number, example: 891 }
                  paid_amount: { type: number }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La reservación ya no se puede cancelar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ---------------------------------------------------------------- la puerta
  /api/nightclubs/{nightclubId}/door/pass/{code}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - name: code
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: peekDoorPass
      tags: [Puerta]
      summary: Mirar un pase sin gastarlo (hostess)
      description: |
        Comprueba un pase sin dejar entrar. Sirve para contestar «¿a qué hora es mi
        reservación?» o revisar uno dudoso. **No** cambia nada.
      responses:
        '200':
          description: El pase, o `null` si no existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { $ref: '#/components/schemas/DoorPass' }
                  result: { type: string }
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/door/check-in:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    post:
      operationId: doorCheckIn
      tags: [Puerta]
      summary: Escanear un pase individual y dejar entrar a UNA persona (hostess)
      description: |
        El escaneo de la entrada. Entra **una persona por pase**, y el pase se gasta.
        La mesa se sienta con el PRIMER pase que entra —no con el del titular— y
        sentar significa meter a la persona en la mesa, que es lo que la habilita
        para pedir desde su teléfono.

        **Exige `id_check_id`**: la revisión de identificación va ANTES del escaneo y
        se gasta con él. Sin una revisión aceptada, fresca (5 minutos) y del mismo
        guardia, no abre. Eso es deliberado: así un menor de edad o una
        identificación inválida NO queman el pase, y el titular lo puede reasignar a
        alguien más esa misma noche.

        Un pase que no abre responde **200 con el motivo**, no un error: la puerta
        necesita leer «ese pase ya se usó» o «es de mañana» para resolverlo hablando.
        Los motivos son `not_found`, `forged`, `used`, `revoked`, `expired`,
        `no_id_check`, `not_tonight`, `cancelled` y `unpaid`.

        `code` acepta el payload firmado del QR (`EV2P.<código>.<firma>`), el enlace
        de WhatsApp, o el código tecleado con o sin guiones y en minúsculas. Si viene
        firmado y la firma no cuadra, se rechaza como `forged` **sin tocar la base**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, id_check_id]
              properties:
                code: { type: string, minLength: 4, maxLength: 200 }
                id_check_id:
                  type: string
                  format: uuid
                  description: La revisión de identificación de esta persona, sin gastar.
      responses:
        '200':
          description: |
            Resultado del escaneo. `admitted` y `seated` solo vienen cuando sí abrió.
            `id_check` viene cuando lo que falló fue la revisión, con su motivo
            (`id_rejected`, `id_check_used`, `id_check_stale`, `id_check_other_staff`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { $ref: '#/components/schemas/GuestPassScan' }
                  admitted: { type: boolean }
                  seated: { type: boolean }
                  result: { type: string }
                  ok: { type: boolean }
                  id_check:
                    type: object
                    properties:
                      ok: { type: boolean }
                      reason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/door/id-checks:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    post:
      operationId: createDoorIdCheck
      tags: [Puerta]
      summary: Registrar la revisión de identificación, ANTES de escanear (hostess)
      description: |
        Este es el orden que el backend obliga: seguridad pide la identificación, la
        mira, la registra aquí, y solo entonces escanea el QR. La revisión vale 5
        minutos, sirve para **una** persona y se gasta con el escaneo.

        Lo que NO se guarda, a propósito: el número de la identificación, la fecha de
        nacimiento y cualquier foto. Se guarda qué documento se enseñó, si era mayor
        de edad, si se aceptó, por qué no, y quién lo revisó. Eso alcanza para
        responder «¿quién dejó entrar a esta persona?» sin convertir la puerta en un
        archivo de datos personales que hay que custodiar.

        Una revisión **aceptada de un menor de edad no existe**: se responde 400.
        Un rechazo **exige motivo**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document, adult, decision]
              properties:
                document:
                  type: string
                  enum: [ine, passport, license, other, none]
                adult:
                  type: boolean
                  description: Lo único que se guarda de la edad.
                decision:
                  type: string
                  enum: [accepted, rejected]
                reason: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Revisión registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_check: { $ref: '#/components/schemas/DoorIdCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/door/lookup:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: doorLookup
      tags: [Puerta]
      summary: Buscar a quien llega sin su QR (hostess)
      description: |
        Por folio, nombre o teléfono. Se contesta con lo mínimo para reconocer a la
        persona: el nombre del titular, la mesa, la hora y cómo van sus pases.

        El teléfono se busca por sus últimos dígitos y **no se devuelve**: la puerta
        pregunta «¿tu teléfono termina en 4821?» y compara. Devolverlo convertiría
        esta ruta en un directorio de los clientes del club.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 60 }
      responses:
        '200':
          description: Reservaciones que coinciden
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items: { $ref: '#/components/schemas/DoorLookupRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/door/passes/contingency:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    post:
      operationId: issueContingencyPass
      tags: [Puerta]
      summary: Emitir un pase temporal para quien llegó sin su QR (hostess)
      description: |
        Existe porque la alternativa real es peor: sin esto, el invitado que llega
        sin su código entra porque el de la puerta lo deja pasar de palabra, y de eso
        no queda registro de ninguna clase. Con esto queda quién lo emitió, por qué,
        a nombre de quién, y que vence a los 45 minutos aunque no se use.

        Es de **un solo uso**, **exige motivo**, y no le quita su pase a nadie. La
        reservación tiene que estar confirmada: una sin pagar no genera entradas ni
        por la puerta de atrás.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservation_id, reason]
              properties:
                reservation_id: { type: string, format: uuid }
                label: { type: string, maxLength: 60 }
                reason: { type: string, minLength: 5, maxLength: 200 }
      responses:
        '201':
          description: Pase emitido, con su payload firmado para dibujar el QR
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { $ref: '#/components/schemas/GuestPassIssued' }
                  valid_minutes: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/guest-passes/{payload}:
    get:
      operationId: getGuestPassPublic
      tags: [Pases]
      summary: El pase que abre el invitado desde el enlace de WhatsApp (SIN sesión)
      description: |
        **No lleva autenticación, y eso es la decisión, no un descuido**: el invitado
        no tiene cuenta en el club y no la va a crear en la fila. El enlace ES la
        credencial, igual que un boleto de avión: quien lo tiene, entra.

        Por eso: exige la firma (sin firma válida no se toca la base), enseña lo
        mínimo para poder entrar —el QR, la mesa, la hora, el nombre del club— y
        **nada de la persona**; y cada apertura queda registrada, así que un pase
        compartido de más se ve en el conteo y el titular lo puede revocar.

        Tiene su propio límite de peticiones, más estricto que el general.
      parameters:
        - name: payload
          in: path
          required: true
          description: El payload firmado, `EV2P.<código>.<firma>`.
          schema: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: El pase, con su QR dibujado
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { $ref: '#/components/schemas/GuestPassPublic' }
        '404':
          description: |
            No existe, o la firma no cuadra. Es el mismo 404 a propósito: decirle a
            quien prueba enlaces cuál de las dos cosas es sería ayudarlo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/passes:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/ReservationId'
    get:
      operationId: listGuestPasses
      tags: [Pases]
      summary: 'Los pases de una reservación: uno por persona'
      description: |
        Los ve el titular de la mesa y el personal de la puerta. A nadie más, y a
        nadie más se le dice que la reservación existe: se responde **404, no 403**,
        porque un 403 ya confirma que existe.

        La lista **no trae el payload firmado**: ver la lista no es repartirla. El
        payload es la credencial, y mandarlo en cada renglón lo dejaría en la caché
        del navegador, en el historial y en cualquier registro que guarde respuestas.
      responses:
        '200':
          description: Los pases y su resumen
          content:
            application/json:
              schema:
                type: object
                properties:
                  passes:
                    type: array
                    items: { $ref: '#/components/schemas/GuestPass' }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      active: { type: integer }
                      used: { type: integer }
                      revoked: { type: integer }
                      shared: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/passes/{passId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/GuestPassId'
    get:
      operationId: getGuestPass
      tags: [Pases]
      summary: Un pase con su QR dibujado
      description: |
        Aquí sí va el payload firmado y el QR en SVG: es para enseñarlo. El QR lo
        dibuja el servidor y no el navegador a propósito — un QR mal generado no
        falla, se ve bien y no lee, y eso se descubre con la fila enfrente.
      responses:
        '200':
          description: El pase, con `qr_svg` y `payload`
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { $ref: '#/components/schemas/GuestPassWithQr' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateGuestPass
      tags: [Pases]
      summary: Ponerle nombre al invitado
      description: |
        El apodo con el que la puerta lo va a reconocer: «Ana», «mi primo». A
        propósito no hay teléfono, correo ni fecha de nacimiento — el sistema no
        necesita saber quién es el invitado para dejarlo entrar, necesita que su pase
        sea válido y que su identificación diga que es mayor de edad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: [string, 'null'], maxLength: 60 }
      responses:
        '200':
          description: El pase actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { $ref: '#/components/schemas/GuestPass' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/passes/{passId}/share:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/GuestPassId'
    post:
      operationId: shareGuestPass
      tags: [Pases]
      summary: El mensaje y el enlace para mandarlo por WhatsApp
      description: |
        **No manda nada desde el servidor**: devuelve el texto y el enlace `wa.me`, y
        el teléfono del titular abre su propia app. Mandarlo desde aquí necesitaría
        la API de WhatsApp Business, una cuenta verificada, plantillas aprobadas y un
        costo por mensaje — y sobre todo, el mensaje le llegaría al invitado de un
        número desconocido en vez del teléfono de su amigo, que es el número del que
        hace caso.

        El enlace lo arma el servidor con su propio dominio configurado, **nunca con
        la cabecera `Host` de quien pide**: un enlace armado con lo que manda el
        cliente es un enlace a donde ese cliente quiera, saliendo con la cara del
        club.

        Un pase gastado o revocado no se comparte: mandarlo sería que alguien se
        presente con un QR muerto y una explicación que dar.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lang: { type: string, enum: [es, en], default: es }
                label: { type: string, maxLength: 60 }
      responses:
        '200':
          description: El mensaje listo para mandar
          content:
            application/json:
              schema:
                type: object
                properties:
                  share: { $ref: '#/components/schemas/GuestPassShare' }
                  pass: { $ref: '#/components/schemas/GuestPass' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/passes/{passId}/revoke:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/GuestPassId'
    post:
      operationId: revokeGuestPass
      tags: [Pases]
      summary: 'Matar un pase: el invitado ya no va, o el QR se filtró'
      description: |
        Revocar **no borra**. El pase queda muerto, con motivo y con hora, y eso es
        lo único que permite contestar «este QR ya no servía porque el titular lo
        canceló a las 10:15» en vez de «no sé».

        El motivo es **obligatorio**: un pase muerto sin motivo es una discusión en
        la puerta que nadie puede resolver.

        Un pase **ya usado NO se revoca**: esa persona está adentro, y marcar su pase
        como revocado sería escribir que no entró.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: El pase revocado
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { $ref: '#/components/schemas/GuestPass' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/passes/{passId}/reassign:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/GuestPassId'
    post:
      operationId: reassignGuestPass
      tags: [Pases]
      summary: Va otra persona en lugar de la que no vino
      description: |
        Revocar y emitir en un solo acto, y tiene que ser un solo acto: si fueran dos
        llamadas, una reservación podría quedarse con el pase muerto y sin el nuevo
        —justo cuando el invitado de repuesto ya está en camino— porque el teléfono
        del titular perdió la señal entre una y otra.

        El pase nuevo lleva un **código nuevo**, no el mismo: el QR viejo ya salió del
        teléfono del titular y puede estar en la conversación de alguien que ya no
        viene. Y apunta al viejo con `replaces_id`, que es lo que permite seguir una
        cadena de reasignaciones hasta el original.

        El total de pases vivos no cambia: reasignar no regala entradas.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 60 }
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '201':
          description: El viejo revocado, el nuevo emitido, y el mensaje para mandarlo
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { $ref: '#/components/schemas/GuestPass' }
                  pass: { $ref: '#/components/schemas/GuestPassWithQr' }
                  share: { $ref: '#/components/schemas/GuestPassShare' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/passes/{passId}/history:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/GuestPassId'
    get:
      operationId: getGuestPassHistory
      tags: [Pases]
      summary: La historia de un pase
      description: |
        La respuesta a «¿quién entró con esto y a qué hora?». La tabla de atrás es
        **insert-only** con un disparador que lo impide: un registro de accesos que se
        puede editar no es un registro.

        Se enseña el nombre de quien actuó, nunca su correo: esto lo ve el titular de
        la mesa.
      responses:
        '200':
          description: Hasta 100 renglones, del más reciente al más viejo
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/GuestPassEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/door/admissions:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    post:
      operationId: sellDoorAdmission
      tags: [Puerta]
      summary: Vender un acceso general o un extra VIP (hostess)
      description: |
        Registra lo que se cobra en la entrada y lo asienta en `transactions`, que es
        el único libro del club. Un `vip_extra` **exige** `reservation_id`: es lo que
        permite responder «reservó 8, entraron 10, pagó 2 extras». Una cortesía se
        registra como acceso pero no genera renglón de cobro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoorAdmissionCreate' }
      responses:
        '201':
          description: Acceso registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  admission: { $ref: '#/components/schemas/DoorAdmission' }
                  passes:
                    type: array
                    description: |
                      Un pase por cada extra pagado, con su payload firmado para
                      dibujar el QR en el acto. Un cover `general` NO lleva pase: esa
                      persona no tiene mesa, entra y se para donde quiera, y emitirle
                      un QR que nadie va a volver a escanear sería papeleo que finge
                      control.
                    items: { $ref: '#/components/schemas/GuestPassIssued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/door/summary:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: doorSummary
      tags: [Puerta]
      summary: El aforo de la noche (hostess)
      description: |
        Lo reservado y lo vendido en la puerta se cuentan por separado a propósito:
        una noche puede ir floja de mesas y llena de general, y un solo número
        escondería eso. `inside` es la suma.
      responses:
        '200':
          description: Aforo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoorSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reservations/{reservationId}/status:
    post:
      operationId: postNightclubsByNightclubIdReservationsByReservationIdStatus
      tags: [Reservaciones]
      summary: Avanzar el estado de una reservación
      description: |
        Requiere rol `hostess` o `manager`. Transiciones:
        `pending_payment` → `confirmed`; `confirmed` → `seated` | `no_show`;
        `seated` → `completed`. Cambiar el estado también ocupa o libera la mesa.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/ReservationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, seated, completed, no_show]
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/me/preferences:
    get:
      operationId: getMePreferences
      tags: [Flirt]
      summary: Mis preferencias
      responses:
        '200':
          description: Preferencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putMePreferences
      tags: [Flirt]
      summary: Activar o apagar recibir flirts y aparecer en la lista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                accept_flirts: { type: boolean }
                discoverable: { type: boolean }
                show_on_map: { type: boolean }
                notifications:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        '200':
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/me/blocks:
    get:
      operationId: getMeBlocks
      tags: [Flirt]
      summary: Personas que bloqueé
      responses:
        '200':
          description: Bloqueos
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        display_name: { type: string }
                        created_at: { type: string, format: date-time }

  /api/me/blocks/{userId}:
    post:
      operationId: postMeBlocksByUserId
      tags: [Flirt]
      summary: Bloquear a una persona
      description: |
        Ambos desaparecen de la lista del otro y cualquier envío falla con un 404 neutro.
        Los flirts pendientes de esa persona se cierran; un trago ya pedido sigue su curso.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '201':
          description: Bloqueado
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked: { type: boolean }
                  user_id: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteMeBlocksByUserId
      tags: [Flirt]
      summary: Quitar un bloqueo
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: Desbloqueado }

  /api/nightclubs/{nightclubId}/flirts/catalogue:
    get:
      operationId: getNightclubsByNightclubIdFlirtsCatalogue
      tags: [Flirt]
      summary: Emojis permitidos, reacciones y límites
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  emojis:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [wave, wink, kiss, fire, heart, dance, star] }
                        icon: { type: string }
                        label_es: { type: string }
                  reactions:
                    type: array
                    items: { $ref: '#/components/schemas/FlirtReaction' }
                  limits:
                    type: object
                    properties:
                      per_hour: { type: integer, example: 20 }
                      unanswered_per_night: { type: integer, example: 3 }
                      message_max: { type: integer, example: 140 }

  /api/nightclubs/{nightclubId}/flirts/people:
    get:
      operationId: getNightclubsByNightclubIdFlirtsPeople
      tags: [Flirt]
      summary: Personas disponibles esta noche
      description: |
        Clientes sentados ahora mismo que eligieron aparecer, sin bloqueos en ningún
        sentido y sin reportes abiertos. Solo sale nombre visible, mesa y zona. Hay que
        estar sentado para consultarla.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: section
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Personas
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '422':
          description: Quien consulta no está sentado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/flirts:
    post:
      operationId: postNightclubsByNightclubIdFlirts
      tags: [Flirt]
      summary: Enviar un flirt
      description: |
        Idempotente por `client_request_id`. Solo clientes. `emoji` exige una clave del
        catálogo; `meet` invita a la mesa del emisor; `drink` y `bottle` exigen `drink_id`
        y crean un **pedido real** para la mesa del receptor, cobrado al emisor.

        Errores: 403 sin opt-in o silenciado; 404 neutro si hay bloqueo o reportes; 422 si
        alguno no está sentado; 429 por límite de hora o de flirts sin respuesta; 409 si
        no hay existencias del trago.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlirtCreate' }
      responses:
        '201':
          description: Flirt enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '200':
          description: Reenvío idempotente
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/nightclubs/{nightclubId}/flirts/received:
    get:
      operationId: getNightclubsByNightclubIdFlirtsReceived
      tags: [Flirt]
      summary: Flirts recibidos esta noche
      description: Vacío si la persona apagó `accept_flirts`. Los caducados no aparecen.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Bandeja
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirts:
                    type: array
                    items: { $ref: '#/components/schemas/Flirt' }
                  accept_flirts: { type: boolean }

  /api/nightclubs/{nightclubId}/flirts/sent:
    get:
      operationId: getNightclubsByNightclubIdFlirtsSent
      tags: [Flirt]
      summary: Flirts que envié esta noche
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirts:
                    type: array
                    items: { $ref: '#/components/schemas/Flirt' }

  /api/nightclubs/{nightclubId}/flirts/stats:
    get:
      operationId: getNightclubsByNightclubIdFlirtsStats
      tags: [Flirt]
      summary: Conteos de la noche para el gerente
      description: Requiere rol `manager`. Solo números; nunca nombres ni mensajes.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlirtStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/flirts/{flirtId}/view:
    post:
      operationId: postNightclubsByNightclubIdFlirtsByFlirtIdView
      tags: [Flirt]
      summary: Marcar un flirt como visto
      description: Solo el receptor. Un tercero recibe 404.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/FlirtId' }
      responses:
        '200':
          description: Flirt
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El flirt ya caducó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/flirts/{flirtId}/react:
    post:
      operationId: postNightclubsByNightclubIdFlirtsByFlirtIdReact
      tags: [Flirt]
      summary: Responder a un flirt
      description: |
        Solo el receptor. `not_interested` rechaza el flirt, silencia a ese emisor por el
        resto de la noche y, si era un trago o botella, **devuelve el pedido a la mesa del
        emisor** (sin cancelar ni reembolsar). Cualquier otra reacción lo acepta.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/FlirtId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction: { $ref: '#/components/schemas/FlirtReaction' }
      responses:
        '200':
          description: Flirt con la reacción
          content:
            application/json:
              schema:
                type: object
                properties:
                  flirt: { $ref: '#/components/schemas/Flirt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/users/{userId}/report:
    post:
      operationId: postNightclubsByNightclubIdUsersByUserIdReport
      tags: [Flirt]
      summary: Reportar a una persona
      description: |
        Un reporte abierto por persona reportada. Con dos reportes abiertos la persona
        deja de aparecer en la lista y de recibir flirts hasta que el gerente revise.
        `flirt_id` solo puede ser un flirt que el reportante recibió de esa persona.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/ReportReason' }
                details: { type: string, maxLength: 500 }
                flirt_id: { type: string, format: uuid }
      responses:
        '201':
          description: Reporte creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      reason: { $ref: '#/components/schemas/ReportReason' }
                      status: { type: string, example: open }
                      created_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya hay un reporte abierto sobre esa persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/reports:
    get:
      operationId: getNightclubsByNightclubIdReports
      tags: [Flirt]
      summary: Reportes para revisar
      description: Requiere rol `manager`. Trae quién, a quién, motivo y detalle; nunca el mensaje del flirt.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [open, reviewed, actioned, dismissed] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Reportes, los abiertos primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/reports/{reportId}:
    patch:
      operationId: patchNightclubsByNightclubIdReportsByReportId
      tags: [Flirt]
      summary: Resolver un reporte
      description: |
        Requiere rol `manager`. `actioned` **bloquea la cuenta** de la persona reportada,
        cierra sus sesiones y la saca de su mesa. `dismissed` la vuelve a mostrar.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [reviewed, actioned, dismissed] }
                resolution_note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Reporte actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/password:
    post:
      operationId: postAuthPassword
      tags: [Autenticación]
      summary: Cambiar contraseña
      description: |
        Exige la contraseña actual y una nueva distinta; cierra las demás sesiones y
        devuelve tokens nuevos. Obligatorio tras recibir una contraseña temporal del
        gerente: mientras `must_change_password` esté activo, cualquier otra ruta responde
        403 con código `password_change_required`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: string }
                  refresh_token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/employees/me:
    get:
      operationId: getEmployeesMe
      tags: [Empleados]
      summary: Mi perfil de empleado
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putEmployeesMe
      tags: [Empleados]
      summary: Editar mi perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                stage_name: { type: [string, 'null'], maxLength: 80 }
                avatar_url: { type: [string, 'null'], format: uri }
                phone: { type: [string, 'null'], maxLength: 30 }
                preferred_currency: { $ref: '#/components/schemas/Currency' }
                preferred_payout_currency: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/employees/me/bank-accounts:
    get:
      operationId: getEmployeesMeBankAccounts
      tags: [Empleados]
      summary: Mis cuentas bancarias (enmascaradas)
      responses:
        '200':
          description: Cuentas
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_accounts:
                    type: array
                    items: { $ref: '#/components/schemas/BankAccount' }
    post:
      operationId: postEmployeesMeBankAccounts
      tags: [Empleados]
      summary: Registrar una cuenta bancaria
      description: |
        `clabe` exige 18 dígitos con dígito verificador válido; `us_checking` y
        `us_savings` exigen `routing_number` (9 dígitos, checksum ABA) y cuenta de 4 a 17
        dígitos. El número se cifra y **nunca vuelve a salir del servidor**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountCreate' }
      responses:
        '201':
          description: Cuenta guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account: { $ref: '#/components/schemas/BankAccount' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/employees/me/bank-accounts/{accountId}:
    delete:
      operationId: deleteEmployeesMeBankAccountsByAccountId
      tags: [Empleados]
      summary: Quitar una cuenta
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '204': { description: Cuenta retirada (se conserva para retiros ya pagados) }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/employees/me/earnings:
    get:
      operationId: getEmployeesMeEarnings
      tags: [Empleados]
      summary: Mi saldo y mis ganancias
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
      responses:
        '200':
          description: Saldo por moneda (no depende del filtro) y desglose del periodo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Earnings' }

  /api/employees/me/dashboard:
    get:
      operationId: getEmployeesMeDashboard
      tags: [Empleados]
      summary: Mi tablero
      responses:
        '200':
          description: Saldo, últimos movimientos, retiro en proceso y tipo de cambio
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
                  balances:
                    type: array
                    items: { $ref: '#/components/schemas/Balance' }
                  recent_movements:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string }
                        amount: { $ref: '#/components/schemas/Money' }
                        currency: { $ref: '#/components/schemas/Currency' }
                        created_at: { type: string, format: date-time }
                        metadata: { type: object, additionalProperties: true }
                  open_withdrawal:
                    oneOf:
                      - { $ref: '#/components/schemas/Withdrawal' }
                      - { type: 'null' }
                  exchange_rate:
                    oneOf:
                      - { $ref: '#/components/schemas/ExchangeRate' }
                      - { type: 'null' }
                  generated_at: { type: string, format: date-time }

  /api/employees/me/withdrawals:
    get:
      operationId: getEmployeesMeWithdrawals
      tags: [Empleados]
      summary: Mis retiros
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Retiros
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawals:
                    type: array
                    items: { $ref: '#/components/schemas/Withdrawal' }
    post:
      operationId: postEmployeesMeWithdrawals
      tags: [Empleados]
      summary: Solicitar un retiro
      description: |
        Sin monto mínimo. Exige una cuenta verificada por el gerente, saldo suficiente en
        `currency` y ningún otro retiro en proceso (409). Si `payout_currency` difiere,
        se estima con el tipo de cambio vigente; el definitivo se fija al aprobar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { $ref: '#/components/schemas/Currency' }
                payout_currency: { $ref: '#/components/schemas/Currency' }
                bank_account_id: { type: string, format: uuid, description: Por omisión la predeterminada. }
                note: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Retiro solicitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Sin cuenta verificada, saldo insuficiente o sin tipo de cambio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/employees:
    get:
      operationId: getNightclubsByNightclubIdEmployees
      tags: [Empleados]
      summary: Plantilla del club
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/EmployeeRole' }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Empleados
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postNightclubsByNightclubIdEmployees
      tags: [Empleados]
      summary: Dar de alta a un empleado
      description: |
        Requiere rol `manager`. Devuelve una **contraseña temporal una sola vez**; el
        empleado debe cambiarla al entrar. Nunca se guarda en claro.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
                  temporary_password: { type: string, description: Se muestra solo aquí. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/employees/{userId}:
    get:
      operationId: getNightclubsByNightclubIdEmployeesByUserId
      tags: [Empleados]
      summary: Un empleado
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Empleado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchNightclubsByNightclubIdEmployeesByUserId
      tags: [Empleados]
      summary: Editar, dar de baja o reiniciar contraseña
      description: |
        Requiere rol `manager`. `active: false` bloquea el acceso y cierra sesiones pero
        conserva historial y saldo. `reset_password: true` devuelve una nueva contraseña
        temporal.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/EmployeeRole' }
                stage_name: { type: [string, 'null'], maxLength: 80 }
                employee_code: { type: [string, 'null'], maxLength: 30 }
                hire_date: { type: [string, 'null'], format: date }
                phone: { type: [string, 'null'], maxLength: 30 }
                active: { type: boolean }
                reset_password: { type: boolean }
      responses:
        '200':
          description: Empleado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { $ref: '#/components/schemas/Employee' }
                  temporary_password: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/employees/{userId}/bank-accounts:
    get:
      operationId: getNightclubsByNightclubIdEmployeesByUserIdBankAccounts
      tags: [Empleados]
      summary: Cuentas de un empleado (enmascaradas) para verificarlas
      description: Requiere rol `manager`. El gerente tampoco ve el número completo.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Cuentas
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_accounts:
                    type: array
                    items: { $ref: '#/components/schemas/BankAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/employees/{userId}/bank-accounts/{accountId}/verify:
    post:
      operationId: postNightclubsByNightclubIdEmployeesByUserIdBankAccountsByAccountIdVerify
      tags: [Empleados]
      summary: Verificar (o desverificar) una cuenta
      description: Requiere rol `manager`. Sin cuenta verificada no hay retiro.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/AccountId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verified: { type: boolean, default: true }
      responses:
        '200':
          description: Cuenta
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_account: { $ref: '#/components/schemas/BankAccount' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/employees/{userId}/earnings:
    get:
      operationId: getNightclubsByNightclubIdEmployeesByUserIdEarnings
      tags: [Empleados]
      summary: Saldo y ganancias de un empleado
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
      responses:
        '200':
          description: Ganancias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Earnings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/payroll:
    get:
      operationId: getNightclubsByNightclubIdPayroll
      tags: [Empleados]
      summary: "Nómina: saldo de cada empleado por moneda"
      description: Requiere rol `manager`. Solo empleados con algún movimiento.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Nómina
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Balance' }
                        - type: object
                          properties:
                            user_id: { type: string, format: uuid }
                            display_name: { type: string }
                            role: { $ref: '#/components/schemas/EmployeeRole' }
                            active: { type: boolean }
                  pending_withdrawals: { type: integer }
                  exchange_rate:
                    oneOf:
                      - { $ref: '#/components/schemas/ExchangeRate' }
                      - { type: 'null' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/withdrawals:
    get:
      operationId: getNightclubsByNightclubIdWithdrawals
      tags: [Empleados]
      summary: Retiros por revisar
      description: Requiere rol `manager`. Pendientes primero.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, paid, rejected] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Retiros
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawals:
                    type: array
                    items: { $ref: '#/components/schemas/Withdrawal' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/withdrawals/{withdrawalId}/approve:
    post:
      operationId: postNightclubsByNightclubIdWithdrawalsByWithdrawalIdApprove
      tags: [Empleados]
      summary: Aprobar un retiro
      description: Requiere rol `manager`. Fija el tipo de cambio de ese momento si hay conversión.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/WithdrawalId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Retiro aprobado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/withdrawals/{withdrawalId}/reject:
    post:
      operationId: postNightclubsByNightclubIdWithdrawalsByWithdrawalIdReject
      tags: [Empleados]
      summary: Rechazar un retiro
      description: Requiere rol `manager`. El saldo vuelve a estar disponible (nunca se descontó).
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/WithdrawalId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Retiro rechazado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/withdrawals/{withdrawalId}/paid:
    post:
      operationId: postNightclubsByNightclubIdWithdrawalsByWithdrawalIdPaid
      tags: [Empleados]
      summary: Marcar pagado
      description: |
        Requiere rol `manager` y un retiro `approved`. Se llama cuando la transferencia ya
        se hizo por fuera; asienta la salida en el libro contable y descuenta el saldo.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/WithdrawalId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { type: string, maxLength: 120, description: Folio de la transferencia. }
      responses:
        '200':
          description: Retiro pagado
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawal: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/exchange-rate:
    get:
      operationId: getNightclubsByNightclubIdExchangeRate
      tags: [Empleados]
      summary: Tipo de cambio vigente (USD a MXN)
      description: El historial solo se devuelve al gerente.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Tipo de cambio
          content:
            application/json:
              schema:
                type: object
                properties:
                  base: { type: string, example: USD }
                  quote: { type: string, example: MXN }
                  current:
                    oneOf:
                      - { $ref: '#/components/schemas/ExchangeRate' }
                      - { type: 'null' }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/ExchangeRate' }
    put:
      operationId: putNightclubsByNightclubIdExchangeRate
      tags: [Empleados]
      summary: Fijar el tipo de cambio
      description: Requiere rol `manager`. Cada valor queda en el historial con fecha y autor; nunca se sobreescribe.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate]
              properties:
                rate: { type: number, exclusiveMinimum: 0, maximum: 1000, description: Pesos por dólar. }
                effective_from: { type: string, format: date-time }
                source: { type: string, maxLength: 40, default: manual }
      responses:
        '201':
          description: Registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate: { $ref: '#/components/schemas/ExchangeRate' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/tip-presets:
    get:
      operationId: getNightclubsByNightclubIdTipPresets
      tags: [Propinas y canciones]
      summary: Mínimos y montos sugeridos por rol
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Presets
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/TipPreset' }

  /api/nightclubs/{nightclubId}/tip-presets/{role}:
    put:
      operationId: putNightclubsByNightclubIdTipPresetsByRole
      tags: [Propinas y canciones]
      summary: Editar los montos o el permiso de tragos de un rol
      description: Requiere rol `manager`. Los sugeridos no pueden ser menores que el mínimo.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: role
          in: path
          required: true
          schema: { $ref: '#/components/schemas/EmployeeRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                display_name: { type: string, maxLength: 40 }
                icon: { type: string, maxLength: 16 }
                color: { type: string, maxLength: 9 }
                currency: { $ref: '#/components/schemas/Currency' }
                min_tip: { type: number, minimum: 0 }
                suggested:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: number, exclusiveMinimum: 0 }
                accepts_drinks: { type: boolean }
                sort_order: { type: integer }
      responses:
        '200':
          description: Preset actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset: { $ref: '#/components/schemas/TipPreset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/staff/shifts/start:
    post:
      operationId: postNightclubsByNightclubIdStaffShiftsStart
      tags: [Propinas y canciones]
      summary: Abrir mi turno
      description: Solo personal. Si ya hay uno abierto, lo devuelve con `already_open`.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                section: { type: string, maxLength: 40 }
      responses:
        '201':
          description: Turno abierto
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
        '200':
          description: Ya había un turno abierto
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
                  already_open: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/staff/shifts/end:
    post:
      operationId: postNightclubsByNightclubIdStaffShiftsEnd
      tags: [Propinas y canciones]
      summary: Cerrar mi turno
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Turno cerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/staff/{userId}/shifts/end:
    post:
      operationId: postNightclubsByNightclubIdStaffByUserIdShiftsEnd
      tags: [Propinas y canciones]
      summary: Cerrar el turno olvidado de alguien
      description: Requiere rol `manager`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Turno cerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/staff/shifts:
    get:
      operationId: getNightclubsByNightclubIdStaffShifts
      tags: [Propinas y canciones]
      summary: Turnos abiertos (o todos)
      description: Requiere rol `manager` o `hostess`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: open
          in: query
          schema: { type: boolean, default: true }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Turnos
          content:
            application/json:
              schema:
                type: object
                properties:
                  shifts:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Shift' }
                        - type: object
                          properties:
                            user_id: { type: string, format: uuid }
                            display_name: { type: string }
                            role: { $ref: '#/components/schemas/EmployeeRole' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/staff/on-shift:
    get:
      operationId: getNightclubsByNightclubIdStaffOnShift
      tags: [Propinas y canciones]
      summary: Personal en turno, con montos sugeridos
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/EmployeeRole' }
      responses:
        '200':
          description: Personal
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items: { $ref: '#/components/schemas/StaffOnShift' }

  /api/nightclubs/{nightclubId}/tips:
    post:
      operationId: postNightclubsByNightclubIdTips
      tags: [Propinas y canciones]
      summary: Dar una propina
      description: |
        Idempotente por `client_request_id`. Fila en `tips` y asiento en `transactions` en
        la misma transacción. Respeta el mínimo del rol. Nace `pending`.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, to_user_id, amount]
              properties:
                client_request_id: { type: string, format: uuid }
                to_user_id: { type: string, format: uuid }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { $ref: '#/components/schemas/Currency' }
                message: { type: string, maxLength: 280 }
                anonymous: { type: boolean, default: false, description: El empleado no ve quién fue; el gerente sí. }
      responses:
        '201':
          description: Propina registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  tip: { $ref: '#/components/schemas/Tip' }
                  payment:
                    type: object
                    properties:
                      status: { type: string, example: pending }
                      note: { type: string }
        '200':
          description: Reenvío idempotente
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  tip: { $ref: '#/components/schemas/Tip' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: getNightclubsByNightclubIdTips
      tags: [Propinas y canciones]
      summary: Todas las propinas del club
      description: Requiere rol `manager`. Ve quién dio cada una aunque sea anónima.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, cancelled] }
        - name: to_user_id
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Propinas
          content:
            application/json:
              schema:
                type: object
                properties:
                  tips:
                    type: array
                    items: { $ref: '#/components/schemas/Tip' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/tips/mine:
    get:
      operationId: getNightclubsByNightclubIdTipsMine
      tags: [Propinas y canciones]
      summary: Propinas que di
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Propinas
          content:
            application/json:
              schema:
                type: object
                properties:
                  tips:
                    type: array
                    items: { $ref: '#/components/schemas/Tip' }

  /api/nightclubs/{nightclubId}/staff/me/tips:
    get:
      operationId: getNightclubsByNightclubIdStaffMeTips
      tags: [Propinas y canciones]
      summary: Propinas que recibí
      description: Solo personal. Las anónimas llegan como «Anónimo».
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, cancelled] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Propinas
          content:
            application/json:
              schema:
                type: object
                properties:
                  tips:
                    type: array
                    items: { $ref: '#/components/schemas/Tip' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/tips/{tipId}/confirm:
    post:
      operationId: postNightclubsByNightclubIdTipsByTipIdConfirm
      tags: [Propinas y canciones]
      summary: Confirmar una propina cobrada (efectivo)
      description: Requiere rol `manager`. Marca el asiento `paid`; desde ese momento cuenta en el saldo del empleado.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/TipId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [cash, manual], default: cash }
                reference: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Propina pagada
          content:
            application/json:
              schema:
                type: object
                properties:
                  tip: { $ref: '#/components/schemas/Tip' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/tips/{tipId}/cancel:
    post:
      operationId: postNightclubsByNightclubIdTipsByTipIdCancel
      tags: [Propinas y canciones]
      summary: Cancelar una propina pendiente
      description: Requiere rol `manager` y motivo. Una propina pagada nunca se cancela aquí.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/TipId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Propina cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  tip: { $ref: '#/components/schemas/Tip' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/staff/{userId}/drinks:
    post:
      operationId: postNightclubsByNightclubIdStaffByUserIdDrinks
      tags: [Propinas y canciones]
      summary: Invitar un trago a alguien del personal
      description: |
        Solo a roles con `accepts_drinks` y en turno; quien invita debe estar sentado. Es un
        **pedido real cobrado al enviarlo**; el personal lo acepta o lo rechaza, y si lo
        rechaza vuelve a la mesa del cliente sin reembolso. Idempotente.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, drink_id]
              properties:
                client_request_id: { type: string, format: uuid }
                drink_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 5, default: 1 }
                message: { type: string, maxLength: 140 }
      responses:
        '201':
          description: Trago enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff_drink: { $ref: '#/components/schemas/StaffDrink' }
        '200':
          description: Reenvío idempotente
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff_drink: { $ref: '#/components/schemas/StaffDrink' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/staff/me/drinks:
    get:
      operationId: getNightclubsByNightclubIdStaffMeDrinks
      tags: [Propinas y canciones]
      summary: Tragos que me han invitado
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Tragos
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff_drinks:
                    type: array
                    items: { $ref: '#/components/schemas/StaffDrink' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/staff-drinks/{id}/accept:
    post:
      operationId: postNightclubsByNightclubIdStaffDrinksByIdAccept
      tags: [Propinas y canciones]
      summary: Aceptar el trago
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Aceptado
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff_drink: { $ref: '#/components/schemas/StaffDrink' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/staff-drinks/{id}/decline:
    post:
      operationId: postNightclubsByNightclubIdStaffDrinksByIdDecline
      tags: [Propinas y canciones]
      summary: Rechazar el trago (vuelve a la mesa del cliente)
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Rechazado y devuelto
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff_drink: { $ref: '#/components/schemas/StaffDrink' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/song-requests:
    post:
      operationId: postNightclubsByNightclubIdSongRequests
      tags: [Propinas y canciones]
      summary: Pedir una canción al DJ en turno
      description: |
        Si la misma canción (título y artista, sin importar mayúsculas ni acentos) ya está
        pedida esta noche, **se suma un voto** a esa solicitud en lugar de crear otra
        (`merged: true`, 200). La propina (`tip_amount`) es aparte y va al DJ con su mínimo.
        Idempotente por `client_request_id`. Sin DJ en turno: 422.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, song_title]
              properties:
                client_request_id: { type: string, format: uuid }
                dj_user_id: { type: string, format: uuid, description: Por omisión el DJ en turno. }
                song_title: { type: string, maxLength: 200 }
                artist: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 280 }
                tip_amount: { type: number, minimum: 0, default: 0 }
                currency: { $ref: '#/components/schemas/Currency' }
                anonymous_tip: { type: boolean, default: false }
      responses:
        '201':
          description: Solicitud nueva
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_request: { $ref: '#/components/schemas/SongRequest' }
                  merged: { type: boolean, example: false }
        '200':
          description: Sumada a una solicitud existente, o reenvío idempotente
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_request: { $ref: '#/components/schemas/SongRequest' }
                  merged: { type: [boolean, 'null'] }
        '409':
          description: Ya pediste esa canción esta noche
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: getNightclubsByNightclubIdSongRequests
      tags: [Propinas y canciones]
      summary: Cola de canciones de la noche
      description: Más votadas primero. Un cliente no ve montos de propina ni ids de otras personas.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [requested, played], default: requested }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_requests:
                    type: array
                    items: { $ref: '#/components/schemas/SongRequest' }

  /api/nightclubs/{nightclubId}/song-requests/mine:
    get:
      operationId: getNightclubsByNightclubIdSongRequestsMine
      tags: [Propinas y canciones]
      summary: Canciones que pedí o voté
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_requests:
                    type: array
                    items: { $ref: '#/components/schemas/SongRequest' }

  /api/nightclubs/{nightclubId}/dj/song-requests:
    get:
      operationId: getNightclubsByNightclubIdDjSongRequests
      tags: [Propinas y canciones]
      summary: Cola del DJ
      description: Rol `dj` (solo la suya) o `manager` (todas). Por votos y propina.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: status
          in: query
          schema: { type: string, enum: [requested, played], default: requested }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_requests:
                    type: array
                    items: { $ref: '#/components/schemas/SongRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/song-requests/{id}/play:
    post:
      operationId: postNightclubsByNightclubIdSongRequestsByIdPlay
      tags: [Propinas y canciones]
      summary: Marcar la canción como tocada
      description: Solo el DJ dueño de la cola. Avisa a todos los que la pidieron. Las solicitudes no se rechazan.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Tocada
          content:
            application/json:
              schema:
                type: object
                properties:
                  song_request: { $ref: '#/components/schemas/SongRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/leaderboard:
    get:
      operationId: getNightclubsByNightclubIdLeaderboard
      tags: [Propinas y canciones]
      summary: Tablero de reconocimiento
      description: Por propinas cobradas de la noche o del mes. Un cliente ve posición y nombre, nunca montos.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - name: period
          in: query
          schema: { type: string, enum: [night, month], default: night }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/EmployeeRole' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Tablero
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer }
                        user_id: { type: string, format: uuid }
                        display_name: { type: string }
                        role: { $ref: '#/components/schemas/EmployeeRole' }
                        fans: { type: integer }
                        tips_count: { type: integer, description: Solo personal y gerente. }
                        total_mxn: { $ref: '#/components/schemas/Money' }
                        total_usd: { $ref: '#/components/schemas/Money' }

  /api/me/payment-methods:
    get:
      operationId: getMePaymentMethods
      tags: [Pagos]
      summary: Mis métodos de pago
      description: Nunca devuelve el token del proveedor ni números de tarjeta.
      responses:
        '200':
          description: Métodos guardados
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_methods:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentMethod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: postMePaymentMethods
      tags: [Pagos]
      summary: Guardar un método de pago
      description: |
        Solo se almacena el **token** que devuelve el proveedor (Stripe o Mercado Pago),
        más los últimos cuatro dígitos y la marca para poder mostrarlo. El número de
        tarjeta nunca pasa por esta API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodCreate' }
      responses:
        '201':
          description: Método guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/me/payment-methods/{id}:
    delete:
      operationId: deleteMePaymentMethodsById
      tags: [Pagos]
      summary: Eliminar un método de pago
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/webhooks/pos:
    post:
      operationId: postWebhooksPos
      tags: [Sistema]
      summary: Webhook del punto de venta
      description: |
        Reservado para la fase 4. Hoy responde 501: el mecanismo real de integración con
        SoftRestaurant 11 se define en `docs/POS_REAL.md` (decisión D16, agente local).
      security: []
      responses:
        '501':
          description: No implementado todavía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Firma del webhook inválida (a partir de la fase 4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/taxi-settings:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getTaxiSettings
      tags: [Taxi y salida segura]
      summary: Ajustes del módulo de salida segura
      description: |
        El cliente recibe solo el punto de encuentro, la moneda y los términos. La comisión
        y los plazos internos son del gerente.
      responses:
        '200':
          description: Ajustes
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/TaxiSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putTaxiSettings
      tags: [Taxi y salida segura]
      summary: Editar los ajustes (gerente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxiSettingsUpdate' }
      responses:
        '200':
          description: Ajustes actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/TaxiSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/taxi-fares:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listTaxiFares
      tags: [Taxi y salida segura]
      summary: Lista de tarifas por zona
      parameters:
        - name: include_inactive
          in: query
          description: Solo el gerente ve las tarifas retiradas.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Tarifas
          content:
            application/json:
              schema:
                type: object
                properties:
                  fares:
                    type: array
                    items: { $ref: '#/components/schemas/TaxiFare' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTaxiFare
      tags: [Taxi y salida segura]
      summary: Cargar una tarifa (gerente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxiFareCreate' }
      responses:
        '201':
          description: Tarifa creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  fare: { $ref: '#/components/schemas/TaxiFare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/taxi-fares/{fareId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/FareId'
    put:
      operationId: updateTaxiFare
      tags: [Taxi y salida segura]
      summary: Editar una tarifa (gerente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxiFareUpdate' }
      responses:
        '200':
          description: Tarifa actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  fare: { $ref: '#/components/schemas/TaxiFare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: retireTaxiFare
      tags: [Taxi y salida segura]
      summary: Retirar una tarifa (gerente)
      description: |
        La tarifa se marca inactiva, nunca se borra: los viajes pasados se cotizaron con ella.
      responses:
        '200':
          description: Tarifa retirada
          content:
            application/json:
              schema:
                type: object
                properties:
                  fare: { $ref: '#/components/schemas/TaxiFare' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/drivers:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listDrivers
      tags: [Taxi y salida segura]
      summary: Conductores registrados (gerente)
      parameters:
        - name: availability
          in: query
          schema: { type: string, enum: [off, available, on_trip] }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Conductores
          content:
            application/json:
              schema:
                type: object
                properties:
                  drivers:
                    type: array
                    items: { $ref: '#/components/schemas/Driver' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createDriver
      tags: [Taxi y salida segura]
      summary: Registrar un conductor de confianza (gerente)
      description: |
        Crea una cuenta real con rol `driver`. La contraseña temporal viaja **una sola vez**
        en esta respuesta y nunca se guarda en claro; hasta cambiarla, la cuenta solo puede
        usar `POST /api/auth/password`. `trusted` es el aval del gerente tras ver licencia y
        papeles: un conductor sin aval puede entrar pero nunca se despacha.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverCreate' }
      responses:
        '201':
          description: Conductor registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/Driver' }
                  temporary_password: { type: string, minLength: 12, maxLength: 12 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/drivers/{driverId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/DriverId'
    get:
      operationId: getDriver
      tags: [Taxi y salida segura]
      summary: Ficha de un conductor (gerente)
      responses:
        '200':
          description: Conductor
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/Driver' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateDriver
      tags: [Taxi y salida segura]
      summary: Editar, verificar o dar de baja a un conductor (gerente)
      description: |
        `active: false` bloquea la cuenta y cierra sus sesiones. Quitar `trusted` o dar de
        baja también apaga su disponibilidad. Si tiene un viaje vivo responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverUpdate' }
      responses:
        '200':
          description: Conductor actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/Driver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/drivers/{driverId}/reset-password:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/DriverId'
    post:
      operationId: resetDriverPassword
      tags: [Taxi y salida segura]
      summary: Reiniciar la contraseña de un conductor (gerente)
      responses:
        '200':
          description: Nueva contraseña temporal
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporary_password: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/taxi/me:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getMyDriverProfile
      tags: [Taxi y salida segura]
      summary: Mi ficha de conductor
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/Driver' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/taxi/me/availability:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    put:
      operationId: setDriverAvailability
      tags: [Taxi y salida segura]
      summary: Marcarme disponible o no disponible
      description: |
        `at_venue: true` significa «ya estoy estacionado en la salida», y es lo que permite
        que la app le diga al cliente que baje sin esperar. `on_trip` lo pone el sistema al
        aceptar un viaje; no se declara a mano. Apagarse siempre limpia `at_venue`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { type: string, enum: [off, available] }
                at_venue: { type: boolean, default: false }
      responses:
        '200':
          description: Disponibilidad actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  availability: { $ref: '#/components/schemas/DriverAvailability' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/taxi/me/offers:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listDriverOffers
      tags: [Taxi y salida segura]
      summary: Solicitudes abiertas que puedo tomar
      description: |
        Una solicitud abierta se ofrece a todos los conductores disponibles a la vez; el
        primero que acepta se la lleva. Las que rechacé no vuelven a aparecer en mi lista,
        pero siguen en la de los demás.
      responses:
        '200':
          description: Ofertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/TaxiRide' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/taxi/me/rides:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listDriverRides
      tags: [Taxi y salida segura]
      summary: Mis viajes y lo cobrado esta noche
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Viajes del conductor
          content:
            application/json:
              schema:
                type: object
                properties:
                  rides:
                    type: array
                    items: { $ref: '#/components/schemas/TaxiRide' }
                  live:
                    oneOf:
                      - { $ref: '#/components/schemas/TaxiRide' }
                      - { type: 'null' }
                  tonight:
                    type: array
                    items:
                      type: object
                      properties:
                        currency: { type: string, enum: [MXN, USD] }
                        rides: { type: integer }
                        charged: { type: string, description: Decimal con dos cifras. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/taxi/availability:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getTaxiAvailability
      tags: [Taxi y salida segura]
      summary: Cuántos conductores hay y cuánto se espera
      description: |
        No hay GPS en esta fase. `estimated_wait_minutes` es **0** cuando hay un conductor
        estacionado en la salida, o el promedio real de recogidas anteriores de los
        conductores disponibles. Si no existe ninguna de las dos cosas devuelve `null`: no
        se inventa un tiempo.
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiAvailability' }

  /api/nightclubs/{nightclubId}/taxi/rides:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listTaxiRides
      tags: [Taxi y salida segura]
      summary: Tablero de viajes (gerente)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, assigned, driver_arrived, in_progress, completed, cancelled, no_driver]
        - name: driver_id
          in: query
          schema: { type: string, format: uuid }
        - name: live
          in: query
          description: Solo los viajes vivos (solicitado, asignado, en la salida o en curso).
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Viajes
          content:
            application/json:
              schema:
                type: object
                properties:
                  rides:
                    type: array
                    items: { $ref: '#/components/schemas/TaxiRide' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTaxiRide
      tags: [Taxi y salida segura]
      summary: Solicitar un taxi
      description: |
        Idempotente por `client_request_id`: reenviar la misma clave devuelve 200 con el
        viaje ya creado en vez de duplicarlo. Un cliente no puede tener dos solicitudes
        abiertas (409). La respuesta incluye la disponibilidad del momento para que la
        pantalla diga «espéralo en la salida» cuando corresponde.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxiRideCreate' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
                  availability: { $ref: '#/components/schemas/TaxiAvailability' }
                  pickup_point: { type: string }
        '200':
          description: La misma solicitud ya existía (idempotencia)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
                  idempotent: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/taxi/rides/mine:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listMyTaxiRides
      tags: [Taxi y salida segura]
      summary: Mis viajes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Viajes del cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  rides:
                    type: array
                    items: { $ref: '#/components/schemas/TaxiRide' }
                  live:
                    oneOf:
                      - { $ref: '#/components/schemas/TaxiRide' }
                      - { type: 'null' }

  /api/nightclubs/{nightclubId}/taxi/rides/expire:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    post:
      operationId: expireTaxiRides
      tags: [Taxi y salida segura]
      summary: Cerrar solicitudes que nadie tomó (gerente o anfitriona)
      description: |
        Marca como `no_driver` las solicitudes abiertas que superaron el plazo del club.
        Idempotente; a partir de la fase 7 lo ejecuta también una tarea programada.
      responses:
        '200':
          description: Solicitudes cerradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  expired: { type: integer }
                  ride_ids:
                    type: array
                    items: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    get:
      operationId: getTaxiRide
      tags: [Taxi y salida segura]
      summary: Estado de un viaje
      description: |
        La misma fila se lee de tres maneras: el cliente ve el auto y el teléfono del
        conductor (solo desde que hay uno asignado), el conductor ve a quién recoge pero
        nunca su teléfono, y el gerente lo ve todo. Un viaje ajeno responde 404.
      responses:
        '200':
          description: Viaje
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/accept:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: acceptTaxiRide
      tags: [Taxi y salida segura]
      summary: Aceptar un viaje declarando en cuántos minutos llego
      description: |
        Si dos conductores aceptan al mismo instante, el segundo recibe 409 y el viaje no
        cambia de dueño. Aceptar deja al conductor `on_trip`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eta_minutes]
              properties:
                eta_minutes:
                  type: integer
                  minimum: 0
                  maximum: 120
                  description: 0 significa «ya estoy en la salida».
      responses:
        '200':
          description: Viaje asignado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/decline:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: declineTaxiRide
      tags: [Taxi y salida segura]
      summary: Quitar una solicitud de mi lista
      description: Idempotente; no se la quita a los demás conductores.
      responses:
        '200':
          description: Rechazada
          content:
            application/json:
              schema:
                type: object
                properties:
                  declined: { type: boolean }
                  ride_id: { type: string, format: uuid }
                  changed: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/arrived:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: taxiRideArrived
      tags: [Taxi y salida segura]
      summary: Avisar que estoy en la salida (conductor)
      responses:
        '200':
          description: Viaje en la salida
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/start:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: startTaxiRide
      tags: [Taxi y salida segura]
      summary: Confirmar el inicio del viaje (conductor)
      description: |
        Es el momento en que el pasajero sale, así que es el momento en que se emite la
        constancia de salida con su folio y su vigencia.
      responses:
        '200':
          description: Viaje iniciado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
                  certificate: { $ref: '#/components/schemas/DepartureCertificate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/finish:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: finishTaxiRide
      tags: [Taxi y salida segura]
      summary: Confirmar el fin del viaje y el cobro (conductor)
      description: |
        `cash` asienta el cobro en el libro contable (`taxi_ride`, proveedor `cash`, pagador
        el cliente y beneficiario el conductor) con la nota de que el dinero pasó de mano a
        mano: el club nunca lo tuvo. `courtesy` no lleva monto ni asiento. `card` responde
        501 hasta la fase 3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_amount, payment_method]
              properties:
                final_amount: { type: number, minimum: 0, maximum: 100000 }
                payment_method: { type: string, enum: [cash, card, courtesy] }
                notes: { type: string, maxLength: 280 }
      responses:
        '200':
          description: Viaje terminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '501':
          description: El cobro con tarjeta llega en la fase 3
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/cancel:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: cancelTaxiRide
      tags: [Taxi y salida segura]
      summary: Cancelar el viaje (cliente o gerente)
      description: |
        Solo antes de que empiece. Un viaje en curso responde 409 y el conductor no cancela:
        rechaza la solicitud antes de aceptarla.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Viaje cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride: { $ref: '#/components/schemas/TaxiRide' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/rate:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: rateTaxiRide
      tags: [Taxi y salida segura]
      summary: Calificar el viaje (cliente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 280 }
      responses:
        '200':
          description: Calificación registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      rating: { type: integer }
                      rating_comment: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/taxi/rides/{rideId}/certificate:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/RideId'
    get:
      operationId: getDepartureCertificate
      tags: [Taxi y salida segura]
      summary: Constancia de salida del viaje
      responses:
        '200':
          description: Constancia
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { $ref: '#/components/schemas/DepartureCertificate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/taxi/stats:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getTaxiStats
      tags: [Taxi y salida segura]
      summary: Números del módulo por conductor (gerente)
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/taxi/verify/{folio}:
    get:
      operationId: verifyDepartureCertificate
      tags: [Taxi y salida segura]
      summary: Verificar una constancia por su folio (público)
      description: |
        Sin sesión: quien tiene el folio impreso puede comprobarlo. Devuelve el mínimo que
        hace útil la comprobación —club, hora de salida, vigencia, nombre corto del pasajero
        y el auto— y **nunca** el destino, el monto, el teléfono ni el apellido completo.
        Limitado a 20 peticiones por minuto.
      security: []
      parameters:
        - $ref: '#/components/parameters/Folio'
      responses:
        '200':
          description: Constancia
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { $ref: '#/components/schemas/DepartureCertificate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/nightclubs/{nightclubId}/valet-settings:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getValetSettings
      tags: [Valet]
      summary: Ajustes del valet
      responses:
        '200':
          description: Ajustes
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/ValetSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putValetSettings
      tags: [Valet]
      summary: Editar los ajustes (gerente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValetSettingsUpdate' }
      responses:
        '200':
          description: Ajustes actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/ValetSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/parking-spots:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listParkingSpots
      tags: [Valet]
      summary: Cajones y qué hay en cada uno (personal del valet)
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Cajones
          content:
            application/json:
              schema:
                type: object
                properties:
                  spots:
                    type: array
                    items: { $ref: '#/components/schemas/ParkingSpot' }
                  occupancy: { $ref: '#/components/schemas/ParkingOccupancy' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createParkingSpots
      tags: [Valet]
      summary: Cargar cajones (gerente)
      description: |
        Se cargan en bloque porque un estacionamiento se da de alta una vez, como A1..A20.
        Los códigos que ya existen se omiten en lugar de fallar; los repetidos dentro de la
        misma petición responden 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spots]
              properties:
                spots:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    required: [code]
                    properties:
                      code: { type: string, minLength: 1, maxLength: 20 }
                      zone: { type: [string, 'null'], maxLength: 40 }
      responses:
        '201':
          description: Cajones creados
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items: { $ref: '#/components/schemas/ParkingSpot' }
                  skipped: { type: integer, description: Códigos que ya existían. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/parking-spots/{spotId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/SpotId'
    put:
      operationId: updateParkingSpot
      tags: [Valet]
      summary: Editar un cajón (gerente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                code: { type: string, minLength: 1, maxLength: 20 }
                zone: { type: [string, 'null'], maxLength: 40 }
                active: { type: boolean }
      responses:
        '200':
          description: Cajón actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  spot: { $ref: '#/components/schemas/ParkingSpot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: retireParkingSpot
      tags: [Valet]
      summary: Retirar un cajón (gerente)
      description: 'Se marca inactivo, nunca se borra: los tickets pasados lo referencian.'
      responses:
        '200':
          description: Cajón retirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  spot: { $ref: '#/components/schemas/ParkingSpot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/valet/tickets:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listValetTickets
      tags: [Valet]
      summary: Tablero del valet
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [parked, requested, ready, delivered, cancelled] }
        - name: open
          in: query
          description: Solo los autos que siguen en el estacionamiento.
          schema: { type: boolean, default: false }
        - name: plate
          in: query
          schema: { type: string, maxLength: 20 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/ValetTicket' }
                  occupancy: { $ref: '#/components/schemas/ParkingOccupancy' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createValetTicket
      tags: [Valet]
      summary: Recibir un auto
      description: |
        Devuelve dos identificadores distintos. `code` es corto y se dice en voz alta; **no
        es un secreto**. `qr_token` es lo que libera el auto y viaja **una sola vez**, aquí,
        para imprimirse como QR en el comprobante: no aparece en ninguna consulta posterior,
        porque si el personal pudiera leerlo de una lista, exigirlo al entregar sería teatro.
        Idempotente por `client_request_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValetTicketCreate' }
      responses:
        '201':
          description: Auto recibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
                  qr_token: { type: string, description: 48 caracteres hexadecimales. }
                  handover_point: { type: string }
        '200':
          description: El mismo ticket ya existía (idempotencia)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
                  idempotent: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/valet/tickets/mine:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listMyValetTickets
      tags: [Valet]
      summary: Mis autos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tickets del cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/ValetTicket' }
                  open:
                    type: array
                    items: { $ref: '#/components/schemas/ValetTicket' }

  /api/nightclubs/{nightclubId}/valet/tickets/by-token/{token}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - name: token
        in: path
        required: true
        description: El token leído del QR. Es la entrada de esta consulta, nunca su salida.
        schema: { type: string, minLength: 16, maxLength: 64 }
    get:
      operationId: getValetTicketByToken
      tags: [Valet]
      summary: Resolver un escaneo del QR (personal del valet)
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/valet/occupancy:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getParkingOccupancy
      tags: [Valet]
      summary: Cuántos cajones quedan libres (personal del valet)
      responses:
        '200':
          description: Ocupación
          content:
            application/json:
              schema:
                type: object
                properties:
                  occupancy: { $ref: '#/components/schemas/ParkingOccupancy' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/valet/stats:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getValetStats
      tags: [Valet]
      summary: Números del valet (gerente)
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValetStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/valet/claim:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    post:
      operationId: claimValetTicket
      tags: [Valet]
      summary: Reclamar mi ticket escaneando el QR
      description: |
        Asocia el ticket a la cuenta para poder pedir el auto desde la app. Un ticket ya
        asociado a otra cuenta responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string, minLength: 16, maxLength: 64 }
      responses:
        '200':
          description: Ticket reclamado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/valet/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/TicketId'
    get:
      operationId: getValetTicket
      tags: [Valet]
      summary: Ver un ticket
      description: |
        El cliente ve su auto y su estado; el personal ve además el teléfono, las notas y
        quién lo recibió; el gerente ve también el rastro de una entrega sin QR. Un ticket
        ajeno responde 404.
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/valet/tickets/{ticketId}/request:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/TicketId'
    post:
      operationId: requestValetCar
      tags: [Valet]
      summary: Pedir que traigan mi auto
      description: Pedirlo dos veces no es un error; responde con `already_requested`.
      responses:
        '200':
          description: Auto solicitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
                  already_requested: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/valet/tickets/{ticketId}/ready:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/TicketId'
    post:
      operationId: valetCarReady
      tags: [Valet]
      summary: El auto ya está en la puerta (personal del valet)
      responses:
        '200':
          description: Auto listo
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/valet/tickets/{ticketId}/deliver:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/TicketId'
    post:
      operationId: deliverValetCar
      tags: [Valet]
      summary: Entregar el auto escaneando el QR (personal del valet)
      description: |
        El token es el control, no el estado: quien tiene el ticket -en papel o en el
        teléfono- se lleva el auto, lo haya pedido antes o no. Un token que no corresponde
        responde 403 con el mismo mensaje en todos los casos, para no ir diciendo a nadie
        que se está acercando. Si el club cobra el valet, aquí se indica cómo se pagó.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string, minLength: 16, maxLength: 64 }
                payment_method:
                  type: string
                  enum: [cash, card, courtesy]
                  description: Obligatorio solo si la tarifa del ticket es mayor que cero.
      responses:
        '200':
          description: Auto entregado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '501':
          description: El cobro con tarjeta llega en la fase 3
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/valet/tickets/{ticketId}/deliver-override:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/TicketId'
    post:
      operationId: deliverValetCarWithoutQr
      tags: [Valet]
      summary: Entregar sin QR, solo el gerente
      description: |
        La única puerta que se salta el QR, y es del gerente. Queda asentado en `audit_log`
        el motivo, el tipo de identificación y el nombre que aparece en ella. **El número
        del documento no se guarda**: no aporta nada a la pregunta de quién se llevó el auto
        y sí sería un riesgo tenerlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, id_type, id_name]
              properties:
                reason: { type: string, minLength: 5, maxLength: 200 }
                id_type: { type: string, enum: [INE, pasaporte, licencia, otro] }
                id_name: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Auto entregado con constancia del gerente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/valet/tickets/{ticketId}/cancel:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/TicketId'
    post:
      operationId: cancelValetTicket
      tags: [Valet]
      summary: Cancelar un ticket (personal del valet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 160 }
      responses:
        '200':
          description: Ticket cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: '#/components/schemas/ValetTicket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/valet/tickets/{ticketId}/rate:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/TicketId'
    post:
      operationId: rateValetService
      tags: [Valet]
      summary: Calificar el servicio (cliente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 280 }
      responses:
        '200':
          description: Calificación registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      rating: { type: integer }
                      rating_comment: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/pos-integrations:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listPosIntegrations
      tags: [Integración POS]
      summary: Integraciones declaradas (gerente)
      responses:
        '200':
          description: Integraciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items: { $ref: '#/components/schemas/PosIntegration' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createPosIntegration
      tags: [Integración POS]
      summary: Declarar la integración (gerente)
      description: |
        En modo `agent` devuelve la llave del agente **una sola vez**: solo se guarda su
        SHA-256, de modo que una copia de esta base de datos no es una entrada al POS.
        **No se guardan credenciales de SQL Server**: con el agente local (D16) el usuario
        de solo lectura vive en el servidor del club. `config` admite únicamente nombres
        (servidor, instancia, base) y qué sincronizar; cualquier otra llave se rechaza.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PosIntegrationCreate' }
      responses:
        '201':
          description: Integración declarada
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration: { $ref: '#/components/schemas/PosIntegration' }
                  agent_key:
                    type: string
                    description: Solo en modo `agent`. No vuelve a mostrarse nunca.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/pos-integrations/{integrationId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/IntegrationId'
    get:
      operationId: getPosIntegration
      tags: [Integración POS]
      summary: Estado y salud de una integración (gerente)
      responses:
        '200':
          description: Integración
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration: { $ref: '#/components/schemas/PosIntegration' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePosIntegration
      tags: [Integración POS]
      summary: Encender, apagar o reconfigurar (gerente)
      description: |
        Encender una integración de agente sin llave responde 422: sería un foco verde
        sobre nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PosIntegrationUpdate' }
      responses:
        '200':
          description: Integración actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration: { $ref: '#/components/schemas/PosIntegration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deletePosIntegration
      tags: [Integración POS]
      summary: Eliminar la integración (gerente)
      description: Hay que apagarla primero; una encendida responde 409.
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/pos-integrations/{integrationId}/rotate-key:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: rotatePosAgentKey
      tags: [Integración POS]
      summary: Rotar la llave del agente (gerente)
      description: |
        La llave anterior deja de valer de inmediato, que es justo para lo que sirve rotar.
        Se borra también lo que sabíamos del agente anterior (versión, equipo, último
        latido): ya no es el mismo.
      responses:
        '200':
          description: Llave rotada
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration: { $ref: '#/components/schemas/PosIntegration' }
                  agent_key: { type: string, description: No vuelve a mostrarse nunca. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/pos-sync-log:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listPosSyncLog
      tags: [Integración POS]
      summary: Bitácora de sincronizaciones (gerente)
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [menu, inventory, orders, status, tables] }
        - name: only_failed
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Corridas y resumen de los últimos 7 días
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/PosSyncRun' }
                  last_7_days:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        runs: { type: integer }
                        ok: { type: integer }
                        failed: { type: integer }
                        items: { type: integer }
                        last_success_at: { type: [string, 'null'], format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/pos/agent/heartbeat:
    post:
      operationId: posAgentHeartbeat
      tags: [Integración POS]
      summary: Latido del agente local
      description: |
        Lo llama el agente instalado en el servidor del club, autenticándose con
        `X-Agent-Key` y **no** con una sesión de usuario: es una máquina, no hereda los
        permisos de nadie. La respuesta le dice qué puede hacer, de modo que el club
        encienda y apague la integración desde la app sin tocar el equipo del local.
      security:
        - agentKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, maxLength: 30 }
                hostname: { type: string, maxLength: 120 }
                status: { type: string, enum: [ok, error], default: ok }
                error: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Instrucciones para el agente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosAgentInstructions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/pos/agent/sync:
    post:
      operationId: posAgentReportSync
      tags: [Integración POS]
      summary: Reportar una corrida de sincronización
      description: |
        Idempotente por `client_request_id`: un agente que reintenta tras un timeout no
        duplica su propia historia. Una corrida fallida marca la integración en rojo en la
        pantalla del gerente en vez de quedarse enterrada en el log.
      security:
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PosSyncReport' }
      responses:
        '201':
          description: Corrida registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string, description: Entero de 64 bits como cadena. }
        '200':
          description: Ya estaba registrada (idempotencia)
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  idempotent: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/nightclubs/{nightclubId}/payment-providers:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: getPaymentProviders
      tags: [Pagos manuales]
      summary: Con qué se puede cobrar hoy
      description: |
        El gerente ve qué pasarelas están configuradas y **qué llaves faltan**, para que
        conectar Stripe o Mercado Pago sea una lista de pendientes y no una adivinanza
        (`docs/PAGOS_SETUP.md`). El cliente ve solo las que ya funcionan, con la llave
        pública que su navegador necesita.

        Las llaves **secretas viven en variables de entorno, nunca en la base de datos**, y
        **nunca salen por esta ruta**. Mientras no haya ninguna pasarela, el club cobra con
        pagos manuales, que no dependen de ninguna cuenta externa.
      responses:
        '200':
          description: Estado de las pasarelas
          content:
            application/json:
              schema:
                type: object
                properties:
                  manual_available: { type: boolean }
                  any_provider_configured:
                    type: boolean
                    description: Solo para el gerente.
                  providers:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentProviderStatus' }

  /api/nightclubs/{nightclubId}/manual-payment-options:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listManualPaymentOptions
      tags: [Pagos manuales]
      summary: A dónde puede pagar el cliente
      parameters:
        - name: include_inactive
          in: query
          description: Solo el gerente ve las retiradas.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Formas de pago
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items: { $ref: '#/components/schemas/ManualPaymentOption' }
    post:
      operationId: createManualPaymentOption
      tags: [Pagos manuales]
      summary: Cargar una forma de pago (gerente)
      description: |
        `destination` es la cuenta, CLABE o usuario al que el cliente envía el dinero, y se
        guarda en claro a propósito: a diferencia de la cuenta de un empleado (cifrada en
        la migración 007), esta es la cuenta receptora del club y su función es mostrarse a
        quien va a pagar. Una transferencia sin destino se rechaza; el efectivo no lo pide.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPaymentOptionCreate' }
      responses:
        '201':
          description: Forma de pago creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  option: { $ref: '#/components/schemas/ManualPaymentOption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/manual-payment-options/{optionId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/OptionId'
    put:
      operationId: updateManualPaymentOption
      tags: [Pagos manuales]
      summary: Editar una forma de pago (gerente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPaymentOptionUpdate' }
      responses:
        '200':
          description: Forma de pago actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  option: { $ref: '#/components/schemas/ManualPaymentOption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: retireManualPaymentOption
      tags: [Pagos manuales]
      summary: Retirar una forma de pago (gerente)
      description: 'Se marca inactiva, nunca se borra: los pagos ya declarados la referencian.'
      responses:
        '200':
          description: Retirada
          content:
            application/json:
              schema:
                type: object
                properties:
                  option: { $ref: '#/components/schemas/ManualPaymentOption' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/manual-payments:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listManualPayments
      tags: [Pagos manuales]
      summary: Cola de pagos por revisar (gerente)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [declared, confirmed, rejected, cancelled] }
        - name: method
          in: query
          schema: { type: string, enum: [cash, card_terminal, zelle, cash_app, bank_transfer, spei] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagos
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/ManualPayment' }
                  awaiting_review:
                    type: array
                    items:
                      type: object
                      properties:
                        currency: { $ref: '#/components/schemas/Currency' }
                        count: { type: integer }
                        total: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: declareManualPayment
      tags: [Pagos manuales]
      summary: Declarar que ya se pagó
      description: |
        **No cobra nada.** Deja el asiento del libro en `pending_manual` a la espera de que
        el gerente lo confirme contra el estado de cuenta. Una transferencia exige folio:
        sin él no hay forma de comprobarla. Un cliente solo declara sus propios cobros; el
        personal puede declarar por otra persona con `on_behalf_of`. Idempotente por
        `client_request_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPaymentDeclare' }
      responses:
        '201':
          description: Pago declarado
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/ManualPayment' }
        '200':
          description: Ya estaba declarado (idempotencia)
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/ManualPayment' }
                  idempotent: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/manual-payments/mine:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    get:
      operationId: listMyManualPayments
      tags: [Pagos manuales]
      summary: Mis pagos declarados
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagos del cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/ManualPayment' }

  /api/nightclubs/{nightclubId}/manual-payments/register:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
    post:
      operationId: registerManualPayment
      tags: [Pagos manuales]
      summary: Registrar dinero ya recibido (anfitriona o gerente)
      description: |
        Efectivo en la puerta: se declara y se confirma en un solo paso, porque quien lo
        registra es quien lo recibió. No hay segunda persona que verifique, así que el
        registro deja constancia de **quién tomó el dinero** y de parte de quién.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPaymentDeclare' }
      responses:
        '201':
          description: Pago registrado y confirmado
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/ManualPayment' }
                  reservation_confirmed: { type: [string, 'null'], format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/manual-payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/PaymentId'
    get:
      operationId: getManualPayment
      tags: [Pagos manuales]
      summary: Ver un pago
      description: |
        El cliente ve su declaración y en qué va; el gerente ve además quién la hizo, quién
        la revisó y el asiento contra el que se aplica. Un pago ajeno responde 404.
      responses:
        '200':
          description: Pago
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/ManualPayment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/manual-payments/{paymentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: cancelManualPayment
      tags: [Pagos manuales]
      summary: Retirar mi declaración
      description: Solo mientras esté `declared`. El cobro vuelve a `pending` y se puede declarar de nuevo.
      responses:
        '200':
          description: Declaración retirada
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/ManualPayment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/manual-payments/{paymentId}/confirm:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: confirmManualPayment
      tags: [Pagos manuales]
      summary: Confirmar el pago contra el estado de cuenta (gerente)
      description: |
        Lo único que mueve el asiento a `paid`. Si el cobro pagaba el depósito de una
        reservación, **la reservación pasa a `confirmed`** en la misma transacción SQL.
        Un monto distinto al del cobro responde 422 con ambas cifras: el importe del libro
        es inmutable, así que la diferencia se resuelve rechazando y pidiendo el faltante,
        no cuadrando el asiento por detrás.
      responses:
        '200':
          description: Pago confirmado
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/ManualPayment' }
                  reservation_confirmed: { type: [string, 'null'], format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/manual-payments/{paymentId}/reject:
    parameters:
      - $ref: '#/components/parameters/NightclubId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: rejectManualPayment
      tags: [Pagos manuales]
      summary: Rechazar el pago (gerente)
      description: |
        El cobro vuelve a `pending`, no a `failed`: el cliente corrige el folio y declara de
        nuevo. El motivo le llega en el evento `payment_rejected`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 200 }
      responses:
        '200':
          description: Pago rechazado
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/ManualPayment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ==========================================================================
  # Inventario: lugares, insumos, recetas, kardex y puntos de entrega
  # ==========================================================================

  /api/nightclubs/{nightclubId}/supply-locations:
    get:
      operationId: getNightclubsByNightclubIdSupplyLocations
      tags: [Inventario]
      summary: Lugares donde vive la existencia
      description: |
        El almacén y las barras. Cada barra trae las zonas del plano que atiende, que es
        lo que decide de qué estante baja el pedido de una mesa.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Lugares del club
          content:
            application/json:
              schema:
                type: object
                properties:
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/SupplyLocation' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postNightclubsByNightclubIdSupplyLocations
      tags: [Inventario]
      summary: Dar de alta un lugar
      description: Solo gerencia. Un tercer estante, una barra de terraza, una bodega chica.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyLocationCreate' }
      responses:
        '201':
          description: Lugar creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  location: { $ref: '#/components/schemas/SupplyLocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/supply-locations/{locationId}:
    patch:
      operationId: patchNightclubsByNightclubIdSupplyLocationsByLocationId
      tags: [Inventario]
      summary: Editar o apagar un lugar
      description: |
        Apagar una barra que todavía atiende zonas responde 409 y nombra las zonas: sin
        eso, los pedidos de esas mesas se quedarían sin barra a media noche.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/LocationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                floor: { type: string, maxLength: 10 }
                sort_order: { type: integer }
                active: { type: boolean }
      responses:
        '200':
          description: Lugar actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  location: { $ref: '#/components/schemas/SupplyLocation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/zone-bars:
    get:
      operationId: getNightclubsByNightclubIdZoneBars
      tags: [Inventario]
      summary: Qué barra atiende cada zona
      description: |
        Todas las zonas del plano, tengan barra asignada o no. `unassigned` es lo que el
        gerente necesita ver antes de que llegue el primer pedido: una zona sin barra
        cae en la barra de su planta por omisión, que puede no ser la correcta.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      responses:
        '200':
          description: Zonas y su barra
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        section: { type: string }
                        floor: { type: string }
                        tables: { type: integer }
                        location_id: { type: [string, 'null'], format: uuid }
                        bar_code: { type: [string, 'null'] }
                        bar_name: { type: [string, 'null'] }
                  unassigned:
                    type: array
                    items: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putNightclubsByNightclubIdZoneBars
      tags: [Inventario]
      summary: Reasignar zonas a una barra
      description: |
        Solo gerencia, y se puede hacer a media noche: "la terraza pasa a la barra de
        arriba". `location_id: null` desasigna y la zona vuelve a la barra de su planta.
        Una zona no se puede asignar al almacén (422): el almacén no sirve tragos.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [section, location_id]
                    properties:
                      section: { type: string, maxLength: 40 }
                      location_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Asignaciones vigentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        section: { type: string }
                        location_id: { type: string, format: uuid }
                        bar_code: { type: string }
                        bar_name: { type: string }
                        updated_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/supplies:
    get:
      operationId: getNightclubsByNightclubIdSupplies
      tags: [Inventario]
      summary: Insumos con su existencia por lugar
      description: |
        `stock` es el total del club y `locations` lo desglosa por estante, que es lo
        único que sirve para saber si una barra puede servir algo. `packages` dice
        cuántas presentaciones son, que es como se cuenta mirando el estante.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 40 } }
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: low_only, in: query, schema: { type: boolean, default: false } }
        - { name: unconfirmed_only, in: query, schema: { type: boolean, default: false } }
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Insumos
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplies:
                    type: array
                    items: { $ref: '#/components/schemas/Supply' }
                  unconfirmed_sizes:
                    type: integer
                    description: Cuántas presentaciones nadie ha confirmado todavía.
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postNightclubsByNightclubIdSupplies
      tags: [Inventario]
      summary: Dar de alta un insumo
      description: |
        Nace en cero a propósito: la existencia entra por una recepción o un conteo,
        nunca al darlo de alta. Un saldo inicial tecleado es un número sin respaldo.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyCreate' }
      responses:
        '201':
          description: Insumo creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply: { $ref: '#/components/schemas/Supply' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/supplies/{supplyId}:
    patch:
      operationId: patchNightclubsByNightclubIdSuppliesBySupplyId
      tags: [Inventario]
      summary: Editar un insumo
      description: |
        `stock` y `avg_cost` no se editan: se mueven. Cambiar `package_size` da el
        tamaño por confirmado, porque es exactamente el dato que faltaba.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/SupplyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/SupplyCreate' }
                - type: object
                  properties:
                    active: { type: boolean }
      responses:
        '200':
          description: Insumo actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply: { $ref: '#/components/schemas/Supply' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/supplies/{supplyId}/min-stock:
    put:
      operationId: putNightclubsByNightclubIdSuppliesBySupplyIdMinStock
      tags: [Inventario]
      summary: Mínimo por lugar
      description: |
        El mínimo es por estante: la barra se surte cuando baja de dos botellas, el
        almacén cuando baja de una caja. Un solo mínimo para los dos avisa tarde en un
        lado y de más en el otro.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/SupplyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id, min_stock]
              properties:
                location_id: { type: string, format: uuid }
                min_stock: { type: number, minimum: 0 }
      responses:
        '200':
          description: Insumo con su mínimo nuevo
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply: { $ref: '#/components/schemas/Supply' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/supplies/{supplyId}/receive:
    post:
      operationId: postNightclubsByNightclubIdSuppliesBySupplyIdReceive
      tags: [Inventario]
      summary: Entrada de mercancía
      description: |
        La única puerta por la que entra producto al club. Se captura en presentaciones
        (`packages`) o en la unidad base (`quantity`), nunca en las dos. `package_cost`
        es lo que dice la factura por la presentación completa; el costo promedio
        ponderado se recalcula solo.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/SupplyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyReceipt' }
      responses:
        '201':
          description: Mercancía recibida
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply: { $ref: '#/components/schemas/Supply' }
                  movement: { $ref: '#/components/schemas/SupplyMovement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/supplies/{supplyId}/transfer:
    post:
      operationId: postNightclubsByNightclubIdSuppliesBySupplyIdTransfer
      tags: [Inventario]
      summary: Traspaso entre lugares
      description: |
        Lo que sale del almacén entra en la barra, en la misma transacción y con el mismo
        folio (`transfer_group`). Un traspaso que dejaría el origen en negativo responde
        409 con lo que hay de verdad.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/SupplyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyTransfer' }
      responses:
        '201':
          description: Traspaso hecho
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply: { $ref: '#/components/schemas/Supply' }
                  transfer:
                    type: object
                    properties:
                      transfer_group: { type: string, format: uuid }
                      out: { $ref: '#/components/schemas/SupplyMovement' }
                      in: { $ref: '#/components/schemas/SupplyMovement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/supplies/{supplyId}/count:
    post:
      operationId: postNightclubsByNightclubIdSuppliesBySupplyIdCount
      tags: [Inventario]
      summary: Conteo físico
      description: |
        Se captura lo que hay en el estante y el sistema calcula la diferencia. Se guarda
        la DIFERENCIA, no el número contado, para que el kardex siga sumando. `shrinkage`
        es lo que se fue sin venderse: es el número por el que existe todo lo demás.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/SupplyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id]
              properties:
                location_id: { type: string, format: uuid }
                counted: { type: number, minimum: 0 }
                counted_packages: { type: number, minimum: 0 }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Conteo aplicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply: { $ref: '#/components/schemas/Supply' }
                  difference: { type: number }
                  shrinkage: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/supplies/{supplyId}/adjust:
    post:
      operationId: postNightclubsByNightclubIdSuppliesBySupplyIdAdjust
      tags: [Inventario]
      summary: Merma, cortesía, salida o corrección
      description: |
        Todas exigen motivo: un saldo corregido sin explicación es indistinguible de un
        robo. Merma, cortesía y salida SIEMPRE restan, aunque el número venga en
        positivo. La corrección (`adjustment`) es la única que puede subir la existencia
        sin mercancía, y por eso solo la autoriza la gerencia. El cantinero puede
        reportar la merma de su barra, que es donde se rompen las botellas.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/SupplyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyAdjustment' }
      responses:
        '200':
          description: Movimiento aplicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply: { $ref: '#/components/schemas/Supply' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/supply-movements:
    get:
      operationId: getNightclubsByNightclubIdSupplyMovements
      tags: [Inventario]
      summary: Kardex del club
      description: |
        Solo inserciones: el saldo es la suma de su historia. Cada renglón dice qué,
        dónde, cuánto, quién y por qué, y los dos lados de un traspaso comparten
        `transfer_group`.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { name: supply_id, in: query, schema: { type: string, format: uuid } }
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - name: kind
          in: query
          schema:
            type: string
            enum: [receipt, issue, transfer_in, transfer_out, consumption, return, waste, courtesy, count, adjustment]
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Movimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  movements:
                    type: array
                    items: { $ref: '#/components/schemas/SupplyMovement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/supplies/{supplyId}/movements:
    get:
      operationId: getNightclubsByNightclubIdSuppliesBySupplyIdMovements
      tags: [Inventario]
      summary: Kardex de un insumo
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/SupplyId' }
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Movimientos del insumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  movements:
                    type: array
                    items: { $ref: '#/components/schemas/SupplyMovement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/recipes:
    get:
      operationId: getNightclubsByNightclubIdRecipes
      tags: [Inventario]
      summary: Recetas de la carta
      description: |
        Cuánto de cada insumo consume una unidad de cada producto. Los productos SIN
        receta salen primero: son los que no tienen control de existencia, y saber
        cuántos faltan es la mitad del trabajo mientras se captura el inventario.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { name: missing_only, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Recetas
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items: { $ref: '#/components/schemas/Recipe' }
                  without_recipe: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nightclubs/{nightclubId}/recipes/{drinkId}:
    put:
      operationId: putNightclubsByNightclubIdRecipesByDrinkId
      tags: [Inventario]
      summary: Guardar la receta de un producto
      description: |
        Se reemplaza entera: una receta es una lista, no un historial. Lo que de verdad
        salió con la receta anterior ya está en el kardex. Una receta vacía apaga el
        control de existencia de ese producto, que es la verdad cuando nadie la capturó.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/DrinkId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [supply_id, quantity]
                    properties:
                      supply_id: { type: string, format: uuid }
                      quantity: { type: number, exclusiveMinimum: 0 }
      responses:
        '200':
          description: Receta guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    type: object
                    properties:
                      drink_id: { type: string, format: uuid }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            supply_id: { type: string, format: uuid }
                            name: { type: string }
                            unit: { type: string }
                            quantity: { type: number }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/delivery-points:
    get:
      operationId: getNightclubsByNightclubIdDeliveryPoints
      tags: [Mesas]
      summary: Puntos de entrega
      description: |
        A dónde se lleva un pedido cuando no hay mesa: "Pista A", "Terraza". El cliente
        solo ve los que puede elegir (la barra no, para no amontonar gente esperando su
        trago); el personal los ve todos.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { name: kind, in: query, schema: { type: string, enum: [table, floor, terrace, bar] } }
        - { name: include_tables, in: query, schema: { type: boolean, default: false } }
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Puntos de entrega
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_points:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryPoint' }
    post:
      operationId: postNightclubsByNightclubIdDeliveryPoints
      tags: [Mesas]
      summary: Crear un punto de entrega
      description: Solo gerencia. El token del QR se genera solo y nunca se reutiliza.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, kind]
              properties:
                code: { type: string, maxLength: 30, pattern: '^[a-z0-9-]+$' }
                name: { type: string, maxLength: 80 }
                kind: { type: string, enum: [floor, terrace, bar] }
                floor: { type: string, maxLength: 10 }
                section: { type: string, maxLength: 40 }
                client_selectable: { type: boolean, default: true }
      responses:
        '201':
          description: Punto creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_point: { $ref: '#/components/schemas/DeliveryPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nightclubs/{nightclubId}/delivery-points/by-token/{token}:
    get:
      operationId: getNightclubsByNightclubIdDeliveryPointsByToken
      tags: [Mesas]
      summary: Qué hay detrás de un QR
      description: |
        La puerta de "pedir escaneando". Devuelve lo mínimo -- el punto y, si es una
        mesa, cuál -- y nunca quién está sentado ahí.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { name: token, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 64 } }
      responses:
        '200':
          description: El punto de entrega de ese código
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_point: { $ref: '#/components/schemas/DeliveryPoint' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/delivery-points/{pointId}/qr:
    get:
      operationId: getNightclubsByNightclubIdDeliveryPointsByPointIdQr
      tags: [Mesas]
      summary: El token para imprimir el QR
      description: Solo gerencia. Es lo que autoriza a pedir a nombre de un lugar.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/PointId' }
      responses:
        '200':
          description: Token del punto
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_point:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      code: { type: string }
                      name: { type: string }
                      kind: { type: string }
                      qr_token: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/nightclubs/{nightclubId}/delivery-points/{pointId}:
    patch:
      operationId: patchNightclubsByNightclubIdDeliveryPointsByPointId
      tags: [Mesas]
      summary: Editar un punto de entrega
      description: |
        `rotate_qr` invalida el papel pegado en la columna y genera uno nuevo. Es lo que
        hay que hacer si alguien fotografió el QR.
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/PointId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                floor: { type: string, maxLength: 10 }
                section: { type: string, maxLength: 40 }
                client_selectable: { type: boolean }
                active: { type: boolean }
                rotate_qr: { type: boolean }
      responses:
        '200':
          description: Punto actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_point: { $ref: '#/components/schemas/DeliveryPoint' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/nightclubs/{nightclubId}/orders/queue-order:
    put:
      operationId: putNightclubsByNightclubIdOrdersQueueOrder
      tags: [Pedidos]
      summary: Reacomodar la cola de la barra
      description: |
        Tres tragos del mismo whisky se preparan juntos, y obligar a la barra a seguir el
        orden de llegada la hace más lenta a propósito. Lo que se mueve es una
        preferencia de pantalla (`bar_position`): la hora en que entró el pedido y la
        hora en que se pagó no se tocan, así que el reporte del cierre sigue diciendo
        cuánto esperó de verdad cada cliente.
      parameters: [{ $ref: '#/components/parameters/NightclubId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_ids]
              properties:
                order_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Cola reacomodada
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_ids:
                    type: array
                    items: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de 15 minutos obtenido en login o refresh.
    agentKey:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: |
        Llave propia del agente local del POS. Autentica una maquina, no una persona:
        no hereda permisos de ningun usuario y solo sirve en las rutas /api/pos/agent/*.

  parameters:
    SupplyId:
      name: supplyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PointId:
      name: pointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NightclubId:
      name: nightclubId
      in: path
      required: true
      description: Debe coincidir con el club del usuario autenticado; si no, 403.
      schema: { type: string, format: uuid }
    DrinkId:
      name: drinkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestPassId:
      name: passId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

    EventId:
      name: eventId
      in: path
      required: true
      description: Identificador de la noche.
      schema: { type: string, format: uuid }
    ZoneSection:
      name: section
      in: path
      required: true
      description: Nombre de la zona, tal como aparece en la lista de precios.
      schema: { type: string, maxLength: 40 }

    FlirtId:
      name: flirtId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WithdrawalId:
      name: withdrawalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DateFrom:
      name: from
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: to
      in: query
      schema: { type: string, format: date }

    TipId:
      name: tipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

    DriverId:
      name: driverId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FareId:
      name: fareId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RideId:
      name: rideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Folio:
      name: folio
      in: path
      required: true
      description: Folio impreso en la constancia; no distingue mayusculas.
      schema: { type: string, minLength: 4, maxLength: 20 }
    SpotId:
      name: spotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionId:
      name: optionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validación fallida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: bad_request
              message: Validation failed
              details:
                - field: body.email
                  message: must be a valid email
    Unauthorized:
      description: Falta el token o no es válido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Sin permiso (rol insuficiente u otro club)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: Contraviene una regla de negocio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Demasiadas peticiones
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict,
                     unprocessable, too_many_requests, internal_error, not_implemented]
            message: { type: string }
            details:
              description: Presente en errores de validación y de disponibilidad.
              type: array
              items: { type: object, additionalProperties: true }
            request_id:
              type: string
              description: Identificador de la petición, útil para buscar en los registros.

    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Importe decimal con dos decimales, como cadena para no perder precisión.
      example: '1500.00'

    Currency:
      type: string
      enum: [MXN, USD]

    Role:
      type: string
      enum: [guest, waiter, bartender, dancer, dj, light_tech, valet, hostess, manager, admin]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        nightclub_id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        locale: { type: string, example: es-MX }
        preferred_currency: { $ref: '#/components/schemas/Currency' }

    RegisterRequest:
      type: object
      required: [nightclub_slug, email, password, first_name, birth_date, accept_terms]
      properties:
        nightclub_slug: { type: string, example: ev2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, maxLength: 100, default: '' }
        phone: { type: string, maxLength: 30 }
        birth_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Debe corresponder a 18 años o más.
        accept_terms:
          type: boolean
          enum: [true]
          description: Obligatorio; se guarda la versión y la fecha de aceptación.
        accept_flirts:
          type: boolean
          default: false
          description: Consentimiento explícito para recibir mensajes de otras personas.

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: string, example: 15m }
        refresh_token: { type: string, description: De un solo uso. }

    AuthResponse:
      allOf:
        - { $ref: '#/components/schemas/TokenPair' }
        - type: object
          properties:
            user: { $ref: '#/components/schemas/User' }

    NightclubPublic:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        city: { type: string }
        country: { type: string }
        timezone: { type: string, example: America/Hermosillo }
        currency_default: { $ref: '#/components/schemas/Currency' }

    Nightclub:
      allOf:
        - { $ref: '#/components/schemas/NightclubPublic' }
        - type: object
          properties:
            address: { type: string }
            phone: { type: string }
            capacity: { type: integer }
            settings: { type: object, additionalProperties: true }

    StaffMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        stage_name:
          type: [string, 'null']
          description: Nombre artístico, para bailarinas y DJ.
        avatar_url: { type: [string, 'null'] }
        on_shift: { type: boolean }
        section: { type: [string, 'null'] }

    SyncEvent:
      type: object
      properties:
        id:
          type: string
          description: Entero de 64 bits serializado como cadena (ver `last_id`).
        type:
          type: string
          example: order_created
          description: |
            `order_created`, `order_confirmed`, `order_preparing`, `order_ready`,
            `order_delivered`, `order_cancelled`, `table_updated`,
            `reservation_created`, `reservation_confirmed`, `reservation_seated`,
            `reservation_completed`, `reservation_no_show`, `reservation_cancelled`.
        audience:
          type: object
          properties:
            roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
            userIds: { type: array, items: { type: string, format: uuid } }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Dashboard:
      type: object
      properties:
        tables:
          type: object
          properties:
            total: { type: integer }
            occupied: { type: integer }
            available: { type: integer }
            reserved: { type: integer }
        orders:
          type: object
          properties:
            in_progress: { type: integer }
            ready: { type: integer }
            delivered_today: { type: integer }
            pos_errors: { type: integer }
        revenue_today:
          type: array
          description: |
            No todo lo que pasa por el libro contable es dinero del club. `total` es lo que
            el club se queda (consumo, servicio de botella, reservaciones, valet, ajustes);
            `to_staff` son propinas y canciones, que son del empleado, y `to_drivers` las
            tarifas de taxi, que son del conductor. Los tres se reportan por separado en
            lugar de sumarse.
          items:
            type: object
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              total: { $ref: '#/components/schemas/Money' }
              count: { type: integer, description: Movimientos que son ingreso del club. }
              to_staff: { $ref: '#/components/schemas/Money' }
              to_drivers: { $ref: '#/components/schemas/Money' }
        staff:
          type: object
          properties:
            on_shift: { type: integer }
        generated_at: { type: string, format: date-time }

    Drink:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, example: cocktail }
        price: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
        available: { type: boolean }
        sort_order: { type: integer }
        stock: { type: string, description: Existencias actuales. }
        low_stock: { type: boolean }

    DrinkCreate:
      type: object
      required: [name, category, price]
      properties:
        name: { type: string, maxLength: 255 }
        category: { type: string, maxLength: 40 }
        price: { type: number, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, maxLength: 1000 }
        image_url: { type: string, format: uri }
        available: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }
        initial_stock: { type: number, minimum: 0, default: 0 }

    InventoryItem:
      type: object
      properties:
        drink_id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        quantity: { type: string }
        unit: { type: string, example: unit }
        low_stock_threshold: { type: string }
        synced_at: { type: [string, 'null'], format: date-time }

    Table:
      type: object
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: |
            Identificador único dentro del club. Normalmente es el número de la mesa;
            lleva prefijo de zona donde el número se repite (V16 en VIP Elevado frente
            a A16 en Zona Azul).
          example: V16
        table_number:
          type: [integer, 'null']
          description: El número con el que el personal se refiere a la mesa en voz alta.
          example: 16
        name: { type: [string, 'null'] }
        floor: { type: string, enum: [baja, alta, ambas] }
        color: { type: [string, 'null'], description: Color de la zona en el mapa., example: '#FF1493' }
        section: { type: string, example: ZONA DIAMANTE }
        type: { type: string, enum: [standard, vip, premium, bar_top, booth] }
        capacity: { type: integer }
        x: { type: string, description: Coordenada en el plano. }
        y: { type: string }
        radius: { type: string }
        status: { type: string, enum: [available, occupied, reserved, blocked, cleaning] }
        bottle_service: { type: boolean }
        occupants:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              display_name: { type: string }
              seated_at: { type: string, format: date-time }

    Landmark:
      description: Elemento del mapa que no es una mesa.
      type: object
      properties:
        code: { type: string, example: dj_booth }
        name: { type: string, example: DJ BOOTH }
        type:
          type: string
          enum: [bar, dance_area, dj, vip, entrance, restroom, stage, other]
        description: { type: [string, 'null'] }
        floor: { type: string, enum: [baja, alta, ambas] }
        x: { type: [string, 'null'] }
        y: { type: [string, 'null'] }
        width: { type: [string, 'null'] }
        height: { type: [string, 'null'] }

    OccupancyBucket:
      type: object
      properties:
        tables: { type: integer }
        occupied: { type: integer }
        available: { type: integer }
        reserved: { type: integer }
        out_of_service: { type: integer, description: Bloqueadas o en limpieza. }
        seats: { type: integer, description: Aforo sentado. }
        guests: { type: integer, description: Personas sentadas ahora mismo. }
        tables_occupied_pct: { type: integer }
        seats_used_pct: { type: integer }

    OrderItemInput:
      type: object
      required: [drink_id]
      properties:
        drink_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
        notes: { type: string, maxLength: 120 }

    OrderCreate:
      type: object
      required: [client_request_id, items]
      properties:
        client_request_id:
          type: string
          format: uuid
          description: UUID generado por el cliente; garantiza que no se dupliquen pedidos.
        table_id: { type: string, format: uuid }
        recipient_id:
          type: string
          format: uuid
          description: Para invitar una bebida a otra persona.
        on_behalf_of:
          type: string
          format: uuid
          description: >
            Solo personal. El cliente sentado en `table_id` para quien se levanta el
            pedido: el cobro queda a su nombre. Si la persona no está en esa mesa: 422.
        message: { type: string, maxLength: 280 }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/OrderItemInput' }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, cancelled, pos_error]
        subtotal: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        message: { type: [string, 'null'] }
        table_id: { type: [string, 'null'], format: uuid }
        table_code: { type: [string, 'null'] }
        table_section: { type: [string, 'null'] }
        table_floor: { type: [string, 'null'] }
        bar_location_id:
          type: [string, 'null']
          format: uuid
          description: >
            La barra de la que sale y en la que se descuenta el inventario: la que atiende
            la zona de la mesa, o la que indique quien lo levanta en una venta en barra.
        bar_name: { type: [string, 'null'] }
        bar_code: { type: [string, 'null'] }
        delivery_point_id:
          type: [string, 'null']
          format: uuid
          description: A dónde se lleva cuando no es una mesa (un punto de la pista o la terraza).
        delivery_point_name: { type: [string, 'null'] }
        delivery_point_kind: { type: [string, 'null'], enum: [table, floor, terrace, bar, null] }
        prep_started_at:
          type: [string, 'null']
          format: date-time
          description: Cuándo la barra empezó a prepararlo de verdad.
        bar_position:
          type: [integer, 'null']
          description: >
            El orden en que el cantinero decidió prepararlos. Es una preferencia de
            pantalla: no toca la hora de creación ni la de pago, que son la auditoría.
        sender_id: { type: string, format: uuid }
        sender_name: { type: [string, 'null'] }
        recipient_id: { type: [string, 'null'], format: uuid }
        recipient_name: { type: [string, 'null'] }
        bartender_id: { type: [string, 'null'], format: uuid }
        taken_by:
          type: [string, 'null']
          format: uuid
          description: Mesero que levantó el pedido. Nulo cuando el cliente lo pidió desde su propio teléfono.
        taken_by_name: { type: [string, 'null'] }
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: El cobro del pedido. Nulo solo si el pedido no cuesta nada.
        payment_status:
          type: string
          enum: [not_required, pending, pending_manual, paid, failed, refunded, cancelled]
          description: >
            Estado del cobro. La barra no puede confirmar el pedido mientras no sea `paid`;
            pagarlo lo confirma solo. `not_required` es un pedido sin costo.
        returned_to_sender:
          type: boolean
          description: Invitación rechazada por el receptor y devuelta a la mesa del emisor (nunca cancelada ni reembolsada).
        returned_at: { type: [string, 'null'], format: date-time }
        pos_order_id:
          type: [string, 'null']
          description: Identificador en el punto de venta (fase 4).
        pos_error: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            properties:
              drink_id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              unit_price: { $ref: '#/components/schemas/Money' }
              notes: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }

    EventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        event_date: { type: string, format: date }
        doors_open_at: { type: string, format: date-time }
        ticket_price: { type: number }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [draft, published, cancelled, finished] }
        arrival_deadline: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: [string, 'null'] }
        event_date: { type: string, format: date }
        doors_open_at: { type: string, format: date-time }
        closes_at: { type: [string, 'null'], format: date-time }
        ticket_price: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        arrival_deadline_minutes: { type: integer }
        arrival_deadline: { type: string, format: date-time }
        deposit_pct:
          type: [number, 'null']
          description: |
            El anticipo de ESTA noche, en por ciento. `null` significa que se usa el
            del club (`reservation_rules.deposit_pct`), y es distinto de `0`, que
            significa que esta noche se aparta sin cobrar nada.

        status: { type: string, enum: [draft, published, cancelled, finished] }
        description: { type: [string, 'null'] }
        cover_image_url: { type: [string, 'null'] }
        reservations_count: { type: integer }
        zone_overrides:
          type: array
          description: Zonas ajustadas solo para esta noche.
          items: { $ref: '#/components/schemas/ZoneOverrideStored' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventCreate:
      type: object
      required: [name, event_date, doors_open_at, ticket_price]
      properties:
        name: { type: string, maxLength: 150 }
        event_date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        doors_open_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        ticket_price: { type: number, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        arrival_deadline_minutes:
          type: integer
          minimum: 15
          maximum: 720
          default: 180
          description: Minutos desde la apertura para llegar; despues la mesa se libera sin reembolso.
        deposit_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: |
            Sobrescribe el anticipo del club **solo para esta noche** (migración 020):
            un 31 de diciembre puede pedir el 100% -- una mesa que se cae esa noche no
            se vuelve a vender -- y un martes de temporada baja el 10%, sin mover la
            lista vigente ni tener que acordarse de volverla a poner.

            Omitirlo, o mandarlo como `null`, devuelve la noche al anticipo del club.
            Eso **no** es lo mismo que `0`: cero es una noche que se aparta sin cobrar.

            El monto se congela en la reservación al reservar, así que cambiarlo
            después no altera lo ya vendido; cuando hay mesas apartadas, la respuesta
            del PATCH lo avisa en la cabecera `X-Warning`.
        status: { type: string, enum: [draft, published, cancelled], default: draft }
        description: { type: string, maxLength: 2000 }
        cover_image_url: { type: string, format: uri, maxLength: 500 }

    EventUpdate:
      allOf:
        - { $ref: '#/components/schemas/EventCreate' }
        - type: object
          properties:
            status: { type: string, enum: [draft, published, cancelled, finished] }

    ZoneQuote:
      type: object
      description: Regla de la zona con la que se calculo el precio.
      properties:
        section: { type: string }
        display_name: { type: string }
        base_price: { type: number }
        included_tickets: { type: integer }
        max_extras: { type: integer }
        max_guests: { type: integer }
        overridden: { type: boolean, description: true si esa noche tiene precio propio. }

    ZonePricing:
      type: object
      properties:
        section: { type: string }
        display_name: { type: string }
        base_price: { $ref: '#/components/schemas/Money' }
        included_tickets: { type: integer }
        max_extras: { type: integer }
        max_guests: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        color: { type: [string, 'null'] }
        includes:
          type: array
          items: { type: string }
        reservable: { type: boolean }
        sort_order: { type: integer }

    ZonePricingUpdate:
      type: object
      required: [base_price, included_tickets]
      properties:
        display_name: { type: string, maxLength: 80 }
        base_price: { type: number, minimum: 0 }
        included_tickets: { type: integer, minimum: 1 }
        max_extras: { type: integer, minimum: 0, default: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        color: { type: string, maxLength: 9 }
        includes:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 120 }
        reservable: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }

    ZoneOverride:
      type: object
      description: Cada campo en `null` vuelve al valor de la lista estandar.
      properties:
        base_price: { type: [number, 'null'], minimum: 0 }
        included_tickets: { type: [integer, 'null'], minimum: 1 }
        max_extras: { type: [integer, 'null'], minimum: 0 }
        reservable: { type: [boolean, 'null'] }
        note: { type: [string, 'null'], maxLength: 300 }

    ZoneOverrideStored:
      type: object
      properties:
        section: { type: string }
        base_price: { type: [string, 'null'] }
        included_tickets: { type: [integer, 'null'] }
        max_extras: { type: [integer, 'null'] }
        reservable: { type: [boolean, 'null'] }
        note: { type: [string, 'null'] }

    EffectiveZone:
      type: object
      description: Precio de la zona ya resuelto para una noche concreta.
      properties:
        section: { type: string }
        display_name: { type: string }
