openapi: 3.1.0
info:
  title: EV2 Clandestinoz API
  version: 0.1.0
  description: |
    API del sistema de gestión de nightclub EV2 Clandestinoz.

    **Este archivo es el contrato entre backend, web y apps móviles.** Cualquier cambio
    de ruta o de forma de respuesta se refleja aquí en el mismo commit que lo introduce.

    ## Autenticación
    Salvo las rutas marcadas como públicas, toda petición requiere
    `Authorization: Bearer <access_token>`. El token de acceso dura 15 minutos; se renueva
    con `POST /api/auth/refresh` usando el refresh token, que es de **un solo uso**
    (al canjearlo se revoca y se emite uno nuevo).

    ## Errores
    Todos los errores tienen la misma forma (`ErrorResponse`). Los códigos usados son
    400 validación, 401 sin autenticar, 403 sin permiso, 404 no existe, 409 conflicto de
    estado, 422 regla de negocio, 429 límite de peticiones, 500 interno, 501 no implementado.

    ## Dinero
    Los importes son cadenas decimales con dos decimales (`"1500.00"`) para no perder
    precisión, y siempre van acompañados de `currency` (`MXN` o `USD`). Los precios se
    calculan **siempre en el servidor**.

    ## Precios de reservación
    Una mesa se reserva por **toda la noche**, que corresponde a un evento del calendario.
    El precio es `base de la zona + (personas extra x precio del boleto de esa noche) +
    extras`. Cada zona incluye un número de boletos y admite un tope de extras (por
    ejemplo, Zona Roja incluye 8 personas y no admite extras). El gerente puede cambiar la
    lista estándar o ajustar una zona solo para un evento; las reservaciones ya hechas
    conservan congelado el precio con el que se pactaron.

    Quien no llega antes del plazo de llegada del evento (3 horas por omisión desde la
    apertura de puertas) pierde la mesa y el depósito.

    ## Flirt
    Nadie recibe un flirt sin activar `accept_flirts`, ni aparece en la lista sin activar
    `discoverable` (ambos nacen apagados). Emisor y receptor deben estar sentados en el
    club; un flirt caduca a las 12 horas. Límites: 20 por hora, 3 sin respuesta a la misma
    persona por noche, y «no me interesa» silencia a ese emisor el resto de la noche. Un
    bloqueo o una persona con reportes abiertos responde con un **404 neutro**. Un trago o
    botella enviado por flirt es un pedido real, **cobrado al emisor al pedirlo**; si el
    receptor lo rechaza, el pedido vuelve a la mesa del emisor y **nunca se reembolsa**.

    ## Empleados y dinero
    El club no retiene nada de las propinas y no hay monto mínimo de retiro. El saldo de un
    empleado nunca se guarda: se **calcula** desde el libro contable (lo cobrado como
    beneficiario menos lo retirado), por moneda. Las cuentas bancarias se validan (CLABE con
    dígito verificador, routing ABA con checksum), se cifran en la base y solo se muestran
    como `****1234`, también al gerente, quien debe **verificarlas** antes del primer retiro.
    Un retiro nace `pending`; el gerente lo aprueba (fijando el tipo de cambio de ese
    momento si hay conversión), lo rechaza, o lo marca `paid` cuando hizo la transferencia,
    y en ese momento se asienta la salida en el libro.

    ## Propinas y canciones
    Una propina escribe su fila en `tips` y su asiento en `transactions` en una sola
    transacción SQL, idempotente por `client_request_id`. Nace `pending` y solo entra al
    saldo del empleado cuando está `paid` (cobro con tarjeta en la fase 3; mientras, el
    gerente confirma las de efectivo). Los mínimos y sugeridos por rol son los que el club
    ya usaba y el gerente los edita; el club no retiene nada. Un trago al personal solo va a
    roles autorizados (ambientadoras) en turno, es un pedido real cobrado al enviarlo y, si
    lo rechazan, vuelve a la mesa del cliente sin reembolso. La propina al DJ es aparte de
    la solicitud de canción; el DJ no rechaza solicitudes, y la misma canción pedida por
    varias personas se junta en una sola con votos.

    ## Idempotencia
    Crear un pedido o una reservación exige un `client_request_id` (UUID generado por el
    cliente). Reenviar la misma petición devuelve el recurso original con la cabecera
    `Idempotent-Replay: true` en lugar de duplicarlo.
  contact:
    name: EV2 Clandestinoz
  license:
    name: Propietario — EV2 Clandestinoz
    url: https://github.com/Jovannyrdmx/ev2-app
servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://staging-api.CAMBIAR-DOMINIO.mx
    description: Staging (fase 7)
  - url: https://api.CAMBIAR-DOMINIO.mx
    description: Producción (fase 7)

tags:
  - name: Sistema
    description: Salud del servicio y webhooks.
  - name: Autenticación
    description: Registro, inicio de sesión, renovación y cierre de sesión.
  - name: Club
    description: Perfil del club, personal, contactos de emergencia, eventos y tablero.
  - name: Bebidas
    description: Catálogo y existencias.
  - name: Inventario
    description: |
      La existencia real: insumos, recetas, lugares (almacén y barras) y el kardex. El
      saldo vive en un insumo EN UN LUGAR, y todo cambio deja un renglón con su motivo.
  - name: Pedidos
    description: Pedidos de bebidas y flujo de la barra.
  - name: Mesas
    description: Plano del local, ocupación y edición del layout.
  - name: Eventos y precios
    description: |
      Calendario de noches, precio del boleto, lista de precios por zona y ajustes de
      precio para un evento concreto. Todo lo edita el gerente desde la aplicación.
  - name: Puerta
    description: |
      Escanear el pase de una reservación y vender la entrada. Todo esto lo hace el
      personal de la puerta con un teléfono y una fila enfrente.
  - name: Reservaciones
    description: Reglas, disponibilidad, cotización, reserva, llegada tardía y cancelación.
  - name: Flirt
    description: |
      Conexión entre clientes dentro del club: opt-in, solo sentados y solo esa noche.
      Bloqueos y reportes; trago o botella como pedido real. El gerente ve conteos y
      reportes, nunca mensajes.
  - name: Empleados
    description: |
      Alta por el gerente con contraseña temporal, perfil, cuentas bancarias cifradas y
      verificadas por el gerente, saldo calculado desde el libro contable, retiros con
      aprobación y tipo de cambio con historial.
  - name: Propinas y canciones
    description: |
      Turnos del personal, propinas (mínimos y sugeridos por rol, editables), tragos al
      personal autorizado, solicitudes de canción al DJ con votos y tablero de
      reconocimiento.
  - name: Taxi y salida segura
    description: |
      Conductores de confianza dados de alta por el gerente, disponibilidad declarada por
      el conductor, tarifas por zona, ciclo del viaje confirmado por el conductor, cobro en
      efectivo asentado en el libro y constancia de salida con folio verificable.
  - name: Valet
    description: |
      Recepcion de autos con comprobante QR, tablero del estacionamiento, entrega
      verificada con el token del QR y entrega sin QR autorizada por el gerente con
      constancia. El estacionamiento es gratis: lo que gana el valet es la propina.
  - name: Integración POS
    description: |
      Registro de la integracion con el punto de venta y enrolamiento del agente local:
      llave propia y rotable, latido, bitacora de sincronizaciones y salud. La lectura
      real de SoftRestaurant llega en la fase 4 (docs/POS_REAL.md).
  - name: Pagos manuales
    description: |
      Dinero que el club recibe fuera de una pasarela: efectivo, Zelle, Cash App,
      transferencia y SPEI. Nada de esto cobra por si solo; el cliente declara y el
      gerente confirma contra el estado de cuenta, y solo esa confirmacion mueve el
      libro contable.
  - name: Pagos
    description: Métodos de pago guardados por el usuario.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Sistema]
      summary: Estado del servicio
      description: Público. Usado por los healthchecks de Docker y por el monitoreo.
      security: []
      responses:
        '200':
          description: Servicio arriba
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: ev2-api }
                  timestamp: { type: string, format: date-time }

  /api/auth/register:
    post:
      operationId: postAuthRegister
      tags: [Autenticación]
      summary: Registrar un cliente
      description: |
        Público. Crea una cuenta con rol `guest`. Rechaza con 403 a menores de 18 años y
        exige aceptación de términos. El consentimiento para recibir flirts es opt-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Menor de edad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El correo ya está registrado en ese club
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/login:
    post:
      operationId: postAuthLogin
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Público. Limitado a 10 intentos fallidos por minuto y por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nightclub_slug, email, password]
              properties:
                nightclub_slug: { type: string, example: ev2 }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Cuenta bloqueada o eliminada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [Autenticación]
      summary: Renovar el token de acceso
      description: |
        Público (el refresh token es la credencial). El token entregado se **revoca** y se
        emite uno nuevo; reutilizar el anterior devuelve 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Refresh token inválido, expirado o ya usado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Autenticación]
      summary: Cerrar sesión en todos los dispositivos
      description: Revoca todos los refresh tokens del usuario.
      responses:
        '204': { description: Sesiones cerradas }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      operationId: getAuthMe
      tags: [Autenticación]
      summary: Usuario autenticado y sus preferencias
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  preferences:
                    type: [object, 'null']
                    properties:
                      accept_flirts: { type: boolean }
                      show_on_map: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================================
  # Entrar con una cuenta de otro (Facebook)
  #
  # El viaje completo, en orden:
  #   1. GET  /api/auth/oauth/providers            -> qué botones pintar
  #   2. GET  /api/auth/oauth/{provider}/start     -> 302 a la pantalla de permisos
  #   3. GET  /api/auth/oauth/{provider}/callback  -> 302 de vuelta, con un pase en el #
  #   4. POST /api/auth/oauth/handoff              -> canjea ese pase por la sesión
  #      o, si la cuenta es nueva:
  #      POST /api/auth/oauth/complete             -> pide fecha y términos, y crea
  #
  # Dos cosas que no son obvias y son las que hacen esto seguro:
  #
  #   - Lo que vuelve en el fragmento (`#h=`) NO es la sesión: es un pase de un solo
  #     uso que vive dos minutos. El fragmento se queda en el historial del navegador,
  #     y en un teléfono prestado la sesión ahí sería la cuenta del cliente al alcance
  #     del siguiente.
  #   - Una cuenta social NO se liga sola a una cuenta que ya existe por el correo.
  #     Quien logre que un proveedor le acepte un correo ajeno se quedaría con la
  #     cuenta del cliente, sus reservaciones y su historial.
  # ==========================================================================

  /api/auth/oauth/providers:
    get:
      operationId: getAuthOauthProviders
      tags: [Autenticación]
      summary: Proveedores de acceso disponibles
      description: |
        Público y sin secretos: lo pide un navegador sin sesión, así que no lleva el
        `app_secret` ni el `app_id`.

        Solo se pinta el botón de un proveedor con `enabled: true`. Los apagados vienen
        con el motivo: **Instagram** está declarado y apagado porque "Iniciar sesión con
        Instagram" ya no existe para cuentas personales (la Basic Display API se apagó el
        4 de diciembre de 2024 y sus sucesores solo aceptan cuentas Business o Creator, y
        no entregan correo).

        `password_available` es siempre `true`: el correo y la contraseña no dependen de
        la cuenta de nadie más.
      security: []
      responses:
        '200':
          description: Lista de proveedores
          content:
            application/json:
              schema:
                type: object
                properties:
                  any_enabled: { type: boolean }
                  password_available: { type: boolean }
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string, enum: [facebook, instagram, google, apple] }
                        label: { type: string, example: Facebook }
                        enabled:
                          type: boolean
                          description: Lo único que decide si se pinta el botón.
                        available:
                          type: boolean
                          description: |
                            `false` = el proveedor no se puede usar (no es que falte
                            configurarlo).
                        unavailable_reason:
                          type: string
                          example: instagram_consumer_login_discontinued
                        unavailable_note: { type: string }

  /api/auth/oauth/linked:
    get:
      operationId: getAuthOauthLinked
      tags: [Autenticación]
      summary: Cuentas sociales ligadas a mi cuenta
      description: |
        `can_unlink` es `false` cuando la cuenta social es la **única** manera de entrar:
        quitarla dejaría a la persona fuera de su propia cuenta, con sus reservaciones
        adentro.
      responses:
        '200':
          description: Cuentas ligadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_password: { type: boolean }
                  can_unlink: { type: boolean }
                  identities:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        email: { type: [string, 'null'], format: email }
                        display_name: { type: [string, 'null'] }
                        linked_at: { type: string, format: date-time }
                        last_login_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/oauth/{provider}:
    delete:
      operationId: deleteAuthOauthByProvider
      tags: [Autenticación]
      summary: Quitar una cuenta social
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, example: facebook } }
      responses:
        '204': { description: Cuenta desvinculada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No hay ninguna cuenta de ese proveedor ligada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            Es la única manera de entrar (`details.reason = last_way_in`). Hay que ponerle
            una contraseña a la cuenta antes de quitarla.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/oauth/{provider}/start:
    get:
      operationId: getAuthOauthStartByProvider
      tags: [Autenticación]
      summary: Empezar el acceso con una cuenta social
      description: |
        Público. Contesta **302** hacia la pantalla de permisos del proveedor, no un JSON:
        así se puede poner en un `<a href>` y la pantalla de acceso funciona igual si el
        navegador del cliente bloqueó los scripts. No se llama con `fetch`.

        `redirect_to` se valida contra una lista blanca de páginas del propio sistema; un
        destino libre convertiría esto en un salto abierto con la cara del club.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, example: facebook } }
        - { name: nightclub_slug, in: query, required: true, schema: { type: string, example: ev2 } }
        - name: redirect_to
          in: query
          required: false
          description: Página del sistema a la que volver. Fuera de la lista blanca cae a `index.html`.
          schema: { type: string, example: index.html }
      responses:
        '302': { description: Redirección a la pantalla de permisos del proveedor }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: El proveedor o el club no existen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501':
          description: |
            El proveedor existe pero no se puede usar:
            `provider_unavailable` (Instagram: el login de consumidor ya no existe) o
            `provider_not_configured` (faltan credenciales; `details.missing` dice qué
            variables).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/oauth/{provider}/link:
    post:
      operationId: postAuthOauthLinkByProvider
      tags: [Autenticación]
      summary: Ligar una cuenta social a la sesión que ya existe
      description: |
        Aquí sí un JSON con la dirección, no un 302: esto lo llama la app con su sesión
        puesta y necesita abrir la dirección ella misma.

        Es el camino para quien ya tiene cuenta por correo: no se liga sola por el correo,
        se liga desde el perfil.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, example: facebook } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_to: { type: string, example: index.html }
      responses:
        '200':
          description: Dirección a la que mandar a la persona
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El proveedor no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501':
          description: El proveedor no se puede usar o no está configurado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/oauth/{provider}/callback:
    get:
      operationId: getAuthOauthCallbackByProvider
      tags: [Autenticación]
      summary: La vuelta del proveedor
      description: |
        Público, y la llama el **navegador del cliente**, no la app. Siempre termina en un
        **302** a una página del sistema, nunca en un JSON: la persona viene rebotada de
        Facebook y un JSON en pantalla es un callejón.

        Lo que pasa va en el fragmento de la dirección (`#`), que no viaja al servidor:

        | Fragmento | Qué significa |
        |---|---|
        | `#h=<pase>` | Entró. Canjear con `POST /api/auth/oauth/handoff`. Un solo uso, 2 minutos. |
        | `#oauth_signup=<token>` | Cuenta nueva: falta fecha de nacimiento y términos. Mandar a `POST /api/auth/oauth/complete`. |
        | `#oauth_linked=<provider>` | Se ligó a la sesión que ya existía. |
        | `#oauth_error=<código>` | `cancelled`, `provider`, `missing_code`, `expired_state`, `provider_unavailable`, `email_taken`, `already_linked`, `account_inactive`. |

        `email_taken` es a propósito y **no** es un fallo: ese correo ya tiene cuenta en el
        club, y ligarla sola sería regalar la cuenta a quien consiga que un proveedor le
        acepte un correo ajeno.

        El error que devuelva el proveedor nunca se reenvía al cliente: puede traer el id
        de la app y detalles de la configuración. Se registra del lado del servidor.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, example: facebook } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: error_description, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: Redirección a una página del sistema, con el resultado en el fragmento
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/auth/oauth/handoff:
    post:
      operationId: postAuthOauthHandoff
      tags: [Autenticación]
      summary: Canjear el pase de mano por la sesión
      description: |
        Público (el pase es la credencial) y de **un solo uso**: se borra al canjearlo, así
        que el que quede en el historial del navegador ya no abre nada. Vive dos minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoff]
              properties:
                handoff: { type: string, description: El valor que vino en `#h=`. }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: El pase venció o ya se usó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: La cuenta no está activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/oauth/complete:
    post:
      operationId: postAuthOauthComplete
      tags: [Autenticación]
      summary: Terminar un registro que empezó con una cuenta social
      description: |
        Público (el `completion_token` es la credencial). Vive 15 minutos y va firmado con
        un **emisor distinto** al de la sesión, así que presentarlo como `Bearer` se rechaza
        por el emisor y no por casualidad.

        Pide lo que el proveedor no puede dar y el club sí necesita: la **fecha de
        nacimiento** —de ella depende dejar entrar a alguien a un negocio de alcohol, y
        Facebook no la entrega de forma fiable— y la aceptación de términos. Misma
        comprobación de edad que el registro normal.

        La cuenta se crea con `password_hash = NULL`: no entra por contraseña, y no se le
        inventa un hash que parezca una credencial y no lo sea. El `email` solo hace falta
        si el proveedor no lo dio (el cliente puede negar ese permiso).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completion_token, birth_date, accept_terms]
              properties:
                completion_token: { type: string, description: El valor que vino en `#oauth_signup=`. }
                birth_date: { type: string, format: date, example: '1995-06-15' }
                accept_terms: { type: boolean, enum: [true] }
                email: { type: string, format: email }
                phone: { type: string, example: '+526311234567' }
      responses:
        '201':
          description: Cuenta creada y sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: El token de completar es inválido, venció, o es de otro tipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Ese correo ya tiene cuenta, o esa cuenta social ya está registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Menor de 18 años
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/nightclubs/by-slug/{slug}:
    get:
      operationId: getNightclubsBySlugBySlug
      tags: [Club]
      summary: Resolver un club por su identificador corto
      description: Público. La app web lo usa antes de que nadie inicie sesión.
      security: []
