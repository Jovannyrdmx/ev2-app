  /api/nightclubs/{nightclubId}/reservations/{reservationId}:
    get:
      operationId: getNightclubsByNightclubIdReservationsByReservationId
      tags: [Reservaciones]
      summary: Detalle de una reservación
      parameters:
        - { $ref: '#/components/parameters/NightclubId' }
        - { $ref: '#/components/parameters/ReservationId' }
      responses:
