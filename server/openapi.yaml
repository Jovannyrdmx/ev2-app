            section: { type: string }
            floor: { type: string }
            capacity: { type: integer }
        zone: { $ref: '#/components/schemas/ZoneQuote' }
        event: { $ref: '#/components/schemas/EventSummary' }
        guests: { type: integer }
        extra_guests: { type: integer }
        ticket_price: { type: number }
        extras_total: { type: number }
        addons:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              name: { type: string }
              price: { type: number }
              quantity: { type: integer }
