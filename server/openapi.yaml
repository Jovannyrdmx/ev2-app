  /api/me/payment-methods/{id}:
    delete:
      operationId: deleteMePaymentMethodsById
      tags: [Pagos]
      summary: Eliminar un método de pago
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/webhooks/pos:
    post:
      operationId: postWebhooksPos
      tags: [Sistema]
      summary: Webhook del punto de venta
      description: |
        Reservado para la fase 4. Hoy responde 501: el mecanismo real de integración con
        SoftRestaurant 11 se define en `docs/POS_REAL.md` (decisión D16, agente local).
      security: []
      responses:
        '501':
          description: No implementado todavía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Firma del webhook inválida (a partir de la fase 4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/nightclubs/{nightclubId}/taxi-settings:
