        certificate_expires_at: { type: [string, 'null'], format: date-time }
        transaction_id: { type: [string, 'null'], format: uuid }
        driver:
          oneOf:
            - { $ref: '#/components/schemas/RideDriver' }
            - { type: 'null' }
        guest:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }

