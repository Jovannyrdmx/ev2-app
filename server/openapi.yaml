        event_id: { type: [string, 'null'], format: uuid }
        event_name: { type: [string, 'null'] }
        event_date: { type: [string, 'null'], format: date }
        doors_open_at: { type: [string, 'null'], format: date-time }
        event_status: { type: [string, 'null'] }
        arrival_deadline: { type: [string, 'null'], format: date-time }
