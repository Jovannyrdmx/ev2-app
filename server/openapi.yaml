        currency: { $ref: '#/components/schemas/Currency' }
        min_advance_hours: { type: integer }
        max_duration_minutes: { type: integer }
        cancellation_windows:
          type: array
          description: Ordenadas de mayor a menor antelación; se aplica la primera que se cumple.
          items:
            type: object
            properties:
              hours: { type: number, example: 48 }
              refund_pct: { type: number, example: 100 }

    ReservationRulesUpdate:
      type: object
      properties:
        min_party_size: { type: integer, minimum: 1 }
        max_party_size: { type: integer, minimum: 1 }
        deposit_pct: { type: number, minimum: 0, maximum: 100 }
        base_price_per_hour: { type: number, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        min_advance_hours: { type: integer, minimum: 0 }
        max_duration_minutes: { type: integer, minimum: 30, maximum: 720 }
        cancellation_windows:
          type: array
          minItems: 1
          items:
            type: object
            required: [hours, refund_pct]
            properties:
              hours: { type: number, minimum: 0 }
              refund_pct: { type: number, minimum: 0, maximum: 100 }

    AddonInput:
      type: object
      description: |
        Un extra se pide por `code` del catálogo (el precio lo pone el servidor) o como
        línea libre con `name` y `price`.
      properties:
        code:
          type: string
          maxLength: 40
          description: Código en `reservation-products`. Si viene, manda sobre `name` y `price`.
        type:
          type: string
          enum: [bottle_service, vip_upgrade, extra_hour, decorations, other]
          default: other
        name: { type: string, maxLength: 120 }
        price: { type: number, minimum: 0 }
        quantity: { type: integer, minimum: 1, maximum: 50, default: 1 }

    Availability:
      type: object
      properties:
        event: { $ref: '#/components/schemas/EventSummary' }
        guests: { type: integer }
        deposit_pct: { type: number }
        tables:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Table' }
              - type: object
                properties:
                  zone: { $ref: '#/components/schemas/ZoneQuote' }
                  price: { type: number, description: Total de la noche para ese grupo. }
                  extra_guests: { type: integer }
                  extras_total: { type: number, description: Personas extra x boleto del evento. }
                  deposit: { type: number }
                  currency: { $ref: '#/components/schemas/Currency' }

    Quote:
      type: object
      properties:
        table:
          type: object
          properties:
            id: { type: string, format: uuid }
