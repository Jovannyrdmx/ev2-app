  /api/nightclubs/{nightclubId}/floor-plan:
    get:
      operationId: getNightclubsByNightclubIdFloorPlan
      tags: [Mesas]
      summary: Plano completo del local
      description: |
        Todo lo necesario para dibujar el mapa: mesas con sus coordenadas y ocupación
        actual, las áreas que no son mesas (barra, pista, cabina del DJ, entrada, baños)
        y el tamaño del lienzo. EV2 Clandestinoz tiene dos plantas: sin filtro se
