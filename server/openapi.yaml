                  settings: { $ref: '#/components/schemas/TaxiSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putTaxiSettings
      tags: [Taxi y salida segura]
      summary: Editar los ajustes (gerente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxiSettingsUpdate' }
      responses:
        '200':
          description: Ajustes actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/TaxiSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

