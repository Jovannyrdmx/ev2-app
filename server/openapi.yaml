      summary: Mesas disponibles con su precio
      description: |
        Mesas libres para una noche (un evento), con el precio y el depósito ya calculados
        para ese número de personas. Solo aparecen las zonas reservables cuya regla admite
        al grupo (`boletos incluidos + extras >= guests`).
      parameters:
