        currency: { $ref: '#/components/schemas/Currency' }
        min_advance_hours: { type: integer }
        max_duration_minutes: { type: integer }
        cancellation_windows:
          type: array
          description: Ordenadas de mayor a menor antelación; se aplica la primera que se cumple.
          items:
            type: object
            properties:
              hours: { type: number, example: 48 }
              refund_pct: { type: number, example: 100 }

    ReservationRulesUpdate:
      type: object
      properties:
        min_party_size: { type: integer, minimum: 1 }
        max_party_size: { type: integer, minimum: 1 }
        deposit_pct: { type: number, minimum: 0, maximum: 100 }
        base_price_per_hour: { type: number, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        min_advance_hours: { type: integer, minimum: 0 }
        max_duration_minutes: { type: integer, minimum: 30, maximum: 720 }
