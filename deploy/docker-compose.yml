# EV2 Clandestinoz - local / staging stack
# Usage (from repo root):  docker compose -f deploy/docker-compose.yml up -d
# Required in .env: DB_PASSWORD, JWT_SECRET, BANK_ENCRYPTION_KEY (no defaults on purpose).

name: ev2

services:
  postgres:
    image: postgres:15-alpine
    container_name: ev2-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:-ev2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ev2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [ev2]

  redis:
    image: redis:7-alpine
    container_name: ev2-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [ev2]

  api:
    build:
      # Igual que en producción: la raíz del repositorio, porque la imagen lleva
      # también `agent/` (D57). Ver deploy/Dockerfile.api.
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: ev2-api
    # Apply pending migrations, then start the API.
    command: ["sh", "-c", "node src/db/migrate.js && node src/index.js"]
    environment:
      NODE_ENV: ${ENVIRONMENT:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      BANK_ENCRYPTION_KEY: ${BANK_ENCRYPTION_KEY:?BANK_ENCRYPTION_KEY is required in .env}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ev2}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Solo lo usa `npm run seed`, que se niega a correr con NODE_ENV=production.
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SOFTRESTAURANT11_URL: ${SOFTRESTAURANT11_URL:-}
      SOFTRESTAURANT11_API_KEY: ${SOFTRESTAURANT11_API_KEY:-}
      SOFTRESTAURANT11_WEBHOOK_SECRET: ${SOFTRESTAURANT11_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # El acceso del personal por PIN (D46). Faltaba aquí igual que faltó en el de
      # producción: sin ella no se le puede dar de alta a ningún empleado.
      PIN_LOOKUP_KEY: ${PIN_LOOKUP_KEY:-}
      # Cobro con terminal (D47). Mismas variables que en producción.
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_ENV: ${MERCADOPAGO_ENV:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      # Las fotos de los tickets. Mismo lugar que en produccion, para que probar en
      # local pruebe de verdad lo que va a correr en el servidor.
      RECEIPTS_DIR: /app/var/receipts
    volumes:
      - receipt_photos:/app/var/receipts
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [ev2]

  ws:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.ws
    container_name: ev2-ws
    environment:
      NODE_ENV: ${ENVIRONMENT:-development}
      PORT: 4000
      API_URL: http://api:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      # ws.js valida cada conexion contra la tabla users (no confia en el token),
      # asi que necesita la base igual que la API. Sin esto arranca, falla el
      # SELECT 1 y sale con codigo 1 en bucle.
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ev2}
    ports:
      - "${WS_PORT:-4000}:4000"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [ev2]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: ev2-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    # nginx resuelve los nombres de los upstream al arrancar: si `ws` no existe todavia,
    # el contenedor web no levanta.
    depends_on:
      - api
      - ws
    restart: unless-stopped
    networks: [ev2]

  # Reverse proxy with TLS: only for servers (Phase 7). Enable with --profile proxy.
  nginx:
    image: nginx:1.27-alpine
    container_name: ev2-proxy
    profiles: [proxy]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-nightclub.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on: [web, api, ws]
    restart: unless-stopped
    networks: [ev2]

networks:
  ev2:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  receipt_photos:
