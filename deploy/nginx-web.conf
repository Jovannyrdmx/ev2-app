server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------------
    # El DNS interno de Docker, resuelto EN CADA PETICION (D60).
    #
    # Sin esto, nginx resuelve el nombre `api` UNA sola vez, al arrancar, y se queda
    # con esa IP para siempre. El 26 de septiembre de 2026 eso tuvo el club caido
    # quince horas: se reconstruyo el contenedor de la API, le toco otra IP, y nginx
    # siguio golpeando la vieja — `connect() failed (111: Connection refused)` — y
    # contestando 502 a TODO. La API estaba sana y respondiendo; nadie podia entrar.
    #
    # `127.0.0.11` es el resolvedor que Docker mete en cada contenedor. `valid=10s`
    # es cuanto se cachea. Y el nombre tiene que ir en una VARIABLE: con
    # `proxy_pass http://api:3000` a secas, nginx resuelve al arrancar y este
    # resolvedor no se usa nunca. Es la variable lo que lo obliga a preguntar de nuevo.
    #
    # `ipv6=off` porque estos contenedores hablan IPv4 entre ellos; sin eso nginx
    # puede quedarse esperando una respuesta AAAA que no llega.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Las pantallas y su codigo se REVALIDAN en cada carga. Sin esto nginx no mandaba
    # ninguna cabecera de cache, y el navegador podia seguir usando por su cuenta el
    # JavaScript de la version anterior horas despues de un despliegue: el servidor ya
    # tenia el arreglo y la pantalla seguia ensenando el error viejo. `no-cache` no es
    # "no guardar": guarda, pero pregunta antes de usarlo, y con el ETag la respuesta es
    # un 304 de unos bytes. Las cabeceras de seguridad se repiten porque un `add_header`
    # dentro de un location anula las del bloque `server`.
    location ~* \.(?:html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # La aplicacion pide /api en el mismo origen. Sin esto, nginx devolveria 404 a cada
    # llamada y la pantalla de acceso se veria bien pero no haria nada. Ademas, al ser
    # el mismo origen, no hace falta CORS.
    # El `^~` NO es decorativo. En nginx una regla por expresion regular le gana a una
    # por prefijo, asi que sin el, la regla de arriba —la de las extensiones— se
    # quedaba con cualquier direccion de /api/ que terminara en .js, .css o .html y la
    # buscaba entre los archivos estaticos: 404. Eso dejaba sin bajar
    # /api/print-agent/files/print-agent.js (D57), o sea que una PC de barra no se
    # podia instalar, mientras el resto de la API contestaba de lo mas bien. `^~` le
    # dice a nginx que si algo empieza por /api/ ya no mire las expresiones regulares.
    location ^~ /api/ {
        set $ev2_api http://api:3000;
        proxy_pass $ev2_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket del servidor de tiempo real. Necesita HTTP/1.1 y las cabeceras de
    # actualizacion de protocolo; sin ellas el socket nunca abre y la app se queda
    # "Conectando..." para siempre. El tiempo de espera es largo a proposito: una
    # conexion en vivo esta callada entre evento y evento.
    location /ws {
        set $ev2_ws http://ws:4000;
        proxy_pass $ev2_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
