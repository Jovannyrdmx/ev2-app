name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate OpenAPI contract
        run: npm run lint:api

      - name: Tests
        run: npm test -- --passWithNoTests

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create CI env file (dummy secrets, build only)
        run: |
          cat > .env <<'ENV'
          DB_PASSWORD=ci-only-not-a-real-password
          JWT_SECRET=ci-only-not-a-real-secret
          ENV

      - name: Build images
        run: docker compose --env-file .env -f deploy/docker-compose.yml build

      - name: Validate compose file
        run: docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
