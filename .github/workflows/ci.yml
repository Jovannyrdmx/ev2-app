name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ev2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci-password
      DB_NAME: ev2_test
      BANK_ENCRYPTION_KEY: ci-only-not-a-real-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate OpenAPI contract
        run: npm run lint:api

      - name: Tests with coverage
        run: npm run test:coverage

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create CI env file (dummy secrets, build only)
        run: |
          cat > .env <<'ENV'
          DB_PASSWORD=ci-only-not-a-real-password
          JWT_SECRET=ci-only-not-a-real-secret
          BANK_ENCRYPTION_KEY=ci-only-not-a-real-key-0123456789abcdef
          ENV

      - name: Build images
        run: docker compose --env-file .env -f deploy/docker-compose.yml build

      - name: Validate compose file
        run: docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
